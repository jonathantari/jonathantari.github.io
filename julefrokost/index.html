<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Julefrokost</title>
<meta name="description" content="Skriv dig på listen.">
<meta name="theme-color" content="#121a15">
<meta property="og:title" content="Julefrokost">
<meta property="og:description" content="Skriv dig på listen.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23121a15'/%3E%3Cpath d='M16 6c3 5 5 8 5 11a5 5 0 0 1-10 0c0-3 2-6 5-11z' fill='%23f2b544'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400;1,9..144,600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#121a15; --bg2:#18241d;
  --card:rgba(255,248,235,.045); --line:rgba(255,240,215,.11);
  --ink:#f6eddc; --mute:rgba(246,237,220,.58); --faint:rgba(246,237,220,.34);
  --red:#c2392f; --red2:#a32c23; --gold:#f2b544;
  --r:18px; --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{
  min-height:100svh;color:var(--ink);font:400 16px/1.45 "DM Sans",system-ui,sans-serif;
  background:
    radial-gradient(120% 60% at 50% -8%,rgba(242,181,68,.20),transparent 60%),
    radial-gradient(90% 50% at 50% 115%,rgba(194,57,47,.14),transparent 70%),
    var(--bg);
  overflow-x:hidden;-webkit-font-smoothing:antialiased;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;-webkit-tap-highlight-color:transparent}

/* snow */
#snow{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
#snow i{position:absolute;top:-10px;border-radius:50%;background:#fff;opacity:.0;animation:fall linear infinite}
@keyframes fall{0%{transform:translate3d(0,-10px,0);opacity:0}10%{opacity:var(--o)}100%{transform:translate3d(var(--dx),105vh,0);opacity:0}}

main{
  position:relative;z-index:1;max-width:420px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 56px) 20px calc(env(safe-area-inset-bottom) + 40px);
}

/* info button */
#infoBtn{
  position:fixed;z-index:3;top:calc(env(safe-area-inset-top) + 14px);right:max(14px,env(safe-area-inset-right));
  width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
  border:1px solid var(--line);background:rgba(18,26,21,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  font:italic 600 18px/1 "Fraunces",serif;color:var(--gold);transition:transform .2s var(--ease);
}
#infoBtn:active{transform:scale(.92)}

/* header */
header{text-align:center;margin-bottom:34px}
.flame{width:26px;height:40px;margin:0 auto 14px;position:relative}
.flame svg{width:100%;height:100%;overflow:visible;transform-origin:50% 90%;animation:flick 3.2s ease-in-out infinite}
.flame::after{content:"";position:absolute;left:50%;top:55%;width:120px;height:120px;transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(242,181,68,.32),transparent 65%);filter:blur(4px);animation:glow 3.2s ease-in-out infinite;pointer-events:none}
@keyframes flick{0%,100%{transform:rotate(-2deg) scaleY(1)}30%{transform:rotate(2.5deg) scaleY(1.06)}55%{transform:rotate(-1deg) scaleY(.96)}80%{transform:rotate(1.5deg) scaleY(1.03)}}
@keyframes glow{0%,100%{opacity:.85}50%{opacity:1}}
h1{font:italic 400 clamp(46px,14vw,58px)/1 "Fraunces",serif;letter-spacing:-.02em}
.sub{margin-top:10px;color:var(--mute);font-size:15px}

/* card */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:18px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.view{animation:rise .45s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.field{position:relative}
.field input{
  width:100%;height:56px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.18);
  padding:0 16px;font-size:18px;outline:none;transition:border-color .2s,box-shadow .2s;
}
.field input::placeholder{color:var(--faint)}
.field input:focus{border-color:rgba(242,181,68,.55);box-shadow:0 0 0 4px rgba(242,181,68,.12)}

.seg{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;position:relative;height:46px;
  border-radius:12px;background:rgba(0,0,0,.18);border:1px solid var(--line);padding:4px}
.seg button{position:relative;z-index:1;border-radius:9px;font-size:15px;font-weight:500;color:var(--mute);transition:color .25s}
.seg button[aria-pressed="true"]{color:var(--ink)}
.seg .thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:9px;
  background:rgba(255,248,235,.10);box-shadow:inset 0 0 0 1px rgba(255,240,215,.12);transition:transform .35s var(--ease)}
.seg[data-v="1"] .thumb{transform:translateX(100%)}

.go{
  margin-top:14px;width:100%;height:56px;border-radius:14px;font-size:17px;font-weight:600;letter-spacing:.01em;
  background:linear-gradient(180deg,var(--red),var(--red2));color:#fff7ea;
  box-shadow:0 10px 30px -12px rgba(194,57,47,.8),inset 0 1px 0 rgba(255,255,255,.15);
  transition:transform .15s var(--ease),opacity .2s;display:flex;align-items:center;justify-content:center;gap:10px;
}
.go:active{transform:scale(.98)}
.go[disabled]{opacity:.55}
.go .spin{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,247,234,.35);border-top-color:#fff7ea;animation:sp .7s linear infinite;display:none}
.go.busy .spin{display:block}.go.busy span{display:none}
@keyframes sp{to{transform:rotate(360deg)}}
.err{min-height:0;color:#f19a8f;font-size:14px;text-align:center;margin-top:10px}
.err:empty{display:none}

/* confirmed */
.done{text-align:center;padding:22px 18px 16px}
.check{width:48px;height:48px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;
  background:rgba(242,181,68,.14);color:var(--gold)}
.check svg{width:22px;height:22px}
.check path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .5s .15s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.done h2{font:italic 400 28px/1.15 "Fraunces",serif}
.done p{color:var(--mute);margin-top:6px;font-size:15px}
.acts{display:flex;justify-content:center;gap:8px;margin-top:18px}
.ghost{height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);font-size:14px;font-weight:500;color:var(--mute);transition:all .2s}
.ghost:active{background:rgba(255,248,235,.06)}
.ghost.warn{color:#f19a8f;border-color:rgba(241,154,143,.4)}

/* list */
.list{margin-top:30px}
.lh{display:flex;align-items:baseline;justify-content:space-between;padding:0 4px 10px}
.lh h3{font:italic 400 22px/1 "Fraunces",serif}
.lh small{color:var(--faint);font-size:13px;font-variant-numeric:tabular-nums}
ul{list-style:none}
li{display:flex;align-items:center;gap:12px;padding:11px 4px;border-top:1px solid var(--line);animation:rise .4s var(--ease) both}
li:first-child{border-top:0}
.av{width:32px;height:32px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;
  background:rgba(255,248,235,.07);color:var(--mute)}
li.me .av{background:rgba(242,181,68,.18);color:var(--gold)}
.nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:rgba(194,57,47,.18);color:#f3a097}
.you{font-size:12px;color:var(--gold)}
.empty{color:var(--faint);text-align:center;padding:18px 0;font-style:italic;font-family:"Fraunces",serif}
.skel li{height:54px}
.skel .bar{height:12px;width:40%;border-radius:6px;background:rgba(255,248,235,.06)}

/* sheet */
#sheet{position:fixed;inset:0;z-index:5;display:grid;align-items:end;visibility:hidden}
#sheet .scrim{position:absolute;inset:0;background:rgba(5,8,6,.55);opacity:0;transition:opacity .3s}
#sheet .panel{position:relative;margin:0 auto;width:100%;max-width:460px;background:var(--bg2);
  border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;
  padding:10px 22px calc(env(safe-area-inset-bottom) + 22px);transform:translateY(100%);transition:transform .4s var(--ease)}
#sheet.open{visibility:visible}
#sheet.open .scrim{opacity:1}
#sheet.open .panel{transform:none}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 18px}
.panel h3{font:italic 400 26px/1 "Fraunces",serif;margin-bottom:12px}
dl{display:grid;grid-template-columns:auto 1fr}
dt,dd{padding:13px 0;border-top:1px solid var(--line)}
dt{color:var(--mute);font-size:14px}
dd{text-align:right;padding-left:20px}
dd.tbd{color:var(--faint);font-style:italic}
.panel .ghost{width:100%;margin-top:18px;height:48px;font-size:15px}

.foot{text-align:center;margin-top:34px;color:var(--faint);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}#snow{display:none}}
</style>
</head>
<body>
<div id="snow" aria-hidden="true"></div>

<button id="infoBtn" aria-label="Info om festen" aria-haspopup="dialog">i</button>

<main>
  <header>
    <div class="flame" aria-hidden="true">
      <svg viewBox="0 0 26 40"><defs><linearGradient id="fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe3a3"/><stop offset=".6" stop-color="#f2b544"/><stop offset="1" stop-color="#d9622b"/></linearGradient></defs>
      <path d="M13 1C17 10 23 16 23 25a10 10 0 0 1-20 0C3 16 9 10 13 1z" fill="url(#fl)"/>
      <path d="M13 17c2 4 4 6 4 9a4 4 0 0 1-8 0c0-3 2-5 4-9z" fill="#fff4d6" opacity=".85"/></svg>
    </div>
    <h1>Julefrokost</h1>
    <p class="sub" id="sub">Skriv dig på listen</p>
  </header>

  <section id="stage" aria-live="polite"></section>

  <section class="list" aria-labelledby="lt">
    <div class="lh"><h3 id="lt">Hvem kommer</h3><small id="count"></small></div>
    <ul id="guests" class="skel"><li><span class="av"></span><span class="bar"></span></li><li><span class="av"></span><span class="bar" style="width:55%"></span></li><li><span class="av"></span><span class="bar" style="width:32%"></span></li></ul>
  </section>

  <p class="foot">God jul</p>
</main>

<div id="sheet" role="dialog" aria-modal="true" aria-labelledby="st">
  <div class="scrim" data-close></div>
  <div class="panel">
    <div class="grab"></div>
    <h3 id="st">Praktisk</h3>
    <dl id="facts"></dl>
    <button class="ghost" data-close>Luk</button>
  </div>
</div>

<template id="tForm">
  <form class="card view" novalidate>
    <label class="field"><span class="sr">Dit navn</span>
      <input name="name" autocomplete="given-name" autocapitalize="words" enterkeyhint="done" maxlength="40" placeholder="Dit navn" required>
    </label>
    <div class="seg" data-v="0" role="group" aria-label="Kommer du alene?">
      <span class="thumb"></span>
      <button type="button" data-p="0" aria-pressed="true">Kun mig</button>
      <button type="button" data-p="1" aria-pressed="false">Mig + 1</button>
    </div>
    <button class="go" type="submit"><span>Jeg kommer</span><i class="spin"></i></button>
    <p class="err" role="alert"></p>
  </form>
</template>

<template id="tDone">
  <div class="card done view">
    <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h2></h2>
    <p></p>
    <div class="acts">
      <button class="ghost" data-a="edit">Ret</button>
      <button class="ghost" data-a="drop">Meld fra</button>
    </div>
    <p class="err" role="alert"></p>
  </div>
</template>

<script>
/* ---------- Fill these in ---------- */
var EVENT = {
  Dato: "",   // fx "Lørdag 12. december"
  Tid:  "",   // fx "18:00"
  Sted: "",   // fx "Møntergade, København"
  Pris: ""    // fx "200 kr. — MobilePay 12345678"
};
/* RSVP backend (same contract for Vercel or Apps Script) */
var API = "";
/* ------------------------------------ */

(function () {
  "use strict";
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var stage = $("#stage"), list = $("#guests"), count = $("#count"), sub = $("#sub");
  var state = { mine: null, guests: [], total: 0 }, editing = false;

  /* device id — remembers this phone, so housemates can each sign up */
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
  var dev = store("jf.d");
  if (!dev) {
    dev = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
      : "x" + Date.now().toString(36) + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
    store("jf.d", dev);
  }

  /* api */
  function call(body) {
    if (!API) return demo(body);
    var req = body
      ? fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(Object.assign({ d: dev }, body)) })
      : fetch(API + (API.indexOf("?") < 0 ? "?" : "&") + "d=" + encodeURIComponent(dev), { cache: "no-store" });
    return req.then(function (r) { return r.json().then(function (j) { if (!r.ok || j.error) throw new Error(j.error || r.status); return j; }); });
  }
  function demo(body) { // local-only preview when API is empty
    var db = JSON.parse(store("jf.demo") || '{"rows":[{"n":"Mette","p":1},{"n":"Søren","p":0},{"n":"Ida Holm","p":1}]}');
    db.rows = db.rows.filter(function (r) { return !(body && r.h === dev); });
    if (body && body.action !== "remove") db.rows.push({ n: body.name, p: body.plus, h: dev });
    store("jf.demo", JSON.stringify(db));
    var me = db.rows.filter(function (r) { return r.h === dev; })[0];
    return new Promise(function (ok) { setTimeout(function () { ok({
      guests: db.rows.map(function (r) { return { name: r.n, plus: r.p, me: r.h === dev }; }),
      total: db.rows.reduce(function (s, r) { return s + 1 + (r.p ? 1 : 0); }, 0),
      mine: me ? { name: me.n, plus: me.p } : null }); }, 450); });
  }

  /* render */
  function first(n) { return String(n).trim().split(/\s+/)[0]; }
  function initials(n) { var p = String(n).trim().split(/\s+/); return ((p[0] || "")[0] + ((p[1] || "")[0] || "")).toUpperCase(); }

  function renderList() {
    list.className = "";
    list.innerHTML = "";
    count.textContent = state.total ? state.total + (state.total === 1 ? " person" : " personer") : "";
    if (!state.guests.length) { var e = document.createElement("li"); e.className = "empty"; e.textContent = "Bliv den første"; list.appendChild(e); return; }
    state.guests.forEach(function (g, i) {
      var li = document.createElement("li");
      if (g.me) li.className = "me";
      li.style.animationDelay = Math.min(i, 12) * 30 + "ms";
      var av = document.createElement("span"); av.className = "av"; av.textContent = initials(g.name);
      var nm = document.createElement("span"); nm.className = "nm"; nm.textContent = g.name;
      li.appendChild(av); li.appendChild(nm);
      if (g.me) { var y = document.createElement("span"); y.className = "you"; y.textContent = "dig"; li.appendChild(y); }
      if (g.plus) { var t = document.createElement("span"); t.className = "tag"; t.textContent = "+1"; li.appendChild(t); }
      list.appendChild(li);
    });
  }

  function renderStage() {
    stage.innerHTML = "";
    if (state.mine && !editing) {
      var d = $("#tDone").content.firstElementChild.cloneNode(true);
      $("h2", d).textContent = "Du er med, " + first(state.mine.name) + ".";
      $("p", d).textContent = state.mine.plus ? "Med én ekstra. Glæder mig!" : "Glæder mig!";
      sub.textContent = "Vi ses";
      var drop = $('[data-a="drop"]', d), armed = false;
      $('[data-a="edit"]', d).onclick = function () { editing = true; renderStage(); };
      drop.onclick = function () {
        if (!armed) { armed = true; drop.textContent = "Sikker?"; drop.classList.add("warn");
          setTimeout(function () { armed = false; drop.textContent = "Meld fra"; drop.classList.remove("warn"); }, 3000); return; }
        drop.disabled = true;
        call({ action: "remove" }).then(apply).catch(function () { $(".err", d).textContent = "Noget gik galt — prøv igen"; drop.disabled = false; });
      };
      stage.appendChild(d);
      return;
    }
    sub.textContent = state.mine ? "Ret din tilmelding" : "Skriv dig på listen";
    var f = $("#tForm").content.firstElementChild.cloneNode(true);
    var input = $("input", f), seg = $(".seg", f), go = $(".go", f), err = $(".err", f), plus = 0;
    function setPlus(v) { plus = v; seg.dataset.v = v; seg.querySelectorAll("button").forEach(function (b) { b.setAttribute("aria-pressed", String(+b.dataset.p === v)); }); }
    seg.querySelectorAll("button").forEach(function (b) { b.onclick = function () { setPlus(+b.dataset.p); }; });
    if (state.mine) { input.value = state.mine.name; setPlus(state.mine.plus ? 1 : 0); $("span", go).textContent = "Gem"; }
    else if (store("jf.n")) input.value = store("jf.n");
    f.onsubmit = function (e) {
      e.preventDefault();
      var name = input.value.replace(/\s+/g, " ").trim();
      if (!name) { err.textContent = "Skriv dit navn"; input.focus(); return; }
      err.textContent = ""; go.disabled = true; go.classList.add("busy"); input.blur();
      store("jf.n", name);
      call({ name: name, plus: plus }).then(function (j) { editing = false; apply(j); })
        .catch(function () { err.textContent = "Noget gik galt — prøv igen"; go.disabled = false; go.classList.remove("busy"); });
    };
    stage.appendChild(f);
  }

  function apply(j) {
    state = { mine: j.mine, guests: j.guests || [], total: j.total || 0 };
    store("jf.cache", JSON.stringify(state));
    renderStage(); renderList();
  }

  /* instant paint from cache, then refresh */
  try { var c = JSON.parse(store("jf.cache") || "null"); if (c) { state = c; renderList(); } } catch (e) {}
  renderStage();
  function refresh() { call().then(apply).catch(function () { if (list.classList.contains("skel")) { list.className = ""; list.innerHTML = '<li class="empty">Kunne ikke hente listen</li>'; } }); }
  refresh();
  document.addEventListener("visibilitychange", function () { if (!document.hidden && !editing) refresh(); });

  /* info sheet */
  var sheet = $("#sheet"), facts = $("#facts");
  Object.keys(EVENT).forEach(function (k) {
    var dt = document.createElement("dt"), dd = document.createElement("dd");
    dt.textContent = k; dd.textContent = EVENT[k] || "Følger"; if (!EVENT[k]) dd.className = "tbd";
    facts.appendChild(dt); facts.appendChild(dd);
  });
  function openSheet() { sheet.classList.add("open"); $(".panel .ghost", sheet).focus({ preventScroll: true }); }
  function closeSheet() { sheet.classList.remove("open"); $("#infoBtn").focus({ preventScroll: true }); }
  $("#infoBtn").onclick = openSheet;
  sheet.querySelectorAll("[data-close]").forEach(function (el) { el.onclick = closeSheet; });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && sheet.classList.contains("open")) closeSheet(); });
  var y0 = null, panel = $(".panel", sheet);
  panel.addEventListener("touchstart", function (e) { y0 = e.touches[0].clientY; }, { passive: true });
  panel.addEventListener("touchend", function (e) { if (y0 !== null && e.changedTouches[0].clientY - y0 > 60) closeSheet(); y0 = null; });

  /* snow */
  var snow = $("#snow");
  for (var i = 0; i < 26; i++) {
    var s = document.createElement("i"), z = Math.random();
    s.style.cssText = "left:" + (Math.random() * 100) + "%;width:" + (1.5 + z * 2.5) + "px;height:" + (1.5 + z * 2.5) + "px;--o:" + (.15 + z * .45) +
      ";--dx:" + ((Math.random() - .5) * 60) + "px;animation-duration:" + (14 - z * 6) + "s;animation-delay:-" + (Math.random() * 14) + "s";
    snow.appendChild(s);
  }
})();
</script>
</body>
</html>
