<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Julefrokost · December 12</title>
<meta name="description" content="You're invited to julefrokost on December 12. RSVP here.">
<meta property="og:title" content="🎄 Julefrokost · December 12">
<meta property="og:description" content="You're invited. RSVP here.">
<meta name="theme-color" content="#f3f1ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)">
<style>html,body{margin:0;background:#f3f1ec}@media (prefers-color-scheme:dark){html,body{background:#111110}}</style>
</head>
<body>
<script>
/* The page itself lives on Vercel (julefrokost-api). This shell keeps the
   garage.jonathantari.com/julefrokost link and loads the latest version. */
(function () {
  var SRC = "https://julefrokost-api.vercel.app/";
  fetch(SRC + "?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (html) {
      html = html.replace(/<head>/i, '<head><base href="' + SRC + '">');
      document.open(); document.write(html); document.close();
    })
    .catch(function () { location.replace(SRC); });
})();
</script>
</body>
</html>
