<body>
<script>
/* The page itself lives on Vercel (julefrokost-api). This shell keeps the
   garage.jonathantari.com/julefrokost link, the preview text and the icons,
   and loads the latest version of the page. */
(function () {
  var SRC = "https://julefrokost-api.vercel.app/";
  var keep = Array.prototype.map.call(document.querySelectorAll('title, link[rel~="icon"], link[rel="apple-touch-icon"]'),
    function (n) { return n.outerHTML; }).join("");
  fetch(SRC + "?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (html) {
      html = html.replace(/<title>[\s\S]*?<\/title>/i, "").replace(/<link rel="icon"[^>]*>/gi, "")
                 .replace(/<head>/i, '<head><base href="' + SRC + '">' + keep);
      document.open(); document.write(html); document.close();
    })
    .catch(function () { location.replace(SRC); });
})();
</script>
</body>
