<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Typewriter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --fs:17px; --lh:30px; --cw:10.2px;
  --ink:#141418;
  --hud:rgba(26,26,36,.5); --hud-hover:rgba(26,26,36,.07);
  --card:#ecebe8; --card-ink:#1d1d22; --sel:rgba(70,80,140,.22);
  --hx:50vw; --cy:60vh; --rx:420px; --ry:240px;
}
body.day{ --ink:#111112; --hud:rgba(52,44,32,.5); --hud-hover:rgba(52,44,32,.07); --card:#faf6ec; --sel:rgba(150,120,60,.2) }
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#8d8e9c}
body{position:fixed;inset:0;font-family:'Courier Prime','Courier New',Courier,monospace;color:var(--ink);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
#stage{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;cursor:text;touch-action:none;user-select:none;-webkit-user-select:none}
.layer{position:absolute;inset:0;pointer-events:none}

/* ---------- paper ---------- */
#bgNight{background:radial-gradient(ellipse 125% 95% at 50% 36%,#c3c4ce 0%,#acadba 50%,#8e8f9f 100%)}
#bgDay{opacity:0;transition:opacity .8s ease;background:radial-gradient(ellipse 120% 100% at 50% 40%,#f8f4ea 0%,#f1ebdd 55%,#e2d9c5 100%)}
body.day #bgDay{opacity:1}
.tex{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='f' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='.72' numOctaves='3' seed='7' stitchTiles='stitch' result='n'/><feColorMatrix in='n' type='luminanceToAlpha' result='a'/><feDiffuseLighting in='a' surfaceScale='1.7' lighting-color='%23fff' diffuseConstant='1.05'><feDistantLight azimuth='90' elevation='52'/></feDiffuseLighting></filter><rect width='100%' height='100%' filter='url(%23f)'/></svg>");
  mix-blend-mode:multiply}
#tex{opacity:.10}
body.day #tex{opacity:.13}

/* ---------- lamp (on the typing head) ---------- */
#lamp,#hot{position:absolute;left:0;top:0;pointer-events:none;will-change:transform;transition:opacity .7s ease}
#lamp{background:radial-gradient(ellipse 50% 50% at 50% 50%,
  rgba(255,244,216,.92) 0%,rgba(254,240,209,.82) 14%,rgba(250,235,203,.64) 30%,rgba(246,231,200,.42) 48%,rgba(242,228,198,.22) 66%,rgba(239,226,197,.08) 84%,rgba(238,225,196,0) 100%)}
body.day #lamp{opacity:.55}
#hot{width:320px;height:110px;margin:-108px 0 0 -160px;
  background:radial-gradient(ellipse 50% 88% at 50% 100%,rgba(255,250,236,.72),rgba(255,245,226,.26) 45%,rgba(255,244,224,0) 100%)}
#texLit{opacity:.24;-webkit-mask-image:radial-gradient(ellipse var(--rx) var(--ry) at var(--hx) var(--cy),#000 0%,rgba(0,0,0,.6) 45%,transparent 100%);
  mask-image:radial-gradient(ellipse var(--rx) var(--ry) at var(--hx) var(--cy),#000 0%,rgba(0,0,0,.6) 45%,transparent 100%)}
body.lamp-off #lamp,body.lamp-off #hot,body.lamp-off #texLit,body.lamp-off #lit,body.lamp-off #barGlint{opacity:0}

/* ---------- ink ---------- */
#view{position:absolute;inset:0;pointer-events:none}
#lines,#litE,#litG{position:absolute;left:0;top:0;will-change:transform}
.ln{position:absolute;left:0;height:var(--lh);line-height:var(--lh);white-space:pre;font-size:var(--fs)}
#lines .ln{color:var(--ink);text-shadow:0 0 .5px rgba(10,10,14,.55);transition:opacity .35s ease}
body.day #lines .ln{text-shadow:0 0 .45px rgba(0,0,0,.5),0 .6px 0 rgba(255,255,255,.55)}
#lines .ln.below{opacity:.38}
.b{font-weight:700}.i{font-style:italic}
.s{background:var(--sel);border-radius:1px}
.c{display:inline-block;width:var(--cw)}
.f{animation:strike 120ms cubic-bezier(.2,.7,.3,1) both}
@keyframes strike{
  0%{opacity:0;transform:scale(1.07);filter:blur(.7px)}
  40%{opacity:1;transform:scale(1);filter:blur(0);text-shadow:0 0 1.4px rgba(0,0,0,.7)}
  100%{opacity:1;transform:scale(1)}
}
/* lit ink: cast shadow away from the lamp + glossy fill near the hotspot */
#lit{position:absolute;inset:0;pointer-events:none;transition:opacity .7s ease;
  -webkit-mask-image:radial-gradient(ellipse var(--rx) var(--ry) at var(--hx) var(--cy),#000 0%,rgba(0,0,0,.92) 30%,rgba(0,0,0,.5) 62%,transparent 100%);
          mask-image:radial-gradient(ellipse var(--rx) var(--ry) at var(--hx) var(--cy),#000 0%,rgba(0,0,0,.92) 30%,rgba(0,0,0,.5) 62%,transparent 100%)}
#litE .ln{color:transparent}
#litE .k{
  --dx:calc(var(--ex) - var(--c) * var(--cw));
  --dy:calc(var(--ey) - var(--top));
  --a:atan2(var(--dy),var(--dx));
  text-shadow:
    calc(cos(var(--a)) * -.6px) calc(sin(var(--a)) * -.6px) .8px rgba(40,26,8,.26),
    calc(cos(var(--a)) * .42px) calc(sin(var(--a)) * .42px) .15px rgba(255,250,238,.62)}
#litG .ln{color:transparent;-webkit-background-clip:text;background-clip:text;
  background-image:radial-gradient(ellipse 170px 64px at var(--gx) calc(var(--gy) - var(--top)),
    #3f3934 0%,#2a2623 34%,#161518 70%,#111114 100%)}
#lines .ln{-webkit-text-stroke:0}

/* ---------- carriage: bail bar, head, caret, knob ---------- */
#bar{position:absolute;left:0;right:0;top:0;height:4px;margin-top:-2px;pointer-events:none;
  background:linear-gradient(#34353c 0%,#8f919c 26%,#eef0f3 46%,#a2a4ae 62%,#45464e 100%);
  box-shadow:0 2px 2px rgba(0,0,0,.22),0 7px 14px rgba(0,0,0,.09)}
body.day #bar{background:linear-gradient(#46474e 0%,#a3a5ae 26%,#fbfbfc 46%,#b4b6be 62%,#55565d 100%)}
#barGlint{position:absolute;left:0;top:0;width:420px;height:4px;margin:-2px 0 0 -210px;pointer-events:none;will-change:transform;
  background:radial-gradient(ellipse 50% 100% at 50% 50%,rgba(255,236,196,.95),rgba(255,236,196,0));mix-blend-mode:screen;transition:opacity .7s}
#head{position:absolute;left:0;top:0;width:56px;height:18px;margin:-9px 0 0 -28px;pointer-events:none;will-change:transform}
#hb{position:absolute;inset:0;border-radius:5px;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 1px,rgba(0,0,0,.035) 1px 2px),
    linear-gradient(#f6f7f9 0%,#d3d5db 40%,#aeb1ba 56%,#c7c9d0 78%,#e6e8ec 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.85),inset 0 -1px 0 rgba(0,0,0,.2),0 1px 1px rgba(0,0,0,.35),0 3px 6px rgba(0,0,0,.22),0 8px 16px rgba(0,0,0,.10)}
.screw{position:absolute;top:6px;width:6px;height:6px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff 0%,#b9bbc3 45%,#62646d 100%);box-shadow:0 .5px 0 rgba(255,255,255,.7),inset 0 0 0 .5px rgba(0,0,0,.2)}
.screw::after{content:'';position:absolute;left:1px;right:1px;top:2.5px;height:1px;background:rgba(40,40,48,.65);transform:rotate(38deg)}
.screw.l{left:7px}.screw.r{right:7px}
#win{position:absolute;left:50%;top:3px;width:20px;height:12px;margin-left:-10px;border-radius:3px;overflow:hidden;perspective:30px;padding:1px;
  background:linear-gradient(#1a0a06,#3a1a10);box-shadow:inset 0 1px 1.5px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.75)}
#glyph{display:block;width:100%;height:100%;border-radius:2px;transform-origin:50% 50%;
  background:repeating-linear-gradient(100deg,rgba(0,0,0,.10) 0 1px,rgba(255,170,120,.05) 1px 2.5px,rgba(0,0,0,.06) 2.5px 3.5px),
    linear-gradient(165deg,#7a2c1b 0%,#5a1e12 38%,#3e130b 70%,#2b0c06 100%);
  box-shadow:inset 0 1px 0 rgba(255,196,160,.45),inset 1px 0 0 rgba(255,180,140,.2),inset 0 -1.5px 1px rgba(0,0,0,.55),inset -1px 0 1px rgba(0,0,0,.35)}
#led{position:absolute;left:50%;top:-1.5px;width:24px;height:2.5px;margin-left:-12px;border-radius:2px;transition:all .6s ease;
  background:linear-gradient(#fffdf6,#ffe2ad);box-shadow:0 0 4px 1px rgba(255,232,180,.95),0 -3px 12px 3px rgba(255,228,175,.5)}
body.lamp-off #led{background:linear-gradient(#cfc8bb,#9a958c);box-shadow:inset 0 .5px 0 rgba(0,0,0,.3)}
#swapLbl{position:absolute;left:0;top:0;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--hud);white-space:nowrap;pointer-events:none;opacity:0;will-change:transform}
#caret{position:absolute;left:0;top:0;width:1.5px;margin-left:-.75px;border-radius:1px;background:var(--ink);opacity:.55;pointer-events:none;will-change:transform;animation:blink 1.15s steps(1) infinite}
body.typing #caret{animation:none}
body.blurred #caret{opacity:0;animation:none}
@keyframes blink{55%{opacity:0}}
#knob{position:absolute;left:0;top:0;cursor:ns-resize;touch-action:none;filter:drop-shadow(-2px 3px 3px rgba(0,0,0,.28)) drop-shadow(-6px 8px 10px rgba(0,0,0,.12))}
#hint{position:absolute;left:0;top:0;font-size:var(--fs);line-height:var(--lh);color:var(--ink);opacity:.32;white-space:pre;pointer-events:none;transition:opacity .4s}

/* ---------- UI ---------- */
#hud{position:absolute;left:0;right:0;top:0;z-index:10;display:flex;align-items:center;gap:2px;
  padding:14px 18px;padding-top:max(14px,env(safe-area-inset-top));font-size:12.5px;letter-spacing:.04em;color:var(--hud);transition:opacity .6s ease;cursor:default}
body.hide-ui #hud{opacity:0;pointer-events:none}
#hud button{all:unset;cursor:pointer;padding:5px 8px;border-radius:5px;white-space:nowrap;transition:background .2s,color .2s}
#hud button:hover,#hud button:focus-visible,#hud button.on{background:var(--hud-hover);color:var(--ink)}
#name{all:unset;font:inherit;letter-spacing:.02em;color:var(--ink);opacity:.62;width:22ch;max-width:36vw;cursor:text;padding:5px 2px;user-select:text;-webkit-user-select:text}
#name:focus{opacity:1}
#dot{opacity:0;transition:opacity .3s;margin-left:-2px}
body.dirty #dot{opacity:.7}
.sp{flex:1}
#wc{margin-right:10px;white-space:nowrap;font-variant-numeric:tabular-nums}
#opts{position:absolute;right:14px;top:52px;z-index:11;width:280px;background:var(--card);color:var(--card-ink);border-radius:10px;padding:10px 12px;
  box-shadow:0 18px 50px rgba(0,0,0,.28),0 0 0 .5px rgba(0,0,0,.08);font-size:12.5px;display:none;cursor:default}
#opts.on{display:block;animation:fade .15s ease}
.orow{display:flex;align-items:center;justify-content:space-between;padding:6px 0}
.seg{display:flex;background:rgba(127,127,140,.14);border-radius:6px;padding:2px}
.seg button{all:unset;cursor:pointer;padding:4px 9px;border-radius:5px;color:var(--card-ink);opacity:.6}
.seg button.on{background:var(--card);opacity:1;box-shadow:0 1px 2px rgba(0,0,0,.15)}
#modal{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(10,10,14,.28);cursor:default}
#modal.on{display:flex;animation:fade .2s ease}
.card{width:min(440px,calc(100vw - 32px));background:var(--card);color:var(--card-ink);border-radius:10px;padding:22px 22px 16px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);font-size:14px;line-height:1.6;user-select:text;-webkit-user-select:text}
.card h3{margin:0 0 8px;font-size:15px}.card p{margin:0 0 10px}
.card table{width:100%;border-collapse:collapse;font-size:13px}
.card td{padding:3px 0}.card td:last-child{text-align:right;opacity:.65}
.row{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}
.row button{all:unset;cursor:pointer;padding:7px 12px;border-radius:6px;font-size:13px;border:1px solid rgba(127,127,140,.35)}
.row button.pri{background:var(--card-ink);color:var(--card);border-color:transparent}
#toast{position:absolute;left:50%;bottom:max(26px,env(safe-area-inset-bottom));transform:translate(-50%,10px);z-index:15;font-size:12.5px;
  padding:7px 14px;border-radius:20px;background:rgba(20,20,26,.8);color:#eee;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
@keyframes fade{from{opacity:0}}
#drop{position:absolute;inset:12px;border:2px dashed var(--hud);border-radius:14px;z-index:12;display:none;align-items:center;justify-content:center;font-size:14px;color:var(--hud);pointer-events:none}
body.dragging #drop{display:flex}
#ta{position:absolute;left:0;top:0;width:2px;height:20px;opacity:0;padding:0;border:0;margin:0;resize:none;outline:none;overflow:hidden;
  font-size:16px;color:transparent;background:transparent;caret-color:transparent;white-space:pre;z-index:1}
#print{display:none}
@media (max-width:640px){ #hud .dk{display:none} #wc{margin-right:2px} #hud{padding-left:8px;padding-right:8px;font-size:12px} #name{width:11ch} #hud button{padding:5px 6px} #opts{right:8px;width:calc(100vw - 16px)} }
@media print{
  #stage{display:none!important}
  html,body{position:static;overflow:visible;height:auto;background:#fff}
  #print{display:block;color:#111;font:12pt/1.65 'Courier Prime','Courier New',monospace}
  #print h1,#print h2,#print h3{font-size:13pt;margin:1.3em 0 .5em}
  #print p{margin:0 0 .9em}
  @page{margin:22mm 20mm}
}
</style>
</head>
<body class="hide-ui blurred">
<div id="stage">
  <div class="layer" id="bgNight"></div>
  <div class="layer" id="bgDay"></div>
  <div class="layer tex" id="tex"></div>
  <div id="lamp"></div>
  <div id="hot"></div>
  <div class="layer tex" id="texLit"></div>
  <div id="view">
    <div id="lines"></div>
    <div id="lit"><div id="litE"></div><div id="litG"></div></div>
  </div>
  <div id="hint">Start typing…</div>
  <div id="bar"></div>
  <div id="barGlint"></div>
  <div id="caret"></div>
  <div id="head"><div id="hb"><i class="screw l"></i><div id="win"><span id="glyph"></span></div><i class="screw r"></i></div><div id="led"></div></div>
  <div id="swapLbl"></div>
  <canvas id="knob"></canvas>
  <div id="hud">
    <input id="name" spellcheck="false" autocomplete="off" value="Untitled" aria-label="File name"><span id="dot">•</span>
    <span class="sp"></span>
    <span id="wc">0 words</span>
    <button data-a="new" class="dk">new</button>
    <button data-a="open">open</button>
    <button data-a="save">save</button>
    <button data-a="pdf" class="dk">pdf</button>
    <button data-a="opts" id="optsBtn">options</button>
    <button data-a="help" class="dk">?</button>
  </div>
  <div id="opts">
    <div class="orow"><span>Paper</span><div class="seg" data-k="theme"><button data-v="day">day</button><button data-v="night">night</button></div></div>
    <div class="orow"><span>Lamp</span><div class="seg" data-k="lamp"><button data-v="on">on</button><button data-v="off">off</button></div></div>
    <div class="orow"><span>Typing point</span><div class="seg" data-k="center"><button data-v="off">moves</button><button data-v="on">centred</button></div></div>
    <div class="orow"><span>Sound</span><div class="seg" data-k="sound"><button data-v="on">on</button><button data-v="off">off</button></div></div>
    <div class="orow"><button data-a="new" style="all:unset;cursor:pointer;opacity:.7">new page</button><button data-a="help" style="all:unset;cursor:pointer;opacity:.7">shortcuts</button></div>
  </div>
  <div id="drop">Drop a .md file to open it</div>
  <div id="modal"><div class="card"><div id="mBody"></div><div class="row" id="mRow"></div></div></div>
  <div id="toast"></div>
  <textarea id="ta" wrap="off" spellcheck="false" autocapitalize="sentences" autocomplete="off" aria-label="Writing area"></textarea>
</div>
<input type="file" id="file" accept=".md,.markdown,.txt,text/markdown,text/plain" hidden>
<div id="print"></div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const ta=$('#ta'),stage=$('#stage'),linesEl=$('#lines'),litWrap=$('#lit'),litE=$('#litE'),litG=$('#litG'),
      lampEl=$('#lamp'),hotEl=$('#hot'),bar=$('#bar'),barGlint=$('#barGlint'),head=$('#head'),hb=$('#hb'),glyphEl=$('#glyph'),
      swapLbl=$('#swapLbl'),caretEl=$('#caret'),hint=$('#hint'),wcEl=$('#wc'),nameEl=$('#name'),knob=$('#knob'),view=$('#view'),
      fileInput=$('#file'),toastEl=$('#toast'),modalEl=$('#modal'),optsEl=$('#opts'),body=document.body,root=document.documentElement;
const IN_FRAME=(()=>{try{return window.self!==window.top}catch(e){return true}})();
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
             set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const ANIM=130;

/* ---------- settings ---------- */
const S={theme:store.get('tw2.theme','night'),lamp:store.get('tw2.lamp',null),center:store.get('tw2.center',false),sound:store.get('tw2.sound',true)};
if(S.lamp===null)S.lamp=S.theme==='night';

/* ---------- layout ---------- */
const L={W:0,H:0,fs:17,lh:30,cw:10,cols:64,left:0,typeY:0,mobile:false,rx:420,ry:240};
const KW=30,KH=128;let kctx=null,dpr=1;
function measure(){
  const vv=window.visualViewport;
  const W=window.innerWidth,H=vv?vv.height:window.innerHeight;
  const mobile=W<640;
  const fs=mobile?15.5:(W>1700?19:17.5);
  const lh=Math.round(fs*1.78);
  const ctx=document.createElement('canvas').getContext('2d');
  ctx.font=`${fs}px "Courier Prime","Courier New",monospace`;
  const cw=ctx.measureText('M'.repeat(60)).width/60;
  const pad=mobile?32:84;
  const cols=Math.max(18,Math.min(66,Math.floor((W-pad*2)/cw)));
  const left=Math.round((W-cols*cw)/2);
  const keyboard=vv&&vv.height<window.innerHeight*0.8;
  const typeY=Math.round(H*(keyboard?0.66:(mobile?0.54:0.6)));
  const rx=clamp(W*.44,280,720),ry=clamp(H*.36,180,340);
  Object.assign(L,{W,H,fs,lh,cw,cols,left,typeY,mobile,rx,ry});
  root.style.setProperty('--fs',fs+'px');root.style.setProperty('--lh',lh+'px');root.style.setProperty('--cw',cw+'px');
  root.style.setProperty('--rx',rx+'px');root.style.setProperty('--ry',ry+'px');
  stage.style.height=H+'px';stage.style.top=(vv?vv.offsetTop:0)+'px';
  bar.style.transform=`translateY(${typeY}px)`;
  caretEl.style.height=Math.round(lh*.62)+'px';
  // lamp ellipse: centred a little above the typing line, spill fades out just below the bar
  lampEl.style.width=rx*2+'px';lampEl.style.height=ry*2+'px';
  const headInLamp=ry+ry*.42;
  const m=`linear-gradient(to bottom,#000 0px,#000 ${headInLamp-14}px,rgba(0,0,0,.55) ${headInLamp}px,rgba(0,0,0,.22) ${headInLamp+18}px,rgba(0,0,0,.07) ${headInLamp+42}px,transparent ${headInLamp+80}px)`;
  lampEl.style.webkitMaskImage=m;lampEl.style.maskImage=m;
  const fadeTop=Math.max(40,typeY*.5);
  const vm=`linear-gradient(to bottom,transparent 0px,rgba(0,0,0,.2) ${fadeTop*.3}px,#000 ${fadeTop}px,#000 ${typeY+1}px,rgba(0,0,0,.55) ${typeY+6}px,transparent ${H}px)`;
  view.style.webkitMaskImage=vm;view.style.maskImage=vm;
  // knob canvas
  dpr=Math.min(3,window.devicePixelRatio||1);
  knob.width=KW*dpr;knob.height=KH*dpr;knob.style.width=KW+'px';knob.style.height=KH+'px';
  knob.style.display=mobile?'none':'block';
  knob.style.transform=`translate(${W-KW-16}px,${typeY-KH/2}px)`;
  kctx=knob.getContext('2d');lastKnob=null;
}

/* ---------- markdown model: raw text in the textarea, markers hidden on paper ---------- */
/* bits: 1 bold · 2 italic · 4 hidden · 8 heading · 16 opening marker · 32 closing/prefix marker */
const pcache=new Map();
const isAlnum=c=>/[A-Za-z0-9]/.test(c||'');
function parse(str){
  let P=pcache.get(str);if(P)return P;
  const n=str.length,st=new Uint8Array(n),runs=[];let hp=0;
  const m=str.match(/^(#{1,6})[ \t]+/);
  if(m){hp=m[0].length;st.fill(8);for(let k=0;k<hp;k++)st[k]|=4|32}
  // bold: ** or __
  for(let i=hp;i<n-1;i++){
    const mk=str.substr(i,2);
    if((mk!=='**'&&mk!=='__')||st[i]&4||str[i-1]==='\\')continue;
    if(mk==='__'&&isAlnum(str[i-1]))continue;
    let k=str.indexOf(mk,i+3);

    if(mk==='__'&&isAlnum(str[k+2]))continue;
    st[i]|=4|16;st[i+1]|=4|16;st[k]|=4|32;st[k+1]|=4|32;
    for(let j=i+2;j<k;j++)st[j]|=1;

    if(c==='*'&&(str[i+1]==='*'||str[i-1]==='*'))continue;
    if(c==='_'&&isAlnum(str[i-1]))continue;
    let k=i+1,found=-1;
    for(;k<n;k++){

}

function wrap(text,cols){
  const out=[];const n=text.length;let i=0;
  for(;;){
    let nl=text.indexOf('\n',i);if(nl<0)nl=n;
    const P=parse(text.slice(i,nl));const st=P.st;
    let p=i;
    if(nl===p)out.push({s:p,e:p,hard:true,ls:i,P});
    while(p<nl){
      let vis=0,k=p,lastSp=-1;
      while(k<nl){const w=st[k-i]&4?0:1;if(vis+w>cols)break;vis+=w;if(w&&text.charCodeAt(k)===32)lastSp=k;k++}
      if(k>=nl){out.push({s:p,e:nl,hard:true,ls:i,P});p=nl;break}
      let br;
      if(text.charCodeAt(k)===32)br=k+1;else if(lastSp>p)br=lastSp+1;else br=k;
      out.push({s:p,e:br,hard:false,ls:i,P});p=br;

}
function findLine(idx){let lo=0,hi=lines.length-1;while(lo<hi){const mid=(lo+hi+1)>>1;if(lines[mid].s<=idx)lo=mid;else hi=mid-1}return lo}

  let j=ln.s,v=0;

function lineHTML(ln,mode,text,now,sa,sb){
  const st=ln.P.st,ls=ln.ls;let h='',buf='',key='',vc=0,chunkStart=0;

    else h+=key?`<span class="${key.trim()}">${esc(buf)}</span>`:esc(buf);
    buf='';};
  for(let j=ln.s;j<ln.e;j++){

    const ch=text[j];const sel=j>=sa&&j<sb;
    let k='';if(code&9)k+=' b';if(code&2)k+=' i';if(sel&&mode==='base')k+=' s';
    const fresh=now-times[j]<ANIM;

function frame(t){

    [curS,vS]=spring(curS,vS,targetS,dt/4,Math.abs(targetS-curS)>L.lh*3?120:340);
    const tx=caretCol*L.cw;
    [cx,vx]=spring(cx,vx,tx,dt/4,Math.abs(tx-cx)>L.cw*8?(S.center?70:110):1400);
  }
  if(Math.abs(curS-targetS)<.05&&Math.abs(vS)<.5){curS=targetS;vS=0}
  const tx=caretCol*L.cw;if(Math.abs(cx-tx)<.05&&Math.abs(vx)<.5){cx=tx;vx=0}
  paperX=S.center?Math.round((L.W/2-L.cw/2-cx)*2)/2:L.left;
  headX=S.center?L.W/2:L.left+cx+L.cw/2;
  const ty=L.typeY-L.lh-curS;
  const tr=`translate3d(${paperX}px,${ty}px,0)`;
  linesEl.style.transform=litE.style.transform=litG.style.transform=tr;
  const top=L.typeY-L.lh+caretLine*L.lh-curS;
  caretEl.style.transform=`translate3d(${paperX+cx}px,${top+L.lh*.18}px,0)`;
  head.style.transform=`translate3d(${headX}px,${L.typeY}px,0)`;
  barGlint.style.transform=`translate3d(${headX}px,${L.typeY}px,0)`;
  swapLbl.style.transform=`translate3d(${headX}px,${L.typeY+16}px,0) translateX(-50%)`;
  const cy=L.typeY-L.ry*.42;

  hotEl.style.transform=`translate3d(${headX}px,${L.typeY}px,0)`;
  root.style.setProperty('--hx',headX+'px');root.style.setProperty('--cy',cy+'px');
  // light position in paper coordinates for the glyph shading
  const gx=(headX-paperX)+'px',gy=(L.typeY-L.lh*.55-ty)+'px',ey=(L.typeY+14-ty)+'px';
  litG.style.setProperty('--gx',gx);litG.style.setProperty('--gy',gy);

/* ---------- platen knob ---------- */
function drawKnob(angle){

  const c=kctx;c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,KW,KH);
  const R=KH/2-2,cy=KH/2,x0=7,x1=KW-1;

  const ax=c.createLinearGradient(0,cy-4,0,cy+4);ax.addColorStop(0,'#55575f');ax.addColorStop(.45,'#f1f2f5');ax.addColorStop(1,'#4a4c53');
  c.fillStyle=ax;c.fillRect(0,cy-4,x0+2,8);
  // chrome collar
  const col=c.createLinearGradient(0,cy-R,0,cy+R);
  col.addColorStop(0,'#2b2c31');col.addColorStop(.22,'#9fa1aa');col.addColorStop(.38,'#f7f8fa');col.addColorStop(.55,'#a8aab3');col.addColorStop(.85,'#3d3e45');col.addColorStop(1,'#1c1d21');
  c.fillStyle=col;c.beginPath();c.roundRect(x0,cy-R+5,4,2*R-10,1.5);c.fill();
  // rubber barrel: cylinder shading

  c.fillStyle=g;c.beginPath();c.roundRect(x0+4,cy-R,x1-x0-4,2*R,[2,5,5,2]);c.fill();
  // knurled ridges, foreshortened around the barrel
  c.save();c.beginPath();c.roundRect(x0+4,cy-R,x1-x0-4,2*R,[2,5,5,2]);c.clip();
  const N=36;
  for(let k=0;k<N;k++){
    const th=k*2*Math.PI/N+angle;const z=Math.cos(th);if(z<=.02)continue;
    const y=cy-R*Math.sin(th);
    const lit=Math.max(0,.5*Math.sin(th)+.85*z);
    c.fillStyle=`rgba(0,0,0,${.55*z})`;c.fillRect(x0+4,y+.4,x1-x0-4,Math.max(.5,1.3*z));
    c.fillStyle=`rgba(255,255,255,${.16*lit*lit})`;c.fillRect(x0+4,y-.6,x1-x0-4,Math.max(.4,.8*z));
  }
  // specular streak along the barrel + warm lamp bounce from below-left
  const sp=c.createLinearGradient(0,cy-R,0,cy+R);
  sp.addColorStop(.18,'rgba(255,255,255,0)');sp.addColorStop(.27,'rgba(255,255,255,.22)');sp.addColorStop(.34,'rgba(255,255,255,0)');
  if(S.lamp){sp.addColorStop(.78,'rgba(255,220,160,0)');sp.addColorStop(.88,'rgba(255,220,160,.10)');sp.addColorStop(.96,'rgba(255,220,160,0)')}
  c.fillStyle=sp;c.fillRect(x0+4,cy-R,x1-x0-4,2*R);
  // end face rim
  const rim=c.createLinearGradient(x1-4,0,x1,0);rim.addColorStop(0,'rgba(255,255,255,0)');rim.addColorStop(1,'rgba(255,255,255,.08)');
  c.fillStyle=rim;c.fillRect(x1-4,cy-R,4,2*R);
  c.restore();
}

const snd=(()=>{

  if(window.showSaveFilePicker){
    try{
      if(!fileHandle||as)fileHandle=await showSaveFilePicker({suggestedName:name+'.md',types:[{description:'Markdown',accept:{'text/markdown':['.md']}}]});
      const w=await fileHandle.createWritable();await w.write(text);await w.close();
      nameEl.value=fileHandle.name.replace(/\.(md|markdown|txt)$/i,'');setDirty(false);toast('Saved '+fileHandle.name);return;
    }catch(e){if(e.name==='AbortError')return}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/markdown'}));a.download=name+'.md';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000);setDirty(false);toast('Downloaded '+name+'.md');
}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('Copied to clipboard')}catch(e){toast('Copy blocked by the browser')}}
function lineToHtml(line){
  const P=parse(line);let h='',cur='';
  const tagOpen=b=>(b&1||b&8?'<b>':'')+(b&2?'<i>':''),tagClose=b=>(b&2?'</i>':'')+(b&1||b&8?'</b>':'');
  let prevB=0;
  for(let j=0;j<line.length;j++){const c=P.st[j];if(c&4)continue;const bb=c&11;if(bb!==prevB){h+=tagClose(prevB)+tagOpen(bb);prevB=bb}h+=esc(line[j])}
  return h+tagClose(prevB);
}
function exportPdf(){
  if(IN_FRAME){modal('<h3>Export to PDF</h3><p>The preview can’t open the print dialog. In the installed app this opens print → <b>Save as PDF</b> with clean, formatted pages.</p>',[{l:'OK',pri:1}]);return}
  const blocks=ta.value.split(/\n{2,}/).map(b=>{const ls=b.split('\n');if(ls.length===1&&/^#{1,6}\s/.test(ls[0]))return`<h2>${lineToHtml(ls[0])}</h2>`;return`<p>${ls.map(lineToHtml).join('<br>')}</p>`});
  $('#print').innerHTML=blocks.join('');document.title=fileName();window.print();document.title='Typewriter';
}
let dragDepth=0;
window.addEventListener('dragenter',e=>{e.preventDefault();dragDepth++;body.classList.add('dragging')});
window.addEventListener('dragleave',()=>{if(--dragDepth<=0){dragDepth=0;body.classList.remove('dragging')}});
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',async e=>{e.preventDefault();dragDepth=0;body.classList.remove('dragging');
  const f=e.dataTransfer.files[0];if(f&&(await guard())){fileHandle=null;loadText(await f.text(),f.name);toast('Opened '+f.name)}});
let draftTimer=0;
function scheduleDraft(){clearTimeout(draftTimer);draftTimer=setTimeout(()=>store.set('tw.draft',{text:ta.value,name:nameEl.value,dirty}),400)}
nameEl.addEventListener('input',()=>{setDirty(true);scheduleDraft()});
nameEl.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key==='Escape'){e.preventDefault();ta.focus({preventScroll:true})}});

/* ---------- UI ---------- */
let toastTimer=0;
function toast(m){toastEl.textContent=m;toastEl.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('on'),1800)}
function modal(html,btns){
  return new Promise(res=>{
    $('#mBody').innerHTML=html;const row=$('#mRow');row.innerHTML='';
    btns.forEach((b,i)=>{const el=document.createElement('button');el.textContent=b.l;if(b.pri)el.className='pri';
      el.onclick=()=>{modalEl.classList.remove('on');ta.focus({preventScroll:true});res(i)};row.appendChild(el)});
    modalEl.classList.add('on');modalEl.onclick=e=>{if(e.target===modalEl){modalEl.classList.remove('on');res(-1)}};
    setTimeout(()=>row.lastChild&&row.lastChild.focus(),30);
  });
}
function help(){
  optsEl.classList.remove('on');
  const k=/Mac|iPhone|iPad/.test(navigator.platform)?'⌘':'Ctrl';
  modal(`<h3>Typewriter</h3><table>
  <tr><td>Save · Save as</td><td>${k} S · ${k} ⇧ S</td></tr>
  <tr><td>Open .md file</td><td>${k} O</td></tr>
  <tr><td>Undo · Redo</td><td>${k} Z · ${k} ⇧ Z</td></tr>
  <tr><td>Bold · Italic</td><td>${k} B · ${k} I</td></tr>
  <tr><td>Heading</td><td>${k} ⇧ H · or “# ”</td></tr>
  <tr><td>Day / night paper</td><td>${k} ⇧ L</td></tr>
  <tr><td>Lamp on / off</td><td>${k} ⇧ K</td></tr>
  <tr><td>Centred typing point</td><td>${k} ⇧ C</td></tr>
  <tr><td>Export PDF</td><td>${k} P</td></tr>
  <tr><td>Turn the platen</td><td>scroll · drag knob</td></tr></table>
  <p style="margin-top:12px;opacity:.7">Bold and italic swap the type element — the markdown symbols are saved in the file but never printed on the page. Drop a .md file anywhere to open it.</p>`,[{l:'Close',pri:1}]);
}
function setOpt(k,v){
  if(k==='theme'){S.theme=v;store.set('tw2.theme',v);S.lamp=v==='night';store.set('tw2.lamp',S.lamp)}
  if(k==='lamp'){S.lamp=v==='on';store.set('tw2.lamp',S.lamp)}
  if(k==='center'){S.center=v==='on';store.set('tw2.center',S.center)}
  if(k==='sound'){S.sound=v==='on';store.set('tw2.sound',S.sound);if(S.sound){audioReady=false;unlockAudio();setTimeout(()=>snd.key(),30)}}
  applySettings();
}
function applySettings(){
  body.classList.toggle('day',S.theme==='day');body.classList.toggle('lamp-off',!S.lamp);
  optsEl.querySelectorAll('.seg').forEach(seg=>{const k=seg.dataset.k;
    const cur=k==='theme'?S.theme:(S[k]?'on':'off');seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===cur))});
  resetCaches();lastKnob=null;if(lastText!=null)render();
}
optsEl.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const seg=b.closest('.seg');
  if(seg)setOpt(seg.dataset.k,b.dataset.v);});
document.addEventListener('click',e=>{const a=e.target.closest('[data-a]')?.dataset.a;if(!a)return;
  ({new:newDoc,open:openFile,save:()=>save(false),pdf:exportPdf,help,
    opts:()=>{optsEl.classList.toggle('on');$('#optsBtn').classList.toggle('on',optsEl.classList.contains('on'))}})[a]?.();
});
function updateCount(){
  let n=0;const re=/\S+/g;
  for(const line of lastText.split('\n')){const P=parse(line);let s='';for(let j=0;j<line.length;j++)if(!(P.st[j]&4))s+=line[j];n+=(s.match(re)||[]).length}
  wcEl.textContent=n.toLocaleString()+(n===1?' word':' words');
}

/* ---------- boot ---------- */
function relayout(){measure();lastCols=-1;resetCaches();render();curS=targetS;cx=caretCol*L.cw;drawLines()}
window.addEventListener('resize',relayout);
if(window.visualViewport)visualViewport.addEventListener('resize',relayout);
applySettings();
const draft=store.get('tw.draft',null);
measure();
if(draft&&draft.text!=null){loadText(draft.text,draft.name);setDirty(!!draft.dirty)}else loadText('','Untitled');
(document.fonts?document.fonts.ready:Promise.resolve()).then(relayout);
requestAnimationFrame(frame);
setTimeout(()=>{body.classList.remove('hide-ui');setTimeout(()=>{if(ta.value||document.activeElement===ta)body.classList.add('hide-ui')},2600)},400);
})();
</script>
</body>
</html>
