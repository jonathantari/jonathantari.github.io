<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Typewriter</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='b' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23545660'/%3E%3Cstop offset='1' stop-color='%231c1d22'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='18' y='4' width='28' height='26' rx='1.5' fill='%23f6f1e4' stroke='%23b9b2a2'/%3E%3Cpath d='M23 12h18M23 17h14M23 22h16' stroke='%2333333a' stroke-width='2' stroke-linecap='round'/%3E%3Crect x='6' y='26' width='52' height='9' rx='4.5' fill='%23202126'/%3E%3Ccircle cx='6' cy='30.5' r='5' fill='%23101114'/%3E%3Ccircle cx='58' cy='30.5' r='5' fill='%23101114'/%3E%3Cpath d='M8 36h48l4 22H4z' fill='url(%23b)'/%3E%3Cg fill='%23e9e4d8'%3E%3Ccircle cx='15' cy='44' r='2.4'/%3E%3Ccircle cx='23' cy='44' r='2.4'/%3E%3Ccircle cx='31' cy='44' r='2.4'/%3E%3Ccircle cx='39' cy='44' r='2.4'/%3E%3Ccircle cx='47' cy='44' r='2.4'/%3E%3Ccircle cx='19' cy='51' r='2.4'/%3E%3Ccircle cx='27' cy='51' r='2.4'/%3E%3Ccircle cx='35' cy='51' r='2.4'/%3E%3Ccircle cx='43' cy='51' r='2.4'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --fs:17px; --lh:30px; --cw:10.2px;
  --ink:#141418;
  --hud:rgba(26,26,36,.5); --hud-hover:rgba(26,26,36,.07);
  --card:#ecebe8; --card-ink:#1d1d22; --sel:rgba(70,80,140,.22);
  --hx:50vw; --cy:60vh; --rx:420px; --ry:240px;
}
body.day{ --ink:#111112; --hud:rgba(52,44,32,.5); --hud-hover:rgba(52,44,32,.07); --card:#faf6ec; --sel:rgba(150,120,60,.2) }
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#8d8e9c}
body{position:fixed;inset:0;font-family:'Courier Prime','Courier New',Courier,monospace;color:var(--ink);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
#stage{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;cursor:text;touch-action:none;user-select:none;-webkit-user-select:none}
.layer{position:absolute;inset:0;pointer-events:none}

/* ---------- paper ---------- */
#bgNight{background:radial-gradient(ellipse 125% 95% at 50% 36%,#c3c4ce 0%,#acadba 50%,#8e8f9f 100%)}
#bgDay{opacity:0;transition:opacity .8s ease;background:radial-gradient(ellipse 120% 100% at 50% 40%,#f8f4ea 0%,#f1ebdd 55%,#e2d9c5 100%)}
body.day #bgDay{opacity:1}
.tex{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='f' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='.72' numOctaves='3' seed='7' stitchTiles='stitch' result='n'/><feColorMatrix in='n' type='luminanceToAlpha' result='a'/><feDiffuseLighting in='a' surfaceScale='1.7' lighting-color='%23fff' diffuseConstant='1.05'><feDistantLight azimuth='90' elevation='52'/></feDiffuseLighting></filter><rect width='100%' height='100%' filter='url(%23f)'/></svg>");
  mix-blend-mode:multiply}
#tex{opacity:.10}
body.day #tex{opacity:.13}

/* ---------- lamp (on the typing head) ---------- */
#lamp,#hot{position:absolute;left:0;top:0;pointer-events:none;will-change:transform;transition:opacity .7s ease}
#lamp{background:radial-gradient(ellipse 50% 50% at 50% 50%,
  rgba(255,244,216,.92) 0%,rgba(254,240,209,.82) 14%,rgba(250,235,203,.64) 30%,rgba(246,231,200,.42) 48%,rgba(242,228,198,.22) 66%,rgba(239,226,197,.08) 84%,rgba(238,225,196,0) 100%)}
body.day #lamp{opacity:.55}
#hot{width:320px;height:110px;margin:-108px 0 0 -160px;
  background:radial-gradient(ellipse 50% 88% at 50% 100%,rgba(255,250,236,.72),rgba(255,245,226,.26) 45%,rgba(255,244,224,0) 100%)}
#texLit{opacity:.24;-webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 0%,rgba(0,0,0,.6) 45%,transparent 100%);
  mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 0%,rgba(0,0,0,.6) 45%,transparent 100%)}
/* lamp-lit layers are a window the size of the lamp ellipse that slides with the head (transform),
   while their content slides the opposite way so it stays put on the page. Following the head is then
   pure compositing: the masks and the SVG paper texture are painted once, never per frame. */
#texLit,#lit{position:absolute;left:0;top:0;right:auto;bottom:auto;inset:auto;width:calc(var(--rx) * 2);height:calc(var(--ry) * 2);will-change:transform}
#texLit{mix-blend-mode:multiply;background:none}
#texLitIn,#litIn{position:absolute;left:0;top:0;will-change:transform}
#texLitIn{width:100vw;height:100vh;mix-blend-mode:normal}
body.lamp-off #lamp,body.lamp-off #hot,body.lamp-off #texLit,body.lamp-off #lit,body.lamp-off #barGlint{opacity:0}

/* ---------- ink ---------- */
#view{position:absolute;inset:0;pointer-events:none}
#lines,#litE,#litG{position:absolute;left:0;top:0;will-change:transform}
.ln{position:absolute;left:0;height:var(--lh);line-height:var(--lh);white-space:pre;font-size:var(--fs)}
#lines .ln{color:var(--ink);text-shadow:0 0 .5px rgba(10,10,14,.55);transition:opacity .35s ease}
body.day #lines .ln{text-shadow:0 0 .45px rgba(0,0,0,.5),0 .6px 0 rgba(255,255,255,.55)}
#lines .ln.below{opacity:.38}
.b{font-weight:700}.i{font-style:italic}
.s{background:var(--sel);border-radius:1px}
.c{display:inline-block;width:var(--cw)}
.f{animation:strike 120ms cubic-bezier(.2,.7,.3,1) both}
@keyframes strike{
  0%{opacity:0;transform:scale(1.07);filter:blur(.7px)}
  40%{opacity:1;transform:scale(1);filter:blur(0);text-shadow:0 0 1.4px rgba(0,0,0,.7)}
  100%{opacity:1;transform:scale(1)}
}
/* lit ink: cast shadow away from the lamp + glossy fill near the hotspot */
#lit{position:absolute;inset:0;pointer-events:none;transition:opacity .7s ease;
  -webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 0%,rgba(0,0,0,.92) 30%,rgba(0,0,0,.5) 62%,transparent 100%);
          mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 0%,rgba(0,0,0,.92) 30%,rgba(0,0,0,.5) 62%,transparent 100%)}
#litE .ln{color:transparent}
#litE .k{
  --dx:calc(var(--ex) - var(--c) * var(--cw));
  --dy:calc(var(--ey) - var(--top));
  --a:atan2(var(--dy),var(--dx));
  text-shadow:
    calc(cos(var(--a)) * -.6px) calc(sin(var(--a)) * -.6px) .8px rgba(40,26,8,.26),
    calc(cos(var(--a)) * .42px) calc(sin(var(--a)) * .42px) .15px rgba(255,250,238,.62)}
#litG .ln{color:transparent;-webkit-background-clip:text;background-clip:text;
  background-image:radial-gradient(ellipse 170px 64px at var(--gx) calc(var(--gy) - var(--top)),
    #3f3934 0%,#2a2623 34%,#161518 70%,#111114 100%)}
#lines .ln{-webkit-text-stroke:0}

/* ---------- carriage: bail bar, head, caret, knob ---------- */
#bar{position:absolute;left:0;right:0;top:0;height:4px;margin-top:-2px;pointer-events:none;
  background:linear-gradient(#26272c 0%,#5d5f68 14%,#d9dbe0 30%,#ffffff 38%,#b9bbc3 46%,#4f5159 58%,#2e2f35 70%,#7d808a 86%,#3a3b41 100%);
  box-shadow:0 2px 2px rgba(0,0,0,.22),0 7px 14px rgba(0,0,0,.09)}
body.day #bar{background:linear-gradient(#3a3b41 0%,#7a7c85 14%,#e6e7eb 30%,#ffffff 38%,#c6c8cf 46%,#62646c 58%,#45464d 70%,#9a9ca5 86%,#4a4b52 100%)}
#barGlint{position:absolute;left:0;top:0;width:420px;height:4px;margin:-2px 0 0 -210px;pointer-events:none;will-change:transform;
  background:radial-gradient(ellipse 50% 100% at 50% 50%,rgba(255,236,196,.95),rgba(255,236,196,0));mix-blend-mode:screen;transition:opacity .7s}
#head{position:absolute;left:0;top:0;width:56px;height:18px;margin:-9px 0 0 -28px;pointer-events:none;will-change:transform}
#hb{position:absolute;inset:0;filter:drop-shadow(0 1px .6px rgba(0,0,0,.45)) drop-shadow(0 3px 3px rgba(0,0,0,.22)) drop-shadow(0 8px 10px rgba(0,0,0,.12))}
#headC{position:absolute;left:0;top:0;width:56px;height:18px}
#win{position:absolute;left:18.5px;top:3.5px;width:19px;height:11px;perspective:28px}
#winC{position:absolute;inset:0;width:19px;height:11px;transform-origin:50% 50%;backface-visibility:hidden}
#led{position:absolute;left:50%;top:-1px;width:18px;height:2px;margin-left:-11px;border-radius:2px;transition:opacity .6s ease;
  box-shadow:0 0 4px .5px rgba(255,234,186,.75),0 -3px 12px 3px rgba(255,228,175,.4)}
body.lamp-off #led{opacity:0}
#swapLbl{position:absolute;left:0;top:0;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--hud);white-space:nowrap;pointer-events:none;opacity:0;will-change:transform}
#caret{position:absolute;left:0;top:0;width:1.5px;margin-left:-.75px;border-radius:1px;background:var(--ink);opacity:.55;pointer-events:none;will-change:transform;animation:blink 1.15s steps(1) infinite}
body.typing #caret{animation:none}
body.blurred #caret{opacity:0;animation:none}
@keyframes blink{55%{opacity:0}}
#knob{position:absolute;left:0;top:0;cursor:ns-resize;touch-action:none;filter:drop-shadow(-1px 2px 1.5px rgba(0,0,0,.35)) drop-shadow(-5px 9px 10px rgba(0,0,0,.16))}
#hint{position:absolute;left:0;top:0;font-size:var(--fs);line-height:var(--lh);color:var(--ink);opacity:.32;white-space:pre;pointer-events:none;transition:opacity .4s}

/* ---------- UI ---------- */
#hud{position:absolute;left:0;right:0;top:0;z-index:10;display:flex;align-items:center;gap:2px;
  padding:14px 18px;padding-top:max(14px,env(safe-area-inset-top));font-size:12.5px;letter-spacing:.04em;color:var(--hud);transition:opacity .6s ease;cursor:default}
body.hide-ui #hud{opacity:0;pointer-events:none}
#hud button{all:unset;cursor:pointer;padding:5px 8px;border-radius:5px;white-space:nowrap;transition:background .2s,color .2s}
#hud button:hover,#hud button:focus-visible,#hud button.on{background:var(--hud-hover);color:var(--ink)}
#name{all:unset;font:inherit;letter-spacing:.02em;color:var(--ink);opacity:.62;width:22ch;max-width:36vw;cursor:text;padding:5px 2px;user-select:text;-webkit-user-select:text}
#name:focus{opacity:1}
#dot{opacity:0;transition:opacity .3s;margin-left:-2px}
body.dirty #dot{opacity:.7}
.sp{flex:1}
#wc{margin-right:10px;white-space:nowrap;font-variant-numeric:tabular-nums}
#opts{position:absolute;right:14px;top:52px;z-index:11;width:280px;background:var(--card);color:var(--card-ink);border-radius:10px;padding:10px 12px;
  box-shadow:0 18px 50px rgba(0,0,0,.28),0 0 0 .5px rgba(0,0,0,.08);font-size:12.5px;display:none;cursor:default}
#opts.on{display:block;animation:fade .15s ease}
.orow{display:flex;align-items:center;justify-content:space-between;padding:6px 0}
.seg{display:flex;background:rgba(127,127,140,.14);border-radius:6px;padding:2px}
.seg button{all:unset;cursor:pointer;padding:4px 9px;border-radius:5px;color:var(--card-ink);opacity:.6}
.seg button.on{background:var(--card);opacity:1;box-shadow:0 1px 2px rgba(0,0,0,.15)}
#modal{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(10,10,14,.28);cursor:default}
#modal.on{display:flex;animation:fade .2s ease}
.card{width:min(440px,calc(100vw - 32px));background:var(--card);color:var(--card-ink);border-radius:10px;padding:22px 22px 16px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);font-size:14px;line-height:1.6;user-select:text;-webkit-user-select:text}
.card h3{margin:0 0 8px;font-size:15px}.card p{margin:0 0 10px}
.card table{width:100%;border-collapse:collapse;font-size:13px}
.card td{padding:3px 0}.card td:last-child{text-align:right;opacity:.65}
.row{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}
.row button{all:unset;cursor:pointer;padding:7px 12px;border-radius:6px;font-size:13px;border:1px solid rgba(127,127,140,.35)}
.row button.pri{background:var(--card-ink);color:var(--card);border-color:transparent}
#toast{position:absolute;left:50%;bottom:max(26px,env(safe-area-inset-bottom));transform:translate(-50%,10px);z-index:15;font-size:12.5px;
  padding:7px 14px;border-radius:20px;background:rgba(20,20,26,.8);color:#eee;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
@keyframes fade{from{opacity:0}}
body:not(.drive) .donly{display:none!important}
.dlist{max-height:min(52vh,420px);overflow:auto;margin:4px -8px 0}
.dfile{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;gap:14px;width:100%;padding:8px;border-radius:6px;cursor:pointer}
.dfile:hover,.dfile:focus-visible{background:rgba(127,127,140,.14)}
.dfile span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dfile .dm{flex:none;opacity:.5;font-size:12.5px}
/* ---------- save menu ---------- */
.menu{position:relative;display:inline-flex;align-items:center}
#hud .menu .car{padding:5px 4px 5px 0;font-size:10px;opacity:.7}
#saveDrop{position:absolute;left:0;top:100%;padding-top:6px;display:none;z-index:12;min-width:150px}
.menu:hover #saveDrop,.menu.on #saveDrop{display:block;animation:fade .15s ease}
.pc{background:var(--card);color:var(--card-ink);border-radius:10px;padding:10px 12px;box-shadow:0 18px 50px rgba(0,0,0,.28),0 0 0 .5px rgba(0,0,0,.08);font-size:12.5px;cursor:default}
#saveDrop .pc{padding:5px}
#hud #saveDrop button{display:block;width:100%;box-sizing:border-box;color:var(--card-ink);opacity:.75;padding:7px 9px;letter-spacing:.02em}
#hud #saveDrop button:hover,#hud #saveDrop button:focus-visible{background:rgba(127,127,140,.16);opacity:1;color:var(--card-ink)}
/* ---------- feedback: a quiet text link bottom-left, hides with the top bar while typing ---------- */
#fb{position:absolute;left:20px;bottom:max(22px,env(safe-area-inset-bottom));z-index:9;font-size:12px;letter-spacing:.04em;color:var(--hud);
  text-decoration:none;opacity:.55;padding:5px 4px;transition:opacity .6s ease,color .2s}
#fb:hover,#fb:focus-visible{opacity:1;color:var(--ink);outline:none}
body.hide-ui #fb{opacity:0;pointer-events:none}
@media print{#fb{display:none}}
/* ---------- timer: a little egg timer on the table ----------
   Idle: a faint outline in the corner. Running: a soft wedge of ink that creeps back to 12 o'clock.
   Hover (or tap on touch): the dial grows, the time left appears in grey in its centre, and two quiet
   text links sit beside it. No panels, no backgrounds. */
#tw{position:absolute;right:20px;bottom:max(18px,env(safe-area-inset-bottom));z-index:9;display:flex;align-items:center;pointer-events:none}
#tmr{all:unset;display:block;position:relative;flex:none;width:40px;height:44px;color:var(--ink);opacity:.12;cursor:pointer;pointer-events:auto;
  transition:width .5s cubic-bezier(.2,.75,.25,1),height .5s cubic-bezier(.2,.75,.25,1),opacity .6s ease}
#tmr svg{display:block;width:100%;height:100%;overflow:visible}
#tmr .rim{fill:none;stroke:currentColor;stroke-width:1.5;vector-effect:non-scaling-stroke}
#tmr .tk{stroke:currentColor;stroke-width:1.1;opacity:.5;vector-effect:non-scaling-stroke;transition:opacity .3s}
#tmr .kn{fill:currentColor;opacity:.85}
#tmr .sec{fill:none;stroke:currentColor;stroke-width:15.5;stroke-dasharray:0 100;opacity:.4;transition:stroke-dasharray 1s linear,opacity .5s ease}
#tLeft{position:absolute;left:0;right:0;top:54.5%;transform:translateY(-50%);text-align:center;font-size:13px;letter-spacing:.03em;
  font-variant-numeric:tabular-nums;color:var(--ink);opacity:0;transition:opacity .3s ease;pointer-events:none}
#tCtl #tLbl{display:block;font-size:10px;letter-spacing:.06em;line-height:1;padding:0 4px 5px;color:var(--hud);opacity:.7;pointer-events:none}
#tw.run #tmr{opacity:.3}
#tw.open #tmr{width:72px;height:79px;opacity:.55;transition-duration:.45s,.45s,.25s}
#tw.open .sec{opacity:.1}
#tw.open.run .tk,#tw.open.done .tk{opacity:.18}
#tw.open.run #tLeft,#tw.open.done #tLeft{opacity:.8;transition-delay:.15s}
#tw.done #tmr{animation:tDone 3.2s ease-in-out 2}
@keyframes tDone{50%{opacity:.5}}
#tCtl{display:flex;flex-direction:column;align-items:flex-end;padding-right:8px;opacity:0;transform:translateX(6px);
  transition:opacity .25s ease,transform .35s ease}
#tw.open #tCtl{opacity:1;transform:none;pointer-events:auto;transition-delay:.1s}
#tCtl button{all:unset;cursor:pointer;font-size:12px;letter-spacing:.04em;line-height:1;padding:5px 4px;color:var(--hud);transition:color .2s}
#tCtl button:hover,#tCtl button:focus-visible{color:var(--ink)}
#tCtl>span{display:contents}#tw .runonly{display:none}#tw.run .runonly{display:contents}#tw.run .idleonly{display:none}
.segx{display:flex;background:rgba(127,127,140,.14);border-radius:6px;padding:2px}
.segx button{all:unset;cursor:pointer;padding:4px 9px;border-radius:5px;color:var(--card-ink);opacity:.6}
.segx button.on{background:var(--card);opacity:1;box-shadow:0 1px 2px rgba(0,0,0,.15)}
@media (hover:none){#tmr{opacity:.18}}
@media (prefers-reduced-motion:reduce){#tmr,#tCtl,#tmr .sec{transition:none}#tw.done #tmr{animation:none}}
#drop{position:absolute;inset:12px;border:2px dashed var(--hud);border-radius:14px;z-index:12;display:none;align-items:center;justify-content:center;font-size:14px;color:var(--hud);pointer-events:none}
body.dragging #drop{display:flex}
#ta{position:absolute;left:0;top:0;width:2px;height:20px;opacity:0;padding:0;border:0;margin:0;resize:none;outline:none;overflow:hidden;
  font-size:16px;color:transparent;background:transparent;caret-color:transparent;white-space:pre;z-index:1}
#print{display:none}
@media (max-width:640px){ #hud .dk{display:none} #wc{margin-right:2px} #hud{padding-left:8px;padding-right:8px;font-size:12px} #name{width:11ch} #hud button{padding:5px 6px} #opts{right:8px;width:calc(100vw - 16px)} }
@media print{
  #stage{display:none!important}
  html,body{position:static;overflow:visible;height:auto;background:#fff}
  #print{display:block;color:#111;font:12pt/1.65 'Courier Prime','Courier New',monospace}
  #print h1,#print h2,#print h3{font-size:13pt;margin:1.3em 0 .5em}
  #print p{margin:0 0 .9em}
  @page{margin:22mm 20mm}
}
</style>
</head>
<body class="hide-ui blurred">
<div id="stage">
  <div class="layer" id="bgNight"></div>
  <div class="layer" id="bgDay"></div>
  <div class="layer tex" id="tex"></div>
  <div id="lamp"></div>
  <div id="hot"></div>
  <div class="layer" id="texLit"><div class="tex" id="texLitIn"></div></div>
  <div id="view">
    <div id="lines"></div>
    <div id="lit"><div id="litIn"><div id="litE"></div><div id="litG"></div></div></div>
  </div>
  <div id="hint">Start typing…</div>
  <div id="bar"></div>
  <div id="barGlint"></div>
  <div id="caret"></div>
  <div id="head"><div id="hb"><canvas id="headC"></canvas><div id="win"><canvas id="winC"></canvas></div></div><div id="led"></div></div>
  <div id="swapLbl"></div>
  <canvas id="knob"></canvas>
  <div id="hud">
    <input id="name" spellcheck="false" autocomplete="off" value="Untitled" aria-label="File name"><span id="dot">•</span>
    <span class="sp"></span>
    <span id="wc">0 words</span>
    <button data-a="new" class="dk">new</button>
    <span class="menu" id="saveMenu"><button data-a="save">save</button><button data-a="menu" class="car" aria-label="More save options">▾</button>
      <div id="saveDrop"><div class="pc"><button data-a="open">open…</button><button data-a="dopen" class="donly">open from Drive…</button><button data-a="dsave" class="donly">save to Drive</button><button data-a="pdf">export as PDF</button></div></div></span>
    <button data-a="opts" id="optsBtn">options</button>
  </div>
  <div id="opts">
    <div class="orow"><span>Paper</span><div class="seg" data-k="theme"><button data-v="day">day</button><button data-v="night">night</button></div></div>
    <div class="orow"><span>Lamp</span><div class="seg" data-k="lamp"><button data-v="on">on</button><button data-v="off">off</button></div></div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);

      lampEl=$('#lamp'),hotEl=$('#hot'),bar=$('#bar'),barGlint=$('#barGlint'),head=$('#head'),hb=$('#hb'),glyphEl=$('#winC'),
      swapLbl=$('#swapLbl'),caretEl=$('#caret'),hint=$('#hint'),wcEl=$('#wc'),nameEl=$('#name'),knob=$('#knob'),view=$('#view'),
      fileInput=$('#file'),toastEl=$('#toast'),modalEl=$('#modal'),optsEl=$('#opts'),twEl=$('#tw'),tmrEl=$('#tmr'),saveMenu=$('#saveMenu'),body=document.body,root=document.documentElement,texLit=$('#texLit'),texLitIn=$('#texLitIn'),litIn=$('#litIn');
const IN_FRAME=(()=>{try{return window.self!==window.top}catch(e){return true}})();
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
             set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const ANIM=130;

/* ---------- settings ---------- */
const S={theme:store.get('tw2.theme','night'),lamp:store.get('tw2.lamp',null),center:store.get('tw2.center',false),sound:store.get('tw2.sound',true),haptics:store.get('tw2.haptics',true)};
if(S.lamp===null)S.lamp=S.theme==='night';

/* ---------- layout ---------- */
const L={W:0,H:0,fs:17,lh:30,cw:10,cols:64,left:0,typeY:0,mobile:false,rx:420,ry:240};
const KW=30,KH=128;let kctx=null,dpr=1;
function measure(){
  const vv=window.visualViewport;

  const mobile=W<640;

  Object.assign(L,{W,H,fs,lh,cw,cols,left,typeY,mobile,rx,ry});W_.mp='';W_.fk='';W_.gx=W_.gy=NaN;
  root.style.setProperty('--fs',fs+'px');root.style.setProperty('--lh',lh+'px');root.style.setProperty('--cw',cw+'px');
  root.style.setProperty('--rx',rx+'px');root.style.setProperty('--ry',ry+'px');
  stage.style.height=H+'px';stage.style.top=(vv?vv.offsetTop:0)+'px';
  bar.style.transform=`translateY(${typeY}px)`;

  // lamp ellipse: centred a little above the typing line, spill fades out just below the bar
  lampEl.style.width=rx*2+'px';lampEl.style.height=ry*2+'px';
  const headInLamp=ry+ry*.42;
  const m=`linear-gradient(to bottom,#000 0px,#000 ${headInLamp-14}px,rgba(0,0,0,.55) ${headInLamp}px,rgba(0,0,0,.22) ${headInLamp+18}px,rgba(0,0,0,.07) ${headInLamp+42}px,transparent ${headInLamp+80}px)`;
  lampEl.style.webkitMaskImage=m;lampEl.style.maskImage=m;

  const vm=`linear-gradient(to bottom,transparent 0px,rgba(0,0,0,.2) ${fadeTop*.3}px,#000 ${fadeTop}px,#000 ${typeY+1}px,rgba(0,0,0,.55) ${typeY+6}px,transparent ${H}px)`;
  view.style.webkitMaskImage=vm;view.style.maskImage=vm;

  knob.style.display=mobile?'none':'block';
  knob.style.transform=`translate(${W-KW-16}px,${typeY-KH/2}px)`;
  kctx=knob.getContext('2d');lastKnob=null;renderHead();

/* ---------- markdown model: raw text in the textarea, markers hidden on paper ---------- */
/* bits: 1 bold · 2 italic · 4 hidden · 8 heading · 16 opening marker · 32 closing/prefix marker */
const pcache=new Map();
const isAlnum=c=>/[A-Za-z0-9]/.test(c||'');
function parse(str){
  let P=pcache.get(str);if(P)return P;
  const n=str.length,st=new Uint8Array(n),runs=[];let hp=0;
  const m=str.match(/^(#{1,6})[ \t]+/);
  if(m){hp=m[0].length;st.fill(8);for(let k=0;k<hp;k++)st[k]|=4|32}
  // bold: ** or __
  for(let i=hp;i<n-1;i++){
    const mk=str.substr(i,2);
    if((mk!=='**'&&mk!=='__')||st[i]&4||str[i-1]==='\\')continue;
    if(mk==='__'&&isAlnum(str[i-1]))continue;
    let k=str.indexOf(mk,i+3);
    while(k>0&&str[k+2]===mk[0]&&str.indexOf(mk,k+1)===k+1)k++; // prefer the last of a run of markers
    if(k<0)continue;
    if(!str.slice(i+2,k).trim())continue;
    if(mk==='__'&&isAlnum(str[k+2]))continue;
    st[i]|=4|16;st[i+1]|=4|16;st[k]|=4|32;st[k+1]|=4|32;
    for(let j=i+2;j<k;j++)st[j]|=1;
    runs.push({ra:i,ca:i+2,cb:k,rb:k+2,bit:1});i=k+1;
  }
  // italic: * or _
  for(let i=hp;i<n;i++){
    const c=str[i];
    if((c!=='*'&&c!=='_')||st[i]&4||str[i-1]==='\\')continue;
    if(c==='*'&&(str[i+1]==='*'||str[i-1]==='*'))continue;
    if(c==='_'&&isAlnum(str[i-1]))continue;
    let k=i+1,found=-1;
    for(;k<n;k++){
      if(str[k]===c&&!(st[k]&4)&&str[k-1]!=='\\'){
        if(c==='*'&&str[k+1]==='*')continue;
        if(c==='_'&&isAlnum(str[k+1]))continue;
        found=k;break;
      }
    }
    if(found<0||!str.slice(i+1,found).trim())continue;
    st[i]|=4|16;st[found]|=4|32;for(let j=i+1;j<found;j++)st[j]|=2;
    runs.push({ra:i,ca:i+1,cb:found,rb:found+1,bit:2});i=found;
  }
  P={st,runs,hp};
  if(pcache.size>4000)pcache.clear();
  pcache.set(str,P);return P;
}

let lines=[],lastText=null,lastCols=0;
let times=[],prev='';
let caretLine=0,caretCol=0,goalCol=null,goalAt=-1,userOff=0,wheelAcc=0;
let fileHandle=null,dirty=false,applying=false,pending=null,curBits=0;

function wrap(text,cols){
  const out=[];const n=text.length;let i=0;
  for(;;){
    let nl=text.indexOf('\n',i);if(nl<0)nl=n;
    const P=parse(text.slice(i,nl));const st=P.st;
    let p=i;
    if(nl===p)out.push({s:p,e:p,hard:true,ls:i,P});
    while(p<nl){
      let vis=0,k=p,lastSp=-1;
      while(k<nl){const w=st[k-i]&4?0:1;if(vis+w>cols)break;vis+=w;if(w&&text.charCodeAt(k)===32)lastSp=k;k++}
      if(k>=nl){out.push({s:p,e:nl,hard:true,ls:i,P});p=nl;break}
      let br;
      if(text.charCodeAt(k)===32)br=k+1;else if(lastSp>p)br=lastSp+1;else br=k;
      out.push({s:p,e:br,hard:false,ls:i,P});p=br;
    }
    const last=out[out.length-1];if(last.e===nl&&!last.hard)last.hard=true;
    if(nl>=n)break;
    i=nl+1;
  }
  return out;
}
function findLine(idx){let lo=0,hi=lines.length-1;while(lo<hi){const mid=(lo+hi+1)>>1;if(lines[mid].s<=idx)lo=mid;else hi=mid-1}return lo}
function stAt(j){if(j<0||j>=lastText.length)return 0;const ln=lines[findLine(j)];return ln.P.st[j-ln.ls]||0}
const hid=j=>(stAt(j)&4)!==0;
function visCount(ln,a,b){let v=0;for(let j=a;j<b;j++)if(!(ln.P.st[j-ln.ls]&4))v++;return v}
function visLen(ln){return visCount(ln,ln.s,ln.e)}
function colToRaw(ln,col){
  const max=ln.hard?visLen(ln):Math.max(0,visLen(ln)-1);col=clamp(col,0,max);
  let j=ln.s,v=0;
  while(j<ln.e&&v<col){if(!(ln.P.st[j-ln.ls]&4))v++;j++}
  while(j<ln.e&&(ln.P.st[j-ln.ls]&36)===36)j++;
  return j;
}
function logicalRuns(idx){const ln=lines[findLine(idx)];return{ln,runs:ln.P.runs,ls:ln.ls,P:ln.P}}
function styleAt(idx){
  const {runs,ls,P}=logicalRuns(idx);let b=0;const r=idx-ls;
  for(const u of runs)if(u.ca<=r&&r<=u.cb)b|=u.bit;
  if(P.hp&&r>=P.hp)b|=8;
  return b;
}
const caretIndex=()=>ta.selectionDirection==='backward'?ta.selectionStart:ta.selectionEnd;
function spliceArr(arr,p,del,items){
  if(items.length<20000){arr.splice(p,del,...items);return}
  const tail=arr.slice(p+del);arr.length=p;for(const x of items)arr.push(x);for(const x of tail)arr.push(x);
}

/* ---------- rendering ---------- */
const caches={base:new Map(),E:new Map(),G:new Map()};
let curS=0,vS=0,targetS=0,cx=0,vx=0,lastDrawS=-1e9,paperX=0,headX=0;
const escMap={'<':'&lt;','>':'&gt;','&':'&amp;'};
const esc=s=>s.replace(/[<>&]/g,c=>escMap[c]);

function render(){
  const text=ta.value;
  if(text!==lastText||L.cols!==lastCols){lines=wrap(text,L.cols);lastText=text;lastCols=L.cols;updateCount()}
  const ci=caretIndex();
  if(ci!==goalAt)goalCol=null;
  if(pending&&(ta.selectionStart!==ta.selectionEnd||ci!==pending.at))pending=null;
  caretLine=findLine(ci);const ln=lines[caretLine];caretCol=visCount(ln,ln.s,ci);
  userOff=clamp(userOff,-caretLine*L.lh,(lines.length-1-caretLine)*L.lh);
  targetS=caretLine*L.lh+userOff;
  hint.style.opacity=text.length?0:'';
  setIndicator(styleAt(ci)|(pending?pending.bits:0),false);
  drawLines();
}
function lineHTML(ln,mode,text,now,sa,sb){
  const st=ln.P.st,ls=ln.ls;let h='',buf='',key='',vc=0,chunkStart=0;
  const flush=()=>{if(!buf)return;
    if(mode==='E')h+=`<span class="k${key}" style="--c:${(chunkStart+vc)/2}">${esc(buf)}</span>`;
    else h+=key?`<span class="${key.trim()}">${esc(buf)}</span>`:esc(buf);
    buf='';};
  for(let j=ln.s;j<ln.e;j++){
    const code=st[j-ls];if(code&4)continue;
    const ch=text[j];const sel=j>=sa&&j<sb;
    let k='';if(code&9)k+=' b';if(code&2)k+=' i';if(sel&&mode==='base')k+=' s';
    const fresh=now-times[j]<ANIM;
    if(fresh){
      flush();
      if(mode==='base')h+=`<span class="c f${k}" style="animation-delay:${-((now-times[j])|0)}ms">${esc(ch)}</span>`;
      else h+=' ';
      vc++;chunkStart=vc;key=k;continue;
    }
    if(k!==key||(mode==='E'&&vc-chunkStart>=6)){flush();key=k;chunkStart=vc}
    buf+=ch;vc++;
  }
  flush();return h;
}
function drawLayer(map,parent,first,last,mode,sa,sb,now){
  const text=lastText,seen=new Set();
  for(let i=first;i<=last;i++){
    const ln=lines[i];
    let fresh=false;for(let j=ln.s;j<ln.e;j++){if(now-times[j]<ANIM){fresh=true;break}}
    const ssa=Math.max(sa,ln.s),ssb=Math.min(sb,ln.e);
    const sig=ln.s+'|'+ln.e+'|'+text.slice(ln.s,ln.e)+'|'+(ssa<ssb&&mode==='base'?ssa+'-'+ssb:'')+'|'+(fresh?now:'')+'|'+ln.P.st.subarray(ln.s-ln.ls,ln.e-ln.ls).join('');
    let c=map.get(i);
    if(!c){c={el:document.createElement('div'),sig:''};c.el.className='ln';parent.appendChild(c.el);map.set(i,c)}
    c.el.style.top=(i*L.lh)+'px';
    if(mode!=='base')c.el.style.setProperty('--top',(i*L.lh+L.lh/2)+'px');
    else c.el.classList.toggle('below',i>caretLine);
    if(c.sig!==sig){c.el.innerHTML=lineHTML(ln,mode,text,now,sa,sb);c.sig=sig}
    seen.add(i);
  }
  for(const [i,c] of map)if(!seen.has(i)){c.el.remove();map.delete(i)}
}
function drawLines(){
  const now=performance.now();
  const s1=Math.min(curS,targetS),s2=Math.max(curS,targetS);
  const first=Math.max(0,Math.floor((s1-L.typeY)/L.lh)-2);
  const last=Math.min(lines.length-1,Math.ceil((s2+L.H-L.typeY+L.lh)/L.lh)+2);
  const sa=ta.selectionStart,sb=ta.selectionEnd===sa?sa:ta.selectionEnd;
  drawLayer(caches.base,linesEl,first,last,'base',sa,sb,now);
  if(S.lamp){
    const reach=Math.ceil((L.ry*1.45)/L.lh)+1;
    const lf=Math.max(0,Math.floor(s1/L.lh)-reach),ll=Math.min(lines.length-1,Math.ceil(s2/L.lh)+1);
    drawLayer(caches.E,litE,lf,ll,'E',0,0,now);
    drawLayer(caches.G,litG,lf,ll,'G',0,0,now);
  }else{drawLayer(caches.E,litE,0,-1,'E',0,0,now);drawLayer(caches.G,litG,0,-1,'G',0,0,now)}
  lastDrawS=curS;
}
function resetCaches(){for(const k in caches){for(const [,c] of caches[k])c.el.remove();caches[k].clear()}}

/* critically damped springs: smooth, never bouncy */
function spring(cur,vel,target,dt,k){const d=2*Math.sqrt(k);const acc=k*(target-cur)-d*vel;vel+=acc*dt;cur+=vel*dt;return[cur,vel]}
/* how long the carriage takes to get home from `chars` characters out: runs the same spring as frame()
   so the return sound's slam lands when the carriage does (≈.13 s for 5 chars, ≈.5 s for a full line) */
function returnTime(chars){
  let x=Math.abs(chars),v=0,t=0;const K=S.center?70:110;
  while(x>.3&&t<1.2){for(let q=0;q<4;q++)[x,v]=spring(x,v,0,1/240,Math.abs(x)>8?K:1400);t+=1/60}
  return t;
}
let lastT=0,lastKnob=null;
const W_={mp:'',fk:'',gx:NaN,gy:NaN}; // last values written to the lamp layers
function frame(t){
  const dt=Math.min(.032,lastT?(t-lastT)/1000:.016);lastT=t;
  // integrate in small steps for stability with stiff springs
  for(let q=0;q<4;q++){
    [curS,vS]=spring(curS,vS,targetS,dt/4,Math.abs(targetS-curS)>L.lh*3?120:340);
    const tx=caretCol*L.cw;
    [cx,vx]=spring(cx,vx,tx,dt/4,Math.abs(tx-cx)>L.cw*8?(S.center?70:110):1400);
  }
  if(Math.abs(curS-targetS)<.05&&Math.abs(vS)<.5){curS=targetS;vS=0}
  const tx=caretCol*L.cw;if(Math.abs(cx-tx)<.05&&Math.abs(vx)<.5){cx=tx;vx=0}
  paperX=S.center?Math.round((L.W/2-L.cw/2-cx)*2)/2:L.left;
  headX=S.center?L.W/2:L.left+cx+L.cw/2;
  // nothing moved since last frame: skip all writes (the loop just idles)
  const fk=paperX+'|'+headX+'|'+curS+'|'+cx+'|'+caretLine+'|'+L.typeY+'|'+L.W;
  if(fk===W_.fk){requestAnimationFrame(frame);return}
  W_.fk=fk;
  const ty=L.typeY-L.lh-curS;
  const tr=`translate3d(${paperX}px,${ty}px,0)`;
  linesEl.style.transform=litE.style.transform=litG.style.transform=tr;
  const top=L.typeY-L.lh+caretLine*L.lh-curS;
  caretEl.style.transform=`translate3d(${paperX+cx}px,${top+L.lh*.18}px,0)`;
  head.style.transform=`translate3d(${headX}px,${L.typeY}px,0)`;
  barGlint.style.transform=`translate3d(${headX}px,${L.typeY}px,0)`;
  swapLbl.style.transform=`translate3d(${headX}px,${L.typeY+16}px,0) translateX(-50%)`;
  const cy=L.typeY-L.ry*.42;
  lampEl.style.transform=`translate3d(${headX-L.rx}px,${cy-L.ry}px,0)`;
  hotEl.style.transform=`translate3d(${headX}px,${L.typeY}px,0)`;
  const ox=headX-L.rx,oy=cy-L.ry,mp=ox+','+oy;
  if(mp!==W_.mp){W_.mp=mp;
    texLit.style.transform=litWrap.style.transform=`translate3d(${ox}px,${oy}px,0)`;
    texLitIn.style.transform=litIn.style.transform=`translate3d(${-ox}px,${-oy}px,0)`}

  // these change, so they move in small steps (invisible at this shadow size) instead of every frame.
  const q=L.cw/2,gxN=Math.round((headX-paperX)/q)*q,gyN=Math.round((L.typeY-L.lh*.55-ty)/4)*4,eyN=Math.round((L.typeY+14-ty)/4)*4;
  if(gxN!==W_.gx){W_.gx=gxN;litG.style.setProperty('--gx',gxN+'px');litE.style.setProperty('--ex',gxN+'px')}
  if(gyN!==W_.gy){W_.gy=gyN;litG.style.setProperty('--gy',gyN+'px');litE.style.setProperty('--ey',eyN+'px')}
  hint.style.transform=`translate(${paperX}px,${L.typeY-L.lh}px)`;
  if(Math.abs(curS-lastDrawS)>L.lh*1.2)drawLines();
  const ang=curS/L.lh*0.32;
  if(lastKnob===null||Math.abs(ang-lastKnob)>.002){drawKnob(ang);lastKnob=ang}
  requestAnimationFrame(frame);
}

/* ---------- platen knob ---------- */
/* ---------- per-pixel shading for the metal parts (studio-lit, not CSS gradients) ---------- */
const sat=x=>x<0?0:x>1?1:x;
const sstep=(a,b,x)=>{const t=sat((x-a)/(b-a));return t*t*(3-2*t)};
const nrm=(x,y,z)=>{const l=Math.hypot(x,y,z)||1;return[x/l,y/l,z/l]};

  if(!S.sound||audioReady)return;

  try{const b=c.createBuffer(1,1,22050),src=c.createBufferSource();src.buffer=b;src.connect(c.destination);src.start(0)}catch(e){}

/* ---------- haptics: Android vibrates; iOS 18+ Safari gives a tick when a switch control toggles ---------- */
const haptic=(()=>{
  const touch=matchMedia('(pointer:coarse)').matches,canVib=typeof navigator.vibrate==='function';
  const iOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  let lbl=null,last=0;
  function iosTick(){
    if(!lbl){const inp=document.createElement('input');inp.type='checkbox';inp.setAttribute('switch','');inp.id='hsw';inp.tabIndex=-1;
      inp.style.cssText='position:fixed;left:-200px;top:0;opacity:0;pointer-events:none';
      lbl=document.createElement('label');lbl.htmlFor='hsw';lbl.style.cssText=inp.style.cssText;document.body.append(inp,lbl)}
    const had=document.activeElement;lbl.click();if(had&&document.activeElement!==had)had.focus({preventScroll:true});
  }
  return(ms)=>{
    if(!touch||!S.haptics)return;const n=performance.now();if(n-last<18)return;last=n;
    try{
      if(canVib)navigator.vibrate(ms);

      // textarea for a frame (keyboard flickers, page bounces). So never use it while the keyboard is up.
      else if(iOS&&document.activeElement!==ta&&(!navigator.userActivation||navigator.userActivation.isActive))iosTick();

})();

function glyphStyle(b){}
function setIndicator(bits,loud){

/* replace a raw range while keeping markdown runs balanced */
function needsCustom(a,b){
  for(let j=a;j<b;j++)if(hid(j))return true;
  if(a>=b)return false;
  const L1=findLine(a),L2=findLine(Math.max(a,b-1));
  for(let li=L1;li<=L2;li++){const ln=lines[li];if(li>L1&&ln.ls===lines[li-1].ls)continue;
    for(const u of ln.P.runs){const ca=ln.ls+u.ca,cb=ln.ls+u.cb;if(ca>=a&&cb<=b)return true}}

function replaceRange(A,B,ins){
  const v=ta.value;let close='',open='';
  const L1=findLine(A),L2=findLine(Math.max(A,B-1));const seenL=new Set();
  const runs=[];
  for(let li=L1;li<=L2;li++){const ln=lines[li];if(seenL.has(ln.ls))continue;seenL.add(ln.ls);
    for(const u of ln.P.runs)runs.push({ra:ln.ls+u.ra,ca:ln.ls+u.ca,cb:ln.ls+u.cb,rb:ln.ls+u.rb})}
  for(const u of runs){ // widen across split markers
    if(A>u.ra&&A<u.ca)A=u.ra;if(B>u.cb&&B<u.rb)B=u.rb;
    if(A>u.cb&&A<u.rb)A=u.cb;if(B>u.ra&&B<u.ca)B=u.ca;
  }
  for(const u of runs){
    if(u.rb<=A||u.ra>=B)continue;

    if(u.ra>=A&&u.ca<=B&&u.cb>B)open+=v.slice(u.ra,u.ca);
    if(u.cb>=A&&u.rb<=B&&u.ca<A)close=v.slice(u.cb,u.rb)+close;

  const c=A+close.length+ins.length;ta.setSelectionRange(c,c);render();
}
ta.addEventListener('beforeinput',e=>{

    e.preventDefault();const [op,cl]=markers(pending.bits);pending=null;
    forceTyped=true;execInsert(op+e.data+cl);forceTyped=false;
    const c=a+op.length+e.data.length;ta.setSelectionRange(c,c);render();return;
  }
  if(t.startsWith('delete')){
    let A=a,B=b,custom=false;

        let j=a;while(j>0&&hid(j-1))j--;
        if(j<a&&(stAt(j)&8)&&(stAt(j)&32)&&(j===0||v[j-1]==='\n')){A=j;B=a;custom=true} // remove heading
        else{if(j===0){if(j<a)e.preventDefault();return}A=j-1;B=j;custom=j!==a||needsCustom(A,B)}

      }else if(t==='deleteWordForward'){

      }else if(t==='deleteSoftLineBackward'||t==='deleteHardLineBackward'){

/* bold / italic: swap the type element */
function toggleStyle(bit){

  if(pending&&pending.at===idx){pending.bits^=bit;const pb=pending.bits;if(!pb)pending=null;setIndicator(styleAt(idx)|pb,true);return}
  const inside=runs.find(u=>u.bit===bit&&u.ca<=r&&r<=u.cb);
  if(inside){
    if(r===inside.cb){ta.setSelectionRange(ls+inside.rb,ls+inside.rb)}
    else if(r===inside.ca){ta.setSelectionRange(ls+inside.ra,ls+inside.ra)}
    else{const mk=v.slice(ls+inside.cb,ls+inside.rb);execInsert(mk+mk);ta.setSelectionRange(idx+mk.length,idx+mk.length)}
    render();swapForce();return;
  }

/* ---------- files ---------- */
function setDirty(v){dirty=v;body.classList.toggle('dirty',v);if(typeof updateTitle==='function')try{updateTitle()}catch(e){}}
function fileName(){return(nameEl.value.trim()||'Untitled').replace(/[\\/:*?"<>|]/g,'-')}
function loadText(text,name){
  text=text.replace(/\r\n?/g,'\n').replace(/\t/g,'    ');
  ta.value=text;prev=text;times=new Array(text.length).fill(0);pending=null;
  nameEl.value=(name||'Untitled').replace(/\.(md|markdown|txt)$/i,'');try{updateTitle()}catch(e){}
  ta.focus({preventScroll:true});ta.setSelectionRange(text.length,text.length);
  userOff=0;wheelAcc=0;setDirty(false);render();curS=targetS;vS=0;cx=caretCol*L.cw;vx=0;drawLines();scheduleDraft();

/* tidy the markdown on the way out: spaces belong outside ** and _ */
function exportText(){
  return ta.value.split('\n').map(line=>{
    const P=parse(line);if(!P.runs.length)return line;
    let s=line;
    for(const u of [...P.runs].sort((x,y)=>y.ra-x.ra)){
      const c=s.slice(u.ca,u.cb),lead=c.length-c.trimStart().length,trail=c.length-c.trimEnd().length;
      if(!lead&&!trail)continue;
      s=s.slice(0,u.ra)+' '.repeat(lead)+s.slice(u.ra,u.ca)+c.trim()+s.slice(u.cb,u.rb)+' '.repeat(trail)+s.slice(u.rb);

async function guard(){

/* ---------- Google Drive ----------
   Files live in one Drive folder (inside "written"). The typing draft is kept in the browser as before;
   "save" on a Drive file pushes it to Drive. Before pushing, the file's version is checked: if it was
   saved from another device since it was opened here, you choose which version to keep.
   Sign-in is Google Identity Services (token in the browser, ~1 h); the OAuth app is internal to
   jonathantari.com. Set DRIVE_CLIENT_ID to turn it on. */
const DRIVE_CLIENT_ID='102587940909-vbn59bmcjfug7ei26r73sq50i8rhd9if.apps.googleusercontent.com';
const drive=(()=>{
  const CID=DRIVE_CLIENT_ID,FOLDER='1lLmdoDPg2MI0tnWDNrzrQiqoN2r9opIm',SCOPE='https://www.googleapis.com/auth/drive',API='https://www.googleapis.com';
  let tok=store.get('tw.gtok',null),client=null,waiting=null,file=null;
  const on=!!CID;
  body.classList.toggle('drive',on);
  function init(){
    client=google.accounts.oauth2.initTokenClient({client_id:CID,scope:SCOPE,hd:'jonathantari.com',
      callback:r=>{const w=waiting;waiting=null;
        if(r.error){w&&w.rej(new Error(r.error));return}
        tok={t:r.access_token,exp:Date.now()+(r.expires_in-60)*1000};store.set('tw.gtok',tok);store.set('tw.gdrive',true);row();w&&w.res(tok.t)},
      error_callback:e=>{const w=waiting;waiting=null;w&&w.rej(new Error(e&&e.type||'popup'))}});
  }
  if(on){const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.onload=init;document.head.appendChild(s)}
  const connected=()=>!!store.get('tw.gdrive',false);
  // call this first thing in a click/keypress handler: the sign-in popup needs the user's gesture
  function token(){
    if(tok&&tok.exp>Date.now())return Promise.resolve(tok.t);
    if(!client)return Promise.reject(new Error('Drive is still loading — try again'));
    return new Promise((res,rej)=>{waiting={res,rej};client.requestAccessToken({prompt:connected()?'':'consent'})});
  }
  async function api(path,o={},raw){
    const r=await fetch(API+path,{...o,headers:{...(o.headers||{}),Authorization:'Bearer '+tok.t}});
    if(r.status===401){tok=null;store.set('tw.gtok',null);throw new Error('auth')}
    if(!r.ok){let m='';try{m=(await r.json()).error.message}catch(e){}throw new Error(m||('HTTP '+r.status))}
    return raw?r.text():r.json();
  }
  function fail(e){
    const m=String(e&&e.message||e);

    else if(/popup|access_denied/.test(m))toast('Drive sign-in was closed or blocked',3000);

  }
  function when(iso){const d=new Date(iso),now=new Date();
    return d.toDateString()===now.toDateString()?d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):d.toLocaleDateString([],{day:'numeric',month:'short',year:d.getFullYear()===now.getFullYear()?undefined:'numeric'})}
  function upload(id,name,text){
    const b='tw'+Math.random().toString(36).slice(2),meta=id?{name}:{name,parents:[FOLDER],mimeType:'text/markdown'};
    const data=`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: text/markdown; charset=UTF-8\r\n\r\n${text}\r\n--${b}--`;
    return api(`/upload/drive/v3/files${id?'/'+id:''}?uploadType=multipart&fields=id,name,version`,{method:id?'PATCH':'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body:data});
  }
  async function open(id){
    const [m,text]=await Promise.all([api(`/drive/v3/files/${id}?fields=id,name,version`),api(`/drive/v3/files/${id}?alt=media`,{},true)]);
    fileHandle=null;file={id:m.id,version:m.version};loadText(text,m.name);toast('Opened '+m.name);
  }
  async function browse(){
    saveMenu.classList.remove('on');optsEl.classList.remove('on');
    const tp=token();tp.catch(()=>{});
    if(!(await guard()))return;
    try{await tp;
      const q=encodeURIComponent(`'${FOLDER}' in parents and trashed=false and mimeType!='application/vnd.google-apps.folder'`);
      const [dir,r]=await Promise.all([api(`/drive/v3/files/${FOLDER}?fields=name`),api(`/drive/v3/files?q=${q}&orderBy=modifiedTime desc&pageSize=300&fields=files(id,name,modifiedTime)`)]);
      const fs=r.files.filter(f=>/\.(md|markdown|txt)$/i.test(f.name));
      const list=fs.length?'<div class="dlist">'+fs.map(f=>`<button class="dfile" data-id="${f.id}"><span>${esc(f.name.replace(/\.(md|markdown|txt)$/i,''))}</span><span class="dm">${when(f.modifiedTime)}</span></button>`).join('')+'</div>'
        :'<p style="opacity:.7">No .md files here yet. Write something and use “save to Drive”.</p>';
      const mb=$('#mBody');

      mb.onclick=e=>{const b=e.target.closest('.dfile');if(!b)return;mb.onclick=null;modalEl.classList.remove('on');open(b.dataset.id).catch(fail)};
      p.then(()=>{mb.onclick=null});

  async function save(){   // push the current page to Drive (creates it in the folder if it isn't a Drive file yet)
    const tp=token();

  function row(){const b=$('#dBtn');if(b)b.textContent=connected()?'disconnect':'connect'}

})();

function lineToHtml(line){
  const P=parse(line);let h='',cur='';
  const tagOpen=b=>(b&1||b&8?'<b>':'')+(b&2?'<i>':''),tagClose=b=>(b&2?'</i>':'')+(b&1||b&8?'</b>':'');
  let prevB=0;
  for(let j=0;j<line.length;j++){const c=P.st[j];if(c&4)continue;const bb=c&11;if(bb!==prevB){h+=tagClose(prevB)+tagOpen(bb);prevB=bb}h+=esc(line[j])}
  return h+tagClose(prevB);
}

/* ---------- timer + focus ----------
   An egg timer in the corner. Start 5/10/25 min, then +5 as often as you like. The wedge of ink
   creeps back toward 12 o'clock every second (no flashing, no numbers unless you hover). At the end a
   soft bell sounds and the dial breathes twice — nothing stops, you keep typing. "Focus" (options
   panel or Ctrl/Cmd+Shift+F) is browser full screen on desktop; Esc leaves full screen only. */
const timer=(()=>{
  let endAt=0,total=0,tid=0,doneT=0;
  const secEl=$('#tmrSec'),leftEl=$('#tLeft'),fBtn=$('#fBtn');
  const canFs=()=>!!(document.fullscreenEnabled&&document.documentElement.requestFullscreen)&&matchMedia('(pointer:fine)').matches;
  const hover=matchMedia('(hover:hover)');
  const fmt=ms=>{const t=Math.max(0,Math.ceil(ms/1000)),m=Math.floor(t/60),r=t%60;return m+':'+(r<10?'0':'')+r};
  function draw(left){
    leftEl.textContent=fmt(left);
    secEl.style.strokeDasharray=(total?Math.max(0,Math.min(1,left/total))*100:0).toFixed(3)+' 100';
  }
  function tick(){if(!endAt)return;const l=endAt-Date.now();if(l>0)draw(l);else finish()}
  function finish(){
    clearInterval(tid);tid=0;endAt=0;draw(0);leftEl.textContent='done';
    twEl.classList.remove('run');twEl.classList.add('done');snd.bell();doneT=setTimeout(reset,14000);
  }
  function reset(){
    clearInterval(tid);tid=0;endAt=0;total=0;clearTimeout(doneT);
    twEl.classList.remove('run','done');secEl.style.strokeDasharray='0 100';leftEl.textContent='';
  }
  function add(m){  // starts a timer when idle, otherwise adds to the one running
    if(endAt){endAt+=m*60000;total=Math.max(total,endAt-Date.now())}
    else{reset();endAt=Date.now()+m*60000;total=m*60000;twEl.classList.add('run');tid=setInterval(tick,1000)}
    draw(endAt-Date.now());
  }
  function fsToggle(){
    if(!canFs())return toast('Full screen isn’t available here');
    if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});
    else{document.documentElement.requestFullscreen({navigationUI:'hide'}).catch(()=>{});
      if(/Mac|iPhone|iPad/.test(navigator.platform))toast('Tip: turn on Focus / Do Not Disturb to silence notifications',5000)}
  }
  document.addEventListener('fullscreenchange',()=>{fBtn.classList.toggle('on',!!document.fullscreenElement);setTimeout(relayout,60)});
  if(!canFs())$('#fRow').style.display='none';
  // mouse: the dial opens on hover and closes when you move away. Touch: tap the dial to open/close.
  let closeT=0;
  tmrEl.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse'){clearTimeout(closeT);twEl.classList.add('open')}});
  twEl.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'){clearTimeout(closeT);closeT=setTimeout(()=>twEl.classList.remove('open'),350)}});
  $('#tCtl').addEventListener('pointerenter',()=>clearTimeout(closeT));
  // click the dial: starts 5 min when idle, adds 5 min each further click. Touch: first tap opens the dial, taps after that add.
  tmrEl.addEventListener('click',()=>{
    if(!hover.matches&&!twEl.classList.contains('open')){twEl.classList.add('open');return}
    add(5);ta.focus({preventScroll:true})});
  $('#tCtl').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.m)add(+b.dataset.m);else if(b.dataset.add)add(+b.dataset.add);else if(b.id==='tEnd')reset();
    if(!hover.matches)twEl.classList.remove('open');ta.focus({preventScroll:true})});
  fBtn.addEventListener('click',()=>{fsToggle();ta.focus({preventScroll:true})});
  return{add,end:reset,toggleFs:fsToggle};
})();

/* ---------- tab title: "(2) My chapter" ---------- */
const tabs=(()=>{
  const id=Math.random().toString(36).slice(2),born=Date.now()+Math.random();const peers=new Map();let bc=null,num=0,count=1;
  try{bc=new BroadcastChannel('typewriter-tabs')}catch(e){}
  function recalc(){const now=Date.now();for(const [k,v] of peers)if(now-v.seen>5000)peers.delete(k);
    const all=[born,...[...peers.values()].map(v=>v.born)].sort((a,b)=>a-b);num=all.indexOf(born)+1;count=all.length;updateTitle()}
  if(bc){bc.onmessage=e=>{const m=e.data;if(!m||m.id===id)return;
      if(m.t==='bye')peers.delete(m.id);else{const had=peers.has(m.id);peers.set(m.id,{born:m.born,seen:Date.now()});if(m.t==='hello'&&!had)bc.postMessage({t:'here',id,born})}
      recalc()};
    bc.postMessage({t:'hello',id,born});setInterval(()=>{bc.postMessage({t:'beat',id,born});recalc()},2000);
    addEventListener('pagehide',()=>{try{bc.postMessage({t:'bye',id})}catch(e){}})}
  return{get num(){return num},get count(){return count}};
})();
function updateTitle(){
  const n=(nameEl.value.trim()||'Untitled');
  document.title=(tabs.count>1?`(${tabs.num}) `:'')+(dirty?'• ':'')+n;
}

})();
