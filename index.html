<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>garage</title>
<meta name="description" content="Jonathan Tari's garage.">
<meta name="theme-color" content="#4a4a50">
<style>
  html, body { margin: 0; height: 100%; background: #4a4a50; overflow: hidden; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
  canvas { position: fixed; bottom: 0; display: block; image-rendering: pixelated; image-rendering: crisp-edges; -webkit-tap-highlight-color: transparent; }
  #crate { position: fixed; display: block; border-radius: 6px; -webkit-tap-highlight-color: transparent; }
  #crate:focus-visible { outline: 2px solid #f2a34b; outline-offset: 3px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<h1 class="sr">Jonathan Tari's garage</h1>
<canvas id="c" aria-hidden="true"></canvas>
<a id="crate" href="/turnaround/" aria-label="Turnaround"></a>
<script>
(function () {
  "use strict";
  var cv = document.getElementById("c"), ctx = cv.getContext("2d");
  var link = document.getElementById("crate");
  var RM = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var skyC = document.createElement("canvas"), skyX = skyC.getContext("2d");
  var scnC = document.createElement("canvas"), scnX = scnC.getContext("2d");

  // ---------- utils ----------
  var BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  function bay(x, y) { return (BAY[((y & 3) << 2) | (x & 3)] + 0.5) / 16; }
  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function hx(s) { return [parseInt(s.substr(1, 2), 16), parseInt(s.substr(3, 2), 16), parseInt(s.substr(5, 2), 16)]; }
  function mix(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
  function dk(c, k) { return [c[0] * k, c[1] * k, c[2] * k]; }
  function css(c, a) { return "rgba(" + (c[0] | 0) + "," + (c[1] | 0) + "," + (c[2] | 0) + "," + (a == null ? 1 : a) + ")"; }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

  var K = {
    skyDay: ["#5a97cf", "#71a8d8", "#8fbde2", "#b0d2ea", "#cde3ef"].map(hx),
    skyNight: ["#10142a", "#181e40", "#232b56", "#353a6c", "#4e4878"].map(hx),
    star: hx("#fff3d6"), moon: hx("#f4e7c0"),
    siding: hx("#8fa3b2"), lap: hx("#7d91a1"), trim: hx("#eeebe3"), trimSh: hx("#c4c2bc"),
    roof: hx("#58575f"), roofLn: hx("#48474f"), roofHi: hx("#66656e"),
    brick: hx("#93503f"), door: hx("#8b3a33"), brass: hx("#d6b25e"),
    glassDay: hx("#a9c6dc"), glassDayLo: hx("#7fa2bf"), glassNight: hx("#1e2440"),
    warmHi: hx("#ffe2a6"), warmLo: hx("#f1a85a"), curtain: hx("#d48a54"),
    grass: hx("#6e9a4e"), grassLo: hx("#628d44"), grassHi: hx("#7aa758"), shrub: hx("#4a7442"), shrubHi: hx("#5c8a50"),
    drive: hx("#b9b3a8"), driveLn: hx("#9d968c"), walk: hx("#c3bdb3"), walkLn: hx("#a39d93"),
    curb: hx("#d2cdc4"), road: hx("#4a4a50"), paver: hx("#a8a096"),
    ceil: hx("#c2b9a8"), wallIn: hx("#b8ad98"), backIn: hx("#ada18b"), floorIn: hx("#948f87"), floorSt: hx("#868179"),
    track: hx("#5a5a62"), panel: hx("#ece8de"), panelLn: hx("#c9c4b8"),
    shelf: hx("#6c6e76"), bins: ["#5c7896", "#a56e48", "#b89a6c", "#6e8a6a", "#8a8e96"].map(hx),
    slat: hx("#c49a62"), slatLo: hx("#a77f4c"), gap: hx("#6e5132"), post: hx("#a57a46"), crateTop: hx("#d6ae76"), crateSide: hx("#93693c"),
    sticker: hx("#f3eee2"), stickerLn: hx("#d6cfbd"), ink: hx("#2a2a30"), amber: hx("#f2a34b"),
    bulbOff: hx("#d8d4c8"), bulbOn: hx("#fff1c4"), cord: hx("#2a2a2e"),
    trunk: hx("#5e4836"), leaf: hx("#5b8746"), leafHi: hx("#6e9a54"), leafLo: hx("#4a7139"),
    ridgeDay: hx("#8496ab"), slabDay: hx("#a39a98"), slabDayHi: hx("#b5aaa4"), slabDayLo: hx("#958c8c"), pineDay: hx("#5f7c5e"),
    ridgeNight: hx("#1d2346"), slabNight: hx("#262b52"), slabNightHi: hx("#30365e"), pineNight: hx("#171c38"),
    cat: hx("#19171c"), eye: hx("#e8c84a")
  };

  // zones: 0 sky (transparent), 1 exterior, 2 garage interior, 3 far (unlit), 4 emissive, 5 ground
  var P, W, H, dpr, cssW, cssH, cssLeft, night;
  var A, Z, SPILL;
  var zone = 1, R;
  var G = {}, wins = [], lights = [];

  function put(x, y, c) {
    x = x | 0; y = y | 0;
    if (x < 0 || y < 0 || x >= W || y >= H) return;
    var i = y * W + x; A[i * 3] = c[0]; A[i * 3 + 1] = c[1]; A[i * 3 + 2] = c[2]; Z[i] = zone;
  }
  function rect(x, y, w, h, c) {
    x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
    for (var j = 0; j < h; j++) for (var i = 0; i < w; i++) put(x + i, y + j, c);
  }
  function poly(pts, fn) {
    var minY = 1e9, maxY = -1e9, n = pts.length;
    for (var k = 0; k < n; k++) { minY = Math.min(minY, pts[k][1]); maxY = Math.max(maxY, pts[k][1]); }
    for (var y = Math.floor(minY); y <= Math.ceil(maxY); y++) {
      var sy = y + 0.5, xs = [];
      for (var e = 0; e < n; e++) {
        var a = pts[e], b = pts[(e + 1) % n];
        if ((a[1] <= sy && b[1] > sy) || (b[1] <= sy && a[1] > sy)) xs.push(a[0] + (sy - a[1]) * (b[0] - a[0]) / (b[1] - a[1]));
      }
      xs.sort(function (p, q) { return p - q; });
      for (var m = 0; m + 1 < xs.length; m += 2)
        for (var x = Math.round(xs[m]); x < Math.round(xs[m + 1]); x++) fn(x, y);
    }
  }
  function blob(cx, cy, rx, ry, fn) {
    for (var y = Math.floor(cy - ry); y <= cy + ry; y++) for (var x = Math.floor(cx - rx); x <= cx + rx; x++) {
      var d = ((x + 0.5 - cx) / rx) * ((x + 0.5 - cx) / rx) + ((y + 0.5 - cy) / ry) * ((y + 0.5 - cy) / ry);
      if (d <= 1) fn(x, y, d);
    }
  }

  var GLYPH = {
    t: [".#.", "###", ".#.", ".#.", "..#"],
    u: ["...", "#.#", "#.#", "#.#", ".##"],
    r: ["...", "#.#", "##.", "#..", "#.."],
    n: ["...", "##.", "#.#", "#.#", "#.#"],
    a: ["...", "##.", "..#", ".##", "###"],
    o: ["...", ".#.", "#.#", "#.#", ".#."],
    d: ["..#", "..#", ".##", "#.#", ".##"]
  };

  // day or night from the device clock, with a rough seasonal sunrise/sunset
  function isNight() {
    var q = location.search;
    if (/[?&]night/.test(q)) return true;
    if (/[?&]day/.test(q)) return false;
    var d = new Date(), start = new Date(d.getFullYear(), 0, 0);
    var doy = (d - start) / 864e5, hr = d.getHours() + d.getMinutes() / 60;
    var len = 12 + 4 * Math.cos(2 * Math.PI * (doy - 172) / 365);
    return hr < 12.8 - len / 2 || hr > 12.8 + len / 2;
  }

  // ---------- layout ----------
  function layout() {
    dpr = window.devicePixelRatio || 1;
    var vw = window.innerWidth, vh = window.innerHeight, dw = vw * dpr, dh = vh * dpr;
    P = Math.max(2, Math.floor(Math.min(dw / 165, dh / 240)));
    W = Math.ceil(dw / P); H = Math.ceil(dh / P);
    [cv, skyC, scnC].forEach(function (c) { c.width = W; c.height = H; });
    cssW = W * P / dpr; cssH = H * P / dpr; cssLeft = (vw - cssW) / 2;
    cv.style.width = cssW + "px"; cv.style.height = cssH + "px"; cv.style.left = cssLeft + "px";

    var g = G;
    var tall = H / W > 1.6;
    g.streetH = tall ? Math.round(H * 0.25) : clamp(Math.round(H * 0.19), 34, 80);
    g.gy = H - g.streetH;
    g.roadH = clamp(Math.round(g.streetH * 0.16), 6, 12);
    g.swTop = H - g.roadH - 2 - 6;
    g.gw = tall ? Math.round(W * 0.6) : clamp(Math.round(Math.min(W * 0.5, H * 0.36)), 76, 116);
    g.gh = Math.round(g.gw * (tall ? 0.62 : 0.58));
    g.storyH = Math.round(g.gw * (tall ? 0.52 : 0.44));
    g.tall = tall;
    g.leftW = Math.round(g.gw * 1.3);
    var total = g.leftW + g.gw + 16;
    g.wingR = Math.min(W - 3, Math.round(W / 2 + total / 2));
    g.wingL = g.wingR - g.gw - 16;
    g.gx = g.wingL + 8;
    g.hx0 = g.wingL - g.leftW;
    g.gTop = g.gy - g.gh;
    g.yE = g.gTop - 7 - g.storyH;
    g.peakY = g.yE - Math.round((g.gw + 24) / 2 * 0.62);
    g.yL = g.yE + 5;
    g.yR = g.yL - Math.round(g.storyH * 0.55);
    // interior perspective
    g.vx = g.gx + g.gw / 2; g.vy = g.gTop + Math.round(g.gh * 0.42); g.s = 0.62;
    g.L = Math.round(g.vx - g.gw / 2 * g.s); g.R = Math.round(g.vx + g.gw / 2 * g.s);
    g.T = Math.round(g.vy - (g.vy - g.gTop) * g.s); g.Bt = Math.round(g.vy + (g.gy - g.vy) * g.s);
    g.bulbY = g.gTop + Math.round(g.gh * 0.2);
    // front door
    g.dx = tall ? g.wingL - 20 : g.wingL - Math.round(g.leftW * 0.4);
    // crate (3/4 view): bottom-left of the front face
    g.fw = 50; g.fh = 22; g.sd = 7; g.su = 4;
    g.cx = Math.round(g.vx - g.fw / 2 - 5); g.cy = g.gy - 3;

    night = isNight();
    placeLink();
    render();
    initDynamic();
  }

  function placeLink() {
    var g = G, k = P / dpr, bottom = window.innerHeight - cssH;
    var x = g.cx - 3, y = g.cy - g.fh - g.su - 3, w = g.fw + g.sd + 6, h = g.fh + g.su + 7;
    var L = cssLeft + x * k, T = bottom + y * k, Wd = w * k, Ht = h * k, pad = Math.max(0, (48 - Math.min(Wd, Ht)) / 2);
    link.style.left = (L - pad) + "px"; link.style.top = (T - pad) + "px";
    link.style.width = (Wd + pad * 2) + "px"; link.style.height = (Ht + pad * 2) + "px";
  }

  // ---------- static scene ----------
  function render() {
    var N = W * H;
    A = new Float32Array(N * 3); Z = new Uint8Array(N); SPILL = new Uint8Array(N);
    R = rng(11 + W * 7 + H * 3);
    wins = []; lights = [];
    drawSky();
    drawMountains();
    drawTrees();
    drawHouse();
    drawGround();
    drawGarage();
    drawPorch();
    if (night) {
      var g = G, sp = Math.round((g.swTop - g.gy) * 0.4);
      poly([[g.gx, g.gy], [g.gx + g.gw, g.gy], [g.gx + g.gw + sp, g.swTop + 6], [g.gx - sp, g.swTop + 6]], function (x, y) {
        if (x >= 0 && y >= 0 && x < W && y < H) SPILL[y * W + x] = 1;
      });
      lights.push({ x: g.vx, y: g.bulbY + 2, r: g.gw * 1.15, i: 1.2, c: [1, 0.78, 0.5], kind: "bulb" });
      lights.push({ x: g.dx - 10, y: g.gy - 20, r: 26, i: 0.85, c: [1, 0.8, 0.55], kind: "porch" });
    }
    shade();
  }

  function drawSky() {
    var st = night ? K.skyNight : K.skyDay, end = G.yR + 10;
    var img = skyX.createImageData(W, H), d = img.data;
    for (var y = 0; y < H; y++) {
      var t = clamp(y / end, 0, 1) * (st.length - 1), i = Math.floor(t), f = t - i;
      for (var x = 0; x < W; x++) {
        var c = (f > bay(x, y) && i + 1 < st.length) ? st[i + 1] : st[i], o = (y * W + x) * 4;
        d[o] = c[0]; d[o + 1] = c[1]; d[o + 2] = c[2]; d[o + 3] = 255;
      }
    }
    skyX.putImageData(img, 0, 0);
    if (night) { // crescent moon with a faint halo
      var mx = Math.round(W * 0.78), my = Math.round(Math.min(28, G.yR * 0.22));
      for (var yy = -11; yy <= 11; yy++) for (var xx = -11; xx <= 11; xx++) {
        var dd = Math.sqrt(xx * xx + yy * yy);
        if (dd < 11 && dd > 6 && (11 - dd) / 5 * 0.3 > bay(mx + xx, my + yy)) { skyX.fillStyle = css(mix(st[1], st[3], 0.55)); skyX.fillRect(mx + xx, my + yy, 1, 1); }
        if (dd <= 5.2 && Math.sqrt((xx + 2.5) * (xx + 2.5) + (yy + 1.5) * (yy + 1.5)) > 4.6) { skyX.fillStyle = css(K.moon); skyX.fillRect(mx + xx, my + yy, 1, 1); }
      }
    }
  }

  function ridgeY(x) {
    var g = G, top = Math.round(g.yR - (g.gy - g.yR) * (g.tall ? 0.46 : 0.42)), u = x / W;
    var bump = Math.exp(-((u - 0.3) * (u - 0.3)) / 0.09);
    return top + (1 - bump) * (g.gy - top) * 0.32 + Math.sin(x * 0.21) * 1.2 + Math.sin(x * 0.07) * 2;
  }
  function drawMountains() {
    zone = 3;
    var g = G, ridge = night ? K.ridgeNight : K.ridgeDay;
    for (var x = 0; x < W; x++) { var ry = Math.round(ridgeY(x)); rect(x, ry, 1, g.gy - ry, ridge); }
    // the Flatirons: tilted sandstone slabs on the near face
    var slabs = [[0.17, 13, 9], [0.27, 16, 12], [0.36, 12, 8]];
    slabs.forEach(function (s, k) {
      var ax = Math.round(W * s[0]), ay = Math.round(ridgeY(ax) + 3 + k % 2), w = s[1], h = s[2] + Math.round((g.gy - ay) * 0.1);
      var face = night ? K.slabNight : K.slabDay, hi = night ? K.slabNightHi : K.slabDayHi, lo = night ? K.slabNight : K.slabDayLo;
      poly([[ax, ay], [ax + w * 0.3, ay + h], [ax - w * 0.7, ay + h]], function (x, y) {
        var c = face;
        var t = (y - ay) / h, edgeL = ax - w * 0.7 * t;
        if (x - edgeL < 1.5) c = hi;
        else if (((x + y * 0.6) | 0) % 7 === 0 && !night) c = lo; // bedding lines
        put(x, y, c);
      });
    });
    // pine band at the foot
    var pine = night ? K.pineNight : K.pineDay;
    for (var x2 = 0; x2 < W; x2++) {
      var top = Math.round(ridgeY(x2) + (g.gy - ridgeY(x2)) * 0.55 + Math.sin(x2 * 0.9) * 1.5 + (x2 % 5 === 0 ? -2 : 0));
      rect(x2, top, 1, g.gy - top, pine);
    }
  }

  function tree(cx, baseY, r) {
    zone = 1;
    rect(cx - 2, baseY - r * 1.6, 4, r * 1.6, K.trunk);
    rect(cx - 1, baseY - r * 1.6, 1, r * 1.6, dk(K.trunk, 0.8));
    [[0, -2.1, 1], [-0.6, -1.7, 0.75], [0.65, -1.75, 0.75], [-0.2, -2.6, 0.7], [0.4, -2.45, 0.65]].forEach(function (b) {
      blob(cx + b[0] * r, baseY + b[1] * r, r * b[2], r * b[2] * 0.85, function (x, y, d) {
        var c = K.leaf;
        if (y < baseY + b[1] * r - r * b[2] * 0.35 && d < 0.75 && bay(x, y) > 0.35) c = K.leafHi;
        if (d > 0.7 && y > baseY + b[1] * r && bay(x, y) > 0.5) c = K.leafLo;
        put(x, y, c);
      });
    });
  }
  function drawTrees() {
    var g = G;
    if (g.hx0 > 46) tree(Math.round(g.hx0 - 34), g.gy + 4, Math.round(g.gw * 0.22));
    if (W - g.wingR > 50) tree(Math.round(g.wingR + 36), g.gy + 2, Math.round(g.gw * 0.17));
  }

  function siding(x0, x1, y0, y1) {
    for (var y = y0; y < y1; y++) for (var x = x0; x < x1; x++) put(x, y, (y - y0) % 4 === 3 ? K.lap : K.siding);
  }

  function drawWindow(x, y, w, h, lit, opts) {
    opts = opts || {};
    zone = 1;
    rect(x - 2, y - 2, w + 4, h + 4, K.trim);
    rect(x - 3, y - 3, w + 6, 1, K.trim);
    rect(x - 3, y + h + 2, w + 6, 2, K.trim); rect(x - 3, y + h + 4, w + 6, 1, K.trimSh);
    var win = { x: x, y: y, w: w, h: h, lit: lit, panes: opts.panes || 2 };
    wins.push(win);
    glass(win);
    return win;
  }
  function glass(win) {
    var x = win.x, y = win.y, w = win.w, h = win.h;
    zone = 4;
    for (var j = 0; j < h; j++) for (var i = 0; i < w; i++) {
      var c;
      if (night) {
        if (win.lit) { c = mix(K.warmHi, K.warmLo, j / h); if (i < 2 || i >= w - 2) c = K.curtain; }
        else c = K.glassNight;
      } else {
        c = mix(K.glassDay, K.glassDayLo, j / h);
        var dg = i + j * 0.7;
        if (Math.abs(dg - w * 0.55) < 1.1 || Math.abs(dg - w * 0.8) < 0.6) c = mix(c, [235, 245, 252], 0.6);
      }
      put(x + i, y + j, c);
    }
    zone = 1;
    var pn = win.panes;
    for (var p = 1; p < pn; p++) rect(x + Math.round(w * p / pn), y, 1, h, K.trim);
    rect(x, y + Math.round(h * 0.48), w, 1, K.trim);
  }

  function drawHouse() {
    var g = G;
    // side-gabled roof over the left part
    zone = 1;
    for (var y = g.yR; y < g.yL; y++) for (var x = g.hx0 - 4; x < g.wingL; x++) {
      var r = y - g.yR, c = K.roof;
      if (r % 3 === 2) c = K.roofLn; else if ((x + ((r / 3 | 0) % 2) * 3) % 7 === 0) c = K.roofLn;
      if (r === 0) c = K.roofHi;
      put(x, y, c);
    }
    // chimney
    var chx = Math.round(g.hx0 + g.leftW * 0.28);
    if (chx > 2) {
      rect(chx, g.yR - 12, 10, 14, K.brick);
      for (var by = g.yR - 10; by < g.yR + 2; by += 3) rect(chx, by, 10, 1, dk(K.brick, 0.82));
      rect(chx - 1, g.yR - 13, 12, 2, dk(K.brick, 0.75));
      G.chimney = { x: chx, y: g.yR - 13 };
    }
    // left part walls
    siding(g.hx0, g.wingL, g.yL, g.gy);
    rect(g.hx0 - 4, g.yL, g.wingL - g.hx0 + 4, 2, K.trim);
    rect(g.hx0, g.yL + 2, g.wingL - g.hx0, 2, dk(K.siding, 0.8)); // eave shadow
    rect(g.hx0, g.yL, 2, g.gy - g.yL, K.trim);
    // wing (garage) wall + front gable
    siding(g.wingL, g.wingR, g.yE, g.gy);
    var cx = (g.wingL + g.wingR) / 2, half = (g.wingR - g.wingL) / 2 + 4, slope = (g.yE - g.peakY) / half;
    poly([[g.wingL, g.yE + 0.5], [cx, g.peakY + 3], [g.wingR, g.yE + 0.5]], function (x, y) { put(x, y, (y - g.peakY) % 4 === 3 ? K.lap : K.siding); });
    for (var x2 = Math.round(cx - half); x2 <= Math.round(cx + half); x2++) {
      var ry = Math.round(g.peakY + Math.abs(x2 + 0.5 - cx) * slope);
      rect(x2, ry - 3, 1, 3, K.roof); put(x2, ry - 4, K.roofHi);
      rect(x2, ry, 1, 2, K.trim); put(x2, ry + 2, dk(K.siding, 0.8));
    }
    // gable vent
    var vy = Math.round(g.peakY + (g.yE - g.peakY) * 0.45);
    rect(cx - 5, vy, 10, 7, K.trim);
    for (var lv = 0; lv < 3; lv++) rect(cx - 4, vy + 1 + lv * 2, 8, 1, K.trimSh);
    rect(g.wingL, g.yE, 2, g.gy - g.yE, K.trim); rect(g.wingR - 2, g.yE, 2, g.gy - g.yE, K.trim);
    // windows above the garage
    var ww = Math.round(g.gw * 0.22), wh = Math.round(g.storyH * 0.62), wy = g.yE + Math.round((g.storyH - wh) / 2) + 2;
    G.catWins = [];
    G.catWins.push(drawWindow(Math.round(cx - ww - 4), wy, ww, wh, true));
    G.catWins.push(drawWindow(Math.round(cx + 4), wy, ww, wh, false));
    // left part windows
    var lw = Math.round(g.gw * 0.2);
    var up1 = Math.round(g.hx0 + g.leftW * 0.22 - lw / 2), up2 = Math.round(g.hx0 + g.leftW * 0.62 - lw / 2);
    G.catWins.push(drawWindow(up1, wy + 4, lw, wh - 4, false));
    drawWindow(up2, wy + 4, lw, wh - 4, true);
    var pw = Math.round(g.gw * 0.36), ph = Math.round(g.gh * 0.45);
    var px = Math.round(g.hx0 + g.leftW * 0.2 - pw / 2);
    if (px > -pw + 6) drawWindow(px, g.gy - ph - 14, pw, ph, false, { panes: 3 });
  }

  function drawGround() {
    var g = G;
    zone = 5;
    // lawn with soft mowing stripes
    for (var y = g.gy; y < g.swTop; y++) for (var x = 0; x < W; x++) {
      var band = Math.floor((x + (y - g.gy) * 0.8) / 10) % 2, c = band ? K.grass : K.grassLo;
      if (R() < 0.05) c = K.grassHi;
      put(x, y, c);
    }
    // driveway
    var dTop0 = g.gx - 1, dTop1 = g.gx + g.gw + 1, spread = Math.round((g.swTop - g.gy) * 0.28);
    poly([[dTop0, g.gy], [dTop1, g.gy], [dTop1 + spread, g.swTop], [dTop0 - spread, g.swTop]], function (x, y) {
      var t = (y - g.gy) / (g.swTop - g.gy), l = dTop0 - spread * t, r = dTop1 + spread * t;
      var c = K.drive;
      if (Math.abs(x + 0.5 - (l + r) / 2) < 0.6) c = K.driveLn;
      if (y === Math.round(g.gy + (g.swTop - g.gy) * 0.5)) c = K.driveLn;
      if (x - l < 1 || r - x < 1) c = K.driveLn;
      put(x, y, c);
    });
    // front walk from the porch to the sidewalk
    for (var y2 = g.gy + 2; y2 < g.swTop; y2++) for (var x2 = g.dx - 5; x2 < g.dx + 5; x2++)
      put(x2, y2, ((y2 - g.gy) % 5 === 4 || x2 === g.dx) ? dk(K.paver, 0.88) : K.paver);
    // sidewalk, curb, road
    for (var y3 = g.swTop; y3 < g.swTop + 6; y3++) for (var x3 = 0; x3 < W; x3++) put(x3, y3, (x3 + 5) % 16 === 0 ? K.walkLn : K.walk);
    rect(0, g.swTop + 6, W, 1, K.curb); rect(0, g.swTop + 7, W, 1, dk(K.curb, 0.75));
    rect(0, g.swTop + 8, W, H - g.swTop - 8, K.road);
    for (var k = 0; k < W * (H - g.swTop - 8) / 40; k++) put(R() * W, g.swTop + 8 + R() * (H - g.swTop - 8), dk(K.road, 1.12));
    // shrubs along the left part (avoid the door and walk)
    zone = 1;
    for (var sx = g.hx0 + 4; sx < g.wingL - 6; sx += 9) {
      if (Math.abs(sx + 4 - g.dx) < 14) continue;
      blob(sx + 4, g.gy - 2, 6, 5, function (x, y, d) { put(x, y, (d < 0.5 && y < g.gy - 3 && bay(x, y) > 0.4) ? K.shrubHi : K.shrub); });
    }
  }

  function drawPorch() {
    var g = G, dx = g.dx, top = g.gy - 26;
    zone = 1;
    rect(dx - 8, top - 2, 16, 28, K.trim);
    rect(dx - 6, top, 12, 26, K.door);
    rect(dx - 5, top + 3, 4, 8, dk(K.door, 0.82)); rect(dx + 1, top + 3, 4, 8, dk(K.door, 0.82));
    rect(dx - 5, top + 14, 4, 9, dk(K.door, 0.82)); rect(dx + 1, top + 14, 4, 9, dk(K.door, 0.82));
    put(dx + 3, top + 13, K.brass);
    // little gabled porch roof on two posts
    var pr = 15;
    rect(dx - pr + 2, top - 3, 2, 29, K.trim); rect(dx + pr - 4, top - 3, 2, 29, K.trim);
    for (var x = dx - pr; x <= dx + pr; x++) {
      var ry = Math.round(top - 10 + Math.abs(x - dx) * 0.45);
      rect(x, ry, 1, top - 4 - ry, K.roof); put(x, ry, K.roofHi);
      put(x, top - 4, K.trim); put(x, top - 3, K.trimSh);
    }
    // step
    zone = 5; rect(dx - 10, g.gy, 20, 2, K.walk); rect(dx - 10, g.gy + 2, 20, 1, K.walkLn);
    // porch light
    zone = 1; rect(dx - 11, g.gy - 23, 3, 1, [40, 40, 44]); rect(dx - 12, g.gy - 22, 5, 5, [40, 40, 44]);
    zone = 4; rect(dx - 11, g.gy - 21, 3, 3, night ? K.bulbOn : [200, 196, 182]);
  }

  function drawGarage() {
    var g = G, L = g.L, Rr = g.R, T = g.T, Bt = g.Bt, s = g.s;
    // trim around the opening
    zone = 1;
    rect(g.gx - 3, g.gTop - 4, g.gw + 6, 4, K.trim);
    rect(g.gx - 3, g.gTop, 3, g.gh, K.trim); rect(g.gx + g.gw, g.gTop, 3, g.gh, K.trim);
    rect(g.gx - 3, g.gTop, 1, g.gh, K.trimSh);
    zone = 2;
    for (var y = g.gTop; y < g.gy; y++) for (var x = g.gx; x < g.gx + g.gw; x++) {
      var c, depth;
      if (x >= L && x < Rr && y >= T && y < Bt) { c = K.backIn; depth = 1; }
      else {
        var hx2 = Math.abs(x + 0.5 - g.vx) / (g.gw / 2);
        var ht = y + 0.5 < g.vy ? (g.vy - y - 0.5) / (g.vy - g.gTop) : (y + 0.5 - g.vy) / (g.gy - g.vy);
        var k = Math.max(hx2, ht);
        depth = clamp((1 / k - 1) / (1 / s - 1), 0, 1);
        if (hx2 >= ht) c = K.wallIn;
        else if (y + 0.5 < g.vy) {
          c = K.ceil;
          // overhead door tracks running back from the opening
          var tu = (x + 0.5 - g.vx) / k / (g.gw / 2);
          if (Math.abs(Math.abs(tu) - 0.9) < 0.05 / k) c = K.track;
        } else {
          c = K.floorIn;
          if (Math.abs((x + 0.5 - g.vx) / k) < g.gw * 0.18 && depth > 0.2 && depth < 0.6 && bay(x, y) > 0.55) c = K.floorSt; // old oil stain
        }
      }
      put(x, y, dk(c, 1 - depth * 0.28));
    }
    // raised door panel tucked under the ceiling, just inside the opening
    var pTop = g.gTop, pH = Math.max(4, Math.round(g.gh * 0.08));
    for (var py = 0; py < pH; py++) rect(g.gx + 2 + py, pTop + py, g.gw - 4 - py * 2, 1, py === pH - 1 ? K.panelLn : K.panel);
    // back wall: door into the house (left), shelving, stacked crates (right)
    var dW = Math.round((Rr - L) * 0.18), dH = Math.round((Bt - T) * 0.78);
    rect(L + 3, Bt - dH, dW, dH, dk(K.trim, 0.86)); rect(L + 4, Bt - dH + 1, dW - 2, dH - 1, dk(K.backIn, 0.92));
    put(L + 3 + dW - 3, Bt - Math.round(dH * 0.48), K.brass);
    // metal shelf on the left wall, with bins and boxes in the gloom
    var sx0 = L - 6, sh = [Bt - Math.round((Bt - T) * 0.9), Bt - Math.round((Bt - T) * 0.55), Bt - Math.round((Bt - T) * 0.2)];
    sh.forEach(function (yy, i) {
      rect(sx0 - 6, yy, 12, 1, K.shelf);
      var bc = K.bins[(i * 2) % K.bins.length], bh = 4 + (i % 2) * 2;
      rect(sx0 - 5, yy - bh, 5, bh, dk(bc, 0.9)); rect(sx0 + 1, yy - 3, 4, 3, dk(K.bins[(i * 2 + 1) % K.bins.length], 0.85));
    });
    rect(sx0 - 6, sh[0], 1, Bt - sh[0], K.shelf); rect(sx0 + 5, sh[0], 1, Bt - sh[0], K.shelf);
    // other crates waiting at the back, unlabeled
    var c1x = Rr - 22, ch = Math.round(g.fh * s);
    crateSmall(c1x, Bt - 1, 20, ch, false);
    crateSmall(c1x + 3, Bt - 1 - ch, 15, ch - 1, true);
    crateSmall(c1x - 13, Bt - 1, 11, Math.round(ch * 0.8), false);
    // bare bulb on a cord
    rect(g.vx, g.gTop + pH, 1, g.bulbY - g.gTop - pH, K.cord);
    rect(g.vx - 1, g.bulbY - 1, 3, 1, [90, 88, 84]);
    zone = 4; rect(g.vx - 1, g.bulbY, 3, 3, night ? K.bulbOn : K.bulbOff); put(g.vx, g.bulbY + 3, night ? K.bulbOn : K.bulbOff);
    zone = 2; rect(g.vx + 2, g.bulbY - 1, 1, 6, K.cord); // pull chain
    G.crateTop = { x: c1x + 4, y: Bt - 1 - ch * 2 + 1 };
  }
  function crateSmall(x, bottom, w, h, label) {
    zone = 2;
    rect(x, bottom - h, w, h, K.slatLo);
    for (var y = bottom - h + 2; y < bottom; y += 3) rect(x, y, w, 1, K.gap);
    rect(x, bottom - h, 1, h, K.post); rect(x + w - 1, bottom - h, 1, h, K.post);
    if (label) rect(x + 3, bottom - h + 2, 6, 3, mix(K.sticker, K.slatLo, 0.45));
  }

  // ---------- lighting ----------
  var AMB_N = { 1: [0.4, 0.44, 0.64], 2: [0.24, 0.23, 0.25], 5: [0.36, 0.4, 0.6] };
  var AMB_D = { 1: [1, 1, 1], 2: [0.66, 0.66, 0.68], 5: [1, 1, 1] };
  function shade() {
    var img = scnX.createImageData(W, H), d = img.data, AMB = night ? AMB_N : AMB_D;
    for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) {
      var i = y * W + x, z = Z[i], o = i * 4;
      if (z === 0) { d[o + 3] = 0; continue; }
      var r = A[i * 3], g2 = A[i * 3 + 1], b = A[i * 3 + 2];
      if (z === 3 || z === 4) { d[o] = r; d[o + 1] = g2; d[o + 2] = b; d[o + 3] = 255; continue; }
      var am = AMB[z], lr = am[0], lg = am[1], lb = am[2], bt = bay(x, y);
      for (var k = 0; k < lights.length; k++) {
        var Lt = lights[k], w = 0;
        if (Lt.kind === "bulb") w = z === 2 ? 1 : (SPILL[i] ? 0.85 : 0);
        else w = z !== 2 ? 1 : 0;
        if (!w) continue;
        var dx = x + 0.5 - Lt.x, dy = (y + 0.5 - Lt.y) * (Lt.kind === "bulb" && z === 5 ? 0.55 : 1);
        var f = 1 - Math.sqrt(dx * dx + dy * dy) / Lt.r;
        if (f <= 0) continue;
        var q = Math.min(1.3, Math.floor(Math.pow(f, 1.3) * Lt.i * w * 6 + bt) / 6);
        lr += Lt.c[0] * q; lg += Lt.c[1] * q; lb += Lt.c[2] * q;
      }
      d[o] = Math.min(255, r * lr); d[o + 1] = Math.min(255, g2 * lg); d[o + 2] = Math.min(255, b * lb); d[o + 3] = 255;
    }
    scnX.putImageData(img, 0, 0);
  }

  // ---------- dynamic ----------
  var stars = [], clouds = [];
  function initDynamic() {
    stars = []; clouds = [];
    var r = rng(5 + W);
    if (night) {
      var n = Math.floor(W * G.yR / 260);
      for (var i = 0; i < n; i++) stars.push({ x: r() * W | 0, y: r() * G.yR * 0.7 | 0, p: r() * 6.28 });
    } else {
      for (var c = 0; c < 3; c++) clouds.push(makeCloud(r, r() * W, 8 + r() * G.yR * 0.45, 0.5 + r() * 0.4));
    }
  }
  function makeCloud(r, x, y, v) {
    var w = 18 + r() * 22 | 0, parts = [];
    for (var k = 0; k < 4; k++) parts.push([r() * (w - 10) | 0, -(r() * 4 | 0), 6 + r() * 6 | 0]);
    return { x: x, y: y | 0, w: w, v: v, parts: parts };
  }
  function drawClouds(dt) {
    clouds.forEach(function (c) {
      if (!RM) c.x += c.v * dt;
      if (c.x > W + 10) c.x = -c.w - 10;
      var x = Math.round(c.x);
      ctx.fillStyle = "rgba(236,243,249,0.92)";
      ctx.fillRect(x, c.y, c.w, 3);
      c.parts.forEach(function (p) { ctx.fillRect(x + p[0], c.y + p[1] - 2, p[2], 3 - p[1]); ctx.fillRect(x + p[0] + 1, c.y + p[1] - 3, p[2] - 2, 1); });
      ctx.fillStyle = "rgba(200,216,232,0.9)"; ctx.fillRect(x + 1, c.y + 3, c.w - 2, 1);
    });
  }
  function drawStars(t) {
    stars.forEach(function (s) {
      var a = RM ? 0.6 : 0.35 + 0.45 * (0.5 + 0.5 * Math.sin(t * 0.5 + s.p));
      ctx.fillStyle = css(K.star, a); ctx.fillRect(s.x, s.y, 1, 1);
    });
  }

  // ---------- the cat ----------
  var WALK = [
    ["k.k........", "kkk......k.", "ekk.....k..", "kkkkkkkkk..", ".kkkkkkk...", ".k.k..k.k..", ".k.k..k.k.."],
    ["k.k........", "kkk.......k", "ekk......k.", "kkkkkkkkk..", ".kkkkkkk...", "..kk..kk...", "..k....k..."]
  ];
  var SIT = [
    [".k..k...", ".kkkk...", ".ekke...", ".kkkk...", "..kk....", ".kkkk...", ".kkkkk..", ".kkkkkkk", ".kk.k..k"],
    [".k..k...", ".kkkk...", ".kkkk...", ".kkkk...", "..kk....", ".kkkk...", ".kkkkk..", ".kkkkkk.", ".kk.k.kk"]
  ];
  var cat = { mode: "idle", wait: RM ? 1e9 : 2.5, t: 0, next: 0 };
  var PLAN = ["drive", "window", "roof", "drive", "window"];
  function startCat() {
    var g = G, m = PLAN[cat.next++ % PLAN.length];
    cat.mode = m; cat.t = 0; cat.sat = false; cat.sitT = 0;
    if (m === "drive") {
      cat.dir = -1; cat.y = Math.round(g.gy + (g.swTop - g.gy) * 0.55); cat.x = W + 2;
      cat.sitAt = g.gx + g.gw * 0.4; cat.sitFor = 5;
    } else if (m === "roof") {
      if (g.yR < 12) { cat.mode = "idle"; cat.wait = 3; return; }
      cat.dir = 1; cat.y = g.yR - 7; cat.x = Math.max(-12, g.hx0 - 12);
      cat.sitAt = clamp(G.chimney ? G.chimney.x + 16 : g.hx0 + g.leftW * 0.45, 8, g.wingL - 22); cat.sitFor = 7; cat.end = g.wingL - 14;
    } else {
      var ws = G.catWins.filter(function (w) { return night ? w.lit : true; });
      cat.win = ws[(Math.random() * ws.length) | 0] || G.catWins[0];
      cat.sitFor = 12;
    }
  }
  function updateCat(dt) {
    if (cat.mode === "idle") { cat.wait -= dt; if (cat.wait <= 0) startCat(); return; }
    cat.t += dt;
    if (cat.mode === "window") { if (cat.t > cat.sitFor) endCat(); return; }
    if (cat.sitting) { cat.sitT -= dt; if (cat.sitT <= 0) { cat.sitting = false; if (cat.mode === "roof") cat.dir = -1; } return; }
    cat.x += cat.dir * 8 * dt;
    if (!cat.sat && ((cat.dir < 0 && cat.x <= cat.sitAt) || (cat.dir > 0 && cat.x >= cat.sitAt))) { cat.sat = true; cat.sitting = true; cat.sitT = cat.sitFor; }
    if (cat.mode === "roof" && cat.dir > 0 && cat.x > cat.end) cat.dir = -1;
    if (cat.x < -14 || cat.x > W + 4 || (cat.mode === "roof" && cat.dir < 0 && cat.x < Math.max(-14, G.hx0 - 14))) endCat();
  }
  function endCat() { cat.mode = "idle"; cat.sitting = false; cat.wait = 14 + Math.random() * 16; }
  function sprite(rows, x, y, flip) {
    for (var r = 0; r < rows.length; r++) for (var i = 0; i < rows[r].length; i++) {
      var ch = rows[r][i]; if (ch === ".") continue;
      ctx.fillStyle = ch === "e" ? css(night ? K.eye : dk(K.eye, 0.7)) : css(K.cat);
      ctx.fillRect(flip ? x + rows[r].length - 1 - i : x + i, y + r, 1, 1);
    }
  }
  function drawCat(t) {
    if (cat.mode === "idle") return;
    var blink = (t % 3.7) < 0.15;
    if (cat.mode === "window") {
      var w = cat.win;
      ctx.save(); ctx.beginPath(); ctx.rect(w.x, w.y, w.w, w.h); ctx.clip();
      var rise = Math.min(1, cat.t / 0.8), fall = Math.max(0, (cat.t - cat.sitFor + 0.8) / 0.8);
      sprite(SIT[blink ? 1 : 0], w.x + 2, w.y + w.h - 9 + Math.round((1 - rise + fall) * 9), false);
      ctx.restore(); return;
    }
    var x = Math.round(cat.x);
    if (!night) { ctx.fillStyle = "rgba(0,0,0,0.18)"; ctx.fillRect(x + 1, cat.y + 7, 9, 1); }
    if (cat.sitting) sprite(SIT[blink ? 1 : 0], x + 1, cat.y - 2, cat.dir > 0);
    else sprite(WALK[Math.floor(cat.t * 5) % 2], x, cat.y, cat.dir > 0);
  }

  // ---------- the crate ----------
  var hover = false, pressed = -1;
  function drawCrate() {
    var g = G, fw = g.fw, fh = g.fh, sd = g.sd, su = g.su;
    var dip = pressed >= 0 ? 1 : (hover ? -1 : 0);
    var x = g.cx, y = g.cy + dip, top = y - fh + 1;
    var lit = night ? 1 : 0.94;
    function c(col) { return css(dk(col, lit)); }
    ctx.fillStyle = "rgba(20,14,10,0.35)"; ctx.fillRect(x - 1, g.cy + 1, fw + sd, 1);
    // side
    for (var i = 0; i < sd; i++) {
      var o = Math.round((i + 1) * su / sd);
      ctx.fillStyle = c(K.crateSide); ctx.fillRect(x + fw + i, top - o, 1, fh - 1);
      for (var sy = top - o + 5; sy < top - o + fh - 1; sy += 6) { ctx.fillStyle = c(dk(K.crateSide, 0.7)); ctx.fillRect(x + fw + i, sy, 1, 1); }
    }
    // top
    for (var r = 1; r <= su; r++) {
      var off = Math.round(r * sd / su);
      ctx.fillStyle = c(r % 2 ? K.crateTop : dk(K.crateTop, 0.9)); ctx.fillRect(x + off - 1, top - r, fw, 1);
    }
    // front slats
    ctx.fillStyle = c(K.slat); ctx.fillRect(x, top, fw, fh);
    for (var sy2 = top + 5; sy2 < top + fh - 1; sy2 += 6) { ctx.fillStyle = c(K.gap); ctx.fillRect(x, sy2, fw, 1); }
    ctx.fillStyle = c(K.post); ctx.fillRect(x, top, 3, fh); ctx.fillRect(x + fw - 3, top, 3, fh);
    ctx.fillStyle = c(dk(K.post, 0.8)); ctx.fillRect(x + 2, top, 1, fh); ctx.fillRect(x + fw - 1, top, 1, fh);
    ctx.fillStyle = c(mix(K.slat, [255, 240, 210], 0.3)); ctx.fillRect(x, top, fw, 1);
    // nails
    ctx.fillStyle = c([90, 80, 70]);
    [top + 2, top + 8, top + 14, top + 19].forEach(function (ny) { ctx.fillRect(x + 1, ny, 1, 1); ctx.fillRect(x + fw - 2, ny, 1, 1); });
    // the sticker
    var sw = 45, sh = 9, sx = x + Math.round((fw - sw) / 2), syy = top + Math.round((fh - sh) / 2);
    ctx.fillStyle = c(hover ? mix(K.sticker, [255, 255, 255], 0.5) : K.sticker); ctx.fillRect(sx, syy, sw, sh);
    ctx.fillStyle = c(K.stickerLn); ctx.fillRect(sx, syy + sh - 1, sw, 1); ctx.fillRect(sx + sw - 1, syy, 1, sh);
    ctx.fillStyle = c(K.amber); ctx.fillRect(sx, syy, 2, sh);
    var str = "turnaround";
    ctx.fillStyle = c(K.ink);
    for (var k = 0; k < str.length; k++) {
      var gl = GLYPH[str[k]];
      for (var rr = 0; rr < 5; rr++) for (var cc = 0; cc < 3; cc++) if (gl[rr][cc] === "#") ctx.fillRect(sx + 4 + k * 4 + cc, syy + 2 + rr, 1, 1);
    }
  }

  // ---------- loop ----------
  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.1, (now - last) / 1000); last = now;
    var t = now / 1000;
    updateCat(dt);
    ctx.drawImage(skyC, 0, 0);
    if (night) drawStars(t); else drawClouds(dt);
    ctx.drawImage(scnC, 0, 0);
    drawCat(t);
    drawCrate();
    if (pressed >= 0) {
      pressed += dt;
      if (pressed > 0.14 && !G.navigated) { G.navigated = true; location.href = link.getAttribute("href"); }
    }
    requestAnimationFrame(frame);
  }

  // ---------- interaction ----------
  link.addEventListener("mouseenter", function () { hover = true; });
  link.addEventListener("mouseleave", function () { hover = false; });
  link.addEventListener("focus", function () { hover = true; });
  link.addEventListener("blur", function () { hover = false; });
  link.addEventListener("click", function (e) {
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.button || RM) return;
    e.preventDefault();
    if (pressed < 0) pressed = 0;
  });
  window.addEventListener("pageshow", function () { pressed = -1; G.navigated = false; hover = false; });

  cv.addEventListener("click", function (e) {
    var rc = cv.getBoundingClientRect();
    var x = (e.clientX - rc.left) / rc.width * W, y = (e.clientY - rc.top) / rc.height * H;
    // the cat stops and looks at you
    if ((cat.mode === "drive" || cat.mode === "roof") && Math.abs(x - cat.x - 5) < 9 && Math.abs(y - cat.y - 3) < 8 && !cat.sitting) {
      cat.sitting = true; cat.sitT = 3; return;
    }
    // at night, windows can be switched on and off
    if (!night) return;
    for (var i = 0; i < wins.length; i++) {
      var w = wins[i];
      if (x >= w.x - 2 && x < w.x + w.w + 2 && y >= w.y - 2 && y < w.y + w.h + 2) {
        w.lit = !w.lit; glass(w); shade(); return;
      }
    }
  });

  var rt;
  window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(layout, 100); });
  setInterval(function () { if (isNight() !== night) layout(); }, 60000);
  layout();
  requestAnimationFrame(frame);
})();
</script>
</body>
