<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>garage</title>
<meta name="description" content="Jonathan Tari's garage.">
<meta name="theme-color" content="#131830">
<style>
  html, body { margin: 0; height: 100%; background: #131830; overflow: hidden; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
  canvas { position: fixed; bottom: 0; display: block; image-rendering: pixelated; image-rendering: crisp-edges; -webkit-tap-highlight-color: transparent; }
  #box { position: fixed; display: block; border-radius: 6px; -webkit-tap-highlight-color: transparent; }
  #box:focus-visible { outline: 2px solid #ffd99a; outline-offset: 3px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<h1 class="sr">Jonathan Tari's garage</h1>
<canvas id="c" aria-hidden="true"></canvas>
<a id="box" href="/turnaround/" aria-label="Turnaround"></a>
<script>
(function () {
  "use strict";
  var cv = document.getElementById("c"), ctx = cv.getContext("2d");
  var link = document.getElementById("box");
  var RM = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var stat = document.createElement("canvas"), sctx = stat.getContext("2d");

  // ---------- tiny utils ----------
  var BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  function bay(x, y) { return (BAY[((y & 3) << 2) | (x & 3)] + 0.5) / 16; }
  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function hx(s) { return [parseInt(s.substr(1, 2), 16), parseInt(s.substr(3, 2), 16), parseInt(s.substr(5, 2), 16)]; }
  function mix(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
  function dk(c, k) { return [c[0] * k, c[1] * k, c[2] * k]; }
  function css(c, a) { return "rgba(" + (c[0] | 0) + "," + (c[1] | 0) + "," + (c[2] | 0) + "," + (a == null ? 1 : a) + ")"; }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

  var K = {
    sky: ["#11152c", "#1a2144", "#27305c", "#3d3f72", "#5e5080", "#8a6585"].map(hx),
    star: hx("#fff3d6"), moon: hx("#f4e7c0"),
    far: hx("#1e2343"), farWin: hx("#9a6a4a"), spire: hx("#33585a"), spireHi: hx("#4c7d77"),
    cloud: hx("#353a6a"),
    ochre: hx("#d7a05a"), groove: hx("#b9843f"), cream: hx("#ecdfc4"), creamSh: hx("#b9a688"),
    slate: hx("#4d5168"), slateLn: hx("#393c50"), brick: hx("#8c4636"), pot: hx("#b0603e"),
    glassDark: hx("#1d2340"), glassRef: hx("#3a4572"), frame: hx("#e6ded0"),
    warmHi: hx("#ffe0a0"), warmLo: hx("#f0a24e"), curtain: hx("#c26a3c"),
    flowerBox: hx("#6e4630"), leaf: hx("#4c7a48"), red: hx("#d8414a"), pink: hx("#ef8fa0"),
    green: hx("#2f5c4c"), greenDk: hx("#244838"), greenHi: hx("#3f7461"), iron: hx("#1c1d24"),
    ceil: hx("#5c4230"), joist: hx("#3e2a1e"), wallIn: hx("#9a8670"), peg: hx("#8a6c4c"), pegHole: hx("#5e4630"),
    floorIn: hx("#7a7168"), floorLn: hx("#655d55"), backBrick: hx("#875c46"), mortar: hx("#6a4634"),
    wood: hx("#9a6a3e"), woodDk: hx("#6a4428"), metal: hx("#5a5d68"), shade: hx("#3d6656"),
    bulb: hx("#fff2c8"),
    walk: hx("#8a888e"), walkLn: hx("#6c6a72"), curb: hx("#a6a3aa"), gutter: hx("#3c3c48"),
    mortarSt: hx("#3a3842"), water: hx("#252840"),
    bikeFrame: hx("#202028"), chrome: hx("#b4b6c2"), tire: hx("#111116"), saddle: hx("#7a4628"), wicker: hx("#9a7444"),
    blue: hx("#7e98aa"), pinkWall: hx("#c48068"), tileRed: hx("#86463a"),
    cat: hx("#18151b"), eye: hx("#f2d14b"),
    cardFront: hx("#d39a58"), cardSide: hx("#a8733c"), cardTop: hx("#e8b878"), cardSeam: hx("#b78248"),
    tape: hx("#efd9a2"), marker: hx("#2a221e"), cardIn: hx("#4a3220")
  };
  var STONES = ["#5c5a64", "#64606a", "#56565f", "#605a58", "#5a5e66"].map(hx);

  // zones: 0 sky/unlit, 1 facade, 2 interior, 3 far bg (unlit), 4 emissive, 5 ground, 6 door leaves
  var P, W, H, dpr, cssW, cssH, cssLeft;
  var A, Z, WETM, SPILL, WARM, R;
  var zone = 1;
  var G = {}, wins = [], lights = [];

  function put(x, y, c) {
    x = x | 0; y = y | 0;
    if (x < 0 || y < 0 || x >= W || y >= H) return;
    var i = y * W + x; A[i * 3] = c[0]; A[i * 3 + 1] = c[1]; A[i * 3 + 2] = c[2]; Z[i] = zone;
  }
  function rect(x, y, w, h, c) {
    x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
    for (var j = 0; j < h; j++) for (var i = 0; i < w; i++) put(x + i, y + j, c);
  }
  function poly(pts, fn) {
    var minY = 1e9, maxY = -1e9, n = pts.length;
    for (var k = 0; k < n; k++) { minY = Math.min(minY, pts[k][1]); maxY = Math.max(maxY, pts[k][1]); }
    for (var y = Math.floor(minY); y <= Math.ceil(maxY); y++) {
      var sy = y + 0.5, xs = [];
      for (var e = 0; e < n; e++) {
        var a = pts[e], b = pts[(e + 1) % n];
        if ((a[1] <= sy && b[1] > sy) || (b[1] <= sy && a[1] > sy)) xs.push(a[0] + (sy - a[1]) * (b[0] - a[0]) / (b[1] - a[1]));
      }
      xs.sort(function (p, q) { return p - q; });
      for (var m = 0; m + 1 < xs.length; m += 2)
        for (var x = Math.round(xs[m]); x < Math.round(xs[m + 1]); x++) fn(x, y);
    }
  }
  function line(x0, y0, x1, y1, c) {
    x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
    var dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1, dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1, err = dx + dy;
    for (;;) {
      put(x0, y0, c);
      if (x0 === x1 && y0 === y1) break;
      var e2 = 2 * err;
      if (e2 >= dy) { err += dy; x0 += sx; }
      if (e2 <= dx) { err += dx; y0 += sy; }
    }
  }
  function ring(cx, cy, r, c) {
    for (var a = 0; a < 64; a++) { var t = a / 64 * 6.2832; put(Math.round(cx + Math.cos(t) * r), Math.round(cy + Math.sin(t) * r), c); }
  }

  var GLYPH = {
    t: [".#.", "###", ".#.", ".#.", "..#"],
    u: ["...", "#.#", "#.#", "#.#", ".##"],
    r: ["...", "#.#", "##.", "#..", "#.."],
    n: ["...", "##.", "#.#", "#.#", "#.#"],
    a: ["...", "##.", "..#", "###", "###"],
    o: ["...", ".#.", "#.#", "#.#", ".#."],
    d: ["..#", "..#", ".##", "#.#", ".##"]
  };

  // ---------- layout ----------
  function layout() {
    dpr = window.devicePixelRatio || 1;
    var vw = window.innerWidth, vh = window.innerHeight;
    var dw = vw * dpr, dh = vh * dpr;
    P = Math.max(2, Math.floor(Math.min(dw / 170, dh / 230)));
    W = Math.ceil(dw / P); H = Math.ceil(dh / P);
    cv.width = W; cv.height = H; stat.width = W; stat.height = H;
    cssW = W * P / dpr; cssH = H * P / dpr;
    cssLeft = (vw - cssW) / 2;
    cv.style.width = cssW + "px"; cv.style.height = cssH + "px"; cv.style.left = cssLeft + "px";

    var g = G;
    g.streetH = clamp(Math.round(H * 0.2), 34, 90);
    g.gy = H - g.streetH;
    g.dw = clamp(Math.round(Math.min(W * 0.46, H * 0.24)), 58, 96);
    g.dh = Math.round(g.dw * 0.96);
    g.archH = Math.round(g.dw * 0.2);
    g.ox = Math.round(W / 2 - g.dw / 2);
    g.doorTop = g.gy - g.dh;
    g.gfTop = g.doorTop - 8;
    g.floorH = clamp(Math.round(g.dw * 0.62), 40, 56);
    g.roofH = Math.round(g.floorH * 0.75);
    g.n = Math.max(1, Math.floor((g.gfTop - 3 - g.roofH - Math.round(H * 0.12)) / g.floorH));
    g.eaveY = g.gfTop - 3 - g.n * g.floorH;
    g.roofTop = g.eaveY - g.roofH;
    if (W < 260) { g.bx0 = -2; g.bx1 = W + 2; }
    else { var bw = clamp(Math.round(g.dw * 3.2), 200, 280); g.bx0 = Math.round(W / 2 - bw / 2); g.bx1 = g.bx0 + bw; }
    g.lw = Math.round(g.dw * 0.17);
    // interior perspective
    g.vx = g.ox + g.dw / 2; g.vy = g.doorTop + Math.round(g.dh * 0.42); g.s = 0.58;
    g.L = Math.round(g.vx - g.dw / 2 * g.s); g.R = Math.round(g.vx + g.dw / 2 * g.s);
    g.T = Math.round(g.vy - (g.vy - g.doorTop) * g.s); g.Bt = Math.round(g.vy + (g.gy - g.vy) * g.s);
    g.lampY = g.doorTop + g.archH + Math.round(g.dh * 0.1);
    g.lanX = g.ox + g.dw + 4 + g.lw + 9; g.lanY = g.gfTop + 12;
    // the box: 3/4 view, front face bottom-left at (boxX, boxY)
    g.fw = 30; g.fh = 17; g.sd = 8; g.su = 5;
    g.boxX = Math.round(g.vx - 19); g.boxY = g.gy - 3;
    placeLink();
    renderStatic();
    initRain();
  }

  function placeLink() {
    var g = G, k = P / dpr;
    var x = g.boxX - 4, y = g.boxY - g.fh - g.su - 8, w = g.fw + g.sd + 8, h = g.fh + g.su + 12;
    var bottom = window.innerHeight - cssH; // canvas anchored to bottom
    var L = cssLeft + x * k, T = bottom + y * k, Wd = w * k, Ht = h * k;
    var pad = Math.max(0, (48 - Math.min(Wd, Ht)) / 2);
    link.style.left = (L - pad) + "px"; link.style.top = (T - pad) + "px";
    link.style.width = (Wd + pad * 2) + "px"; link.style.height = (Ht + pad * 2) + "px";
  }

  // ---------- static scene ----------
  function inOpening(x, y) {
    var g = G;
    if (x < g.ox || x >= g.ox + g.dw || y >= g.gy || y < g.doorTop) return false;
    if (y >= g.doorTop + g.archH) return true;
    var cx = g.ox + (g.dw - 1) / 2, rx = g.dw / 2, dy = (g.doorTop + g.archH - y - 0.5) / g.archH;
    return Math.abs(x - cx) <= rx * Math.sqrt(Math.max(0, 1 - dy * dy));
  }

  function renderStatic() {
    var N = W * H;
    A = new Float32Array(N * 3); Z = new Uint8Array(N);
    WETM = new Float32Array(N); SPILL = new Uint8Array(N); WARM = new Float32Array(N);
    R = rng(7 + W * 31 + H);
    wins = []; lights = [];
    drawSky();
    drawFar();
    if (G.bx0 > 0) drawNeighbor(-2, G.bx0, G.eaveY - 10, K.blue, K.tileRed, 11);
    if (G.bx1 < W) drawNeighbor(G.bx1, W + 2, G.eaveY + 8, K.pinkWall, K.slate, 23);
    drawMain();
    drawStreet();
    drawDoorway();
    drawLeaves();
    drawLantern();
    drawBike();
    // spill polygon of the doorway light onto street + leaves
    var g = G, sp = Math.round((H - g.gy) * 0.55);
    poly([[g.ox + 1, g.gy - 1], [g.ox + g.dw - 1, g.gy - 1], [g.ox + g.dw + sp, H + 1], [g.ox - sp, H + 1]], function (x, y) {
      if (x >= 0 && y >= 0 && x < W && y < H) SPILL[y * W + x] = 1;
    });
    lights.push({ x: g.vx, y: g.lampY + 4, r: g.dw * 1.3, i: 1.25, c: [1, 0.74, 0.44], kind: "pendant" });
    lights.push({ x: g.lanX + 3, y: g.lanY + 4, r: Math.min(46, g.dw * 0.7), i: 0.95, c: [1, 0.8, 0.52], kind: "out" });
    wins.forEach(function (w) {
      if (w.state === 1) lights.push({ x: w.x + w.w / 2, y: w.y + w.h / 2, r: w.w * 0.95, i: 0.55, c: [1, 0.76, 0.46], kind: "win" });
      if (w.state === 2) lights.push({ x: w.x + w.w / 2, y: w.y + w.h / 2, r: w.w * 0.8, i: 0.4, c: [0.55, 0.7, 1], kind: "win" });
    });
    redraw();
  }

  // re-run only the windows + lighting (after a tap toggles a window)
  function relightWindows() {
    lights = lights.filter(function (l) { return l.kind !== "win"; });
    wins.forEach(function (w) {
      drawWindowGlass(w);
      if (w.state === 1) lights.push({ x: w.x + w.w / 2, y: w.y + w.h / 2, r: w.w * 0.95, i: 0.55, c: [1, 0.76, 0.46], kind: "win" });
      if (w.state === 2) lights.push({ x: w.x + w.w / 2, y: w.y + w.h / 2, r: w.w * 0.8, i: 0.4, c: [0.55, 0.7, 1], kind: "win" });
    });
    redraw();
  }

  function drawSky() {
    zone = 0;
    var st = K.sky, end = G.roofTop + 14;
    for (var y = 0; y < H; y++) {
      var t = clamp(y / end, 0, 1) * (st.length - 1), i = Math.floor(t), f = t - i;
      for (var x = 0; x < W; x++) put(x, y, (f > bay(x, y) && i + 1 < st.length) ? st[i + 1] : st[i]);
    }
    // thin clouds
    for (var c = 0; c < 4; c++) {
      var cy = Math.round(G.roofTop * (0.15 + R() * 0.55)), cx = R() * W, len = 20 + R() * 50;
      for (var k = 0; k < len; k++) if (R() > 0.25) put(cx + k, cy + (k > len * 0.6 ? 1 : 0), mix(K.cloud, K.sky[3], R() * 0.4));
    }
    // moon, with a soft halo
    var mx = Math.round(W * 0.2), my = Math.round(Math.min(26, G.roofTop * 0.3));
    for (var yy = -12; yy <= 12; yy++) for (var xx = -12; xx <= 12; xx++) {
      var d = Math.sqrt(xx * xx + yy * yy);
      if (d < 12 && d > 6 && (12 - d) / 6 * 0.35 > bay(mx + xx, my + yy)) put(mx + xx, my + yy, mix(K.sky[1], K.sky[3], 0.6));
      if (d <= 5.2) {
        var dc = Math.sqrt((xx - 2.5) * (xx - 2.5) + (yy + 1.5) * (yy + 1.5));
        if (dc > 4.6) { zone = 4; put(mx + xx, my + yy, d > 4.4 ? mix(K.moon, K.sky[2], 0.35) : K.moon); zone = 0; }
      }
    }
    G.stars = [];
    var ns = Math.floor(W * G.roofTop / 150);
    for (var s = 0; s < ns; s++) G.stars.push({ x: R() * W | 0, y: R() * G.roofTop * 0.8 | 0, p: R() * 6.28, b: R() < 0.12 });
  }

  function drawFar() {
    zone = 3;
    var g = G, x = -4, baseY = g.roofTop + 6;
    while (x < W) {
      var w = 14 + R() * 26 | 0, top = baseY - (4 + R() * Math.min(22, g.roofTop * 0.3)) | 0;
      rect(x, top, w, g.gy - top, K.far);
      if (R() < 0.7) { var cxh = x + 3 + R() * (w - 6) | 0; rect(cxh, top - 5, 3, 5, K.far); }
      if (R() < 0.5) { // pitched roof
        for (var k = 0; k < w / 2; k++) rect(x + k, top - Math.min(k, w - k) * 0.5, 1, 1 + Math.min(k, w - k) * 0.5, K.far);
      }
      for (var wy = top + 4; wy < baseY + 10; wy += 6) for (var wx = x + 2; wx < x + w - 2; wx += 5)
        if (R() < 0.08) { zone = 4; rect(wx, wy, 2, 2, mix(K.farWin, K.far, R() * 0.4)); zone = 3; }
      x += w;
    }
    // copper spire
    var sx = Math.round(W * (W < 260 ? 0.8 : 0.72)), spTop = Math.max(8, g.roofTop - 66);
    var bodyTop = spTop + 30;
    rect(sx - 5, bodyTop, 10, g.gy - bodyTop, K.far);
    rect(sx - 4, bodyTop + 6, 8, 2, K.spire);
    rect(sx - 2, bodyTop + 10, 4, 6, mix(K.farWin, K.far, 0.2));
    for (var y = spTop; y < bodyTop; y++) {
      var hw = (y - spTop) / (bodyTop - spTop) * 5;
      rect(sx - hw, y, hw * 2 + 1, 1, K.spire);
      put(sx - hw, y, K.spireHi);
    }
    // twisted dragon-tail hint: bands
    for (var b = spTop + 8; b < bodyTop; b += 5) rect(sx - (b - spTop) / 30 * 5, b, (b - spTop) / 30 * 10 + 1, 1, mix(K.spire, K.far, 0.5));
    zone = 4; put(sx, spTop - 1, K.spireHi); put(sx, spTop - 2, K.spireHi); zone = 3;
  }

  function drawWindowGlass(w) {
    var x = w.x, y = w.y, ww = w.w, hh = w.h;
    zone = 4;
    for (var j = 0; j < hh; j++) for (var i = 0; i < ww; i++) {
      var c;
      if (w.state === 1) {
        c = mix(K.warmHi, K.warmLo, j / hh);
        if (i < 3 || i >= ww - 3) c = mix(K.curtain, K.warmLo, (i < 3 ? i : ww - 1 - i) * 0.2);
      } else if (w.state === 2) {
        c = mix([150, 180, 240], [80, 100, 170], j / hh);
      } else {
        c = K.glassDark;
        if (Math.abs((i - j * 0.6) - ww * 0.35) < 1.2 || Math.abs((i - j * 0.6) - ww * 0.55) < 0.6) c = K.glassRef;
      }
      put(x + i, y + j, c);
    }
    if (w.state === 1 && w.plant) { // silhouette plant in the window
      var px = x + 4, py = y + hh - 2;
      rect(px, py - 2, 4, 2, [120, 64, 40]);
      [[1, -4], [2, -6], [0, -5], [3, -5], [2, -8], [1, -7], [4, -7]].forEach(function (p) { rect(px + p[0], py + p[1], 1, 2, [70, 60, 40]); });
    }
    zone = 1;
    // mullions + frame
    rect(x, y, ww, 1, K.frame); rect(x, y + hh - 1, ww, 1, K.frame);
    rect(x, y, 1, hh, K.frame); rect(x + ww - 1, y, 1, hh, K.frame);
    rect(x + (ww >> 1), y, 1, hh, K.frame);
    rect(x, y + Math.round(hh * 0.38), ww, 1, K.frame);
  }

  function drawWindow(x, y, ww, hh, state, opts) {
    opts = opts || {};
    zone = 1;
    rect(x - 2, y - 3, ww + 4, hh + 4, K.cream);
    rect(x - 3, y - 5, ww + 6, 2, K.cream); rect(x - 3, y - 3, ww + 6, 1, K.creamSh);
    rect(x - 3, y + hh, ww + 6, 2, K.cream); rect(x - 3, y + hh + 2, ww + 6, 1, K.creamSh);
    var w = { x: x, y: y, w: ww, h: hh, state: state, plant: opts.plant };
    wins.push(w);
    drawWindowGlass(w);
    if (opts.flowers) {
      zone = 1;
      rect(x - 1, y + hh + 2, ww + 2, 4, K.flowerBox);
      rect(x - 1, y + hh + 2, ww + 2, 1, dk(K.flowerBox, 1.25));
      for (var i = -1; i < ww + 1; i++) {
        var h = 1 + (R() * 3 | 0);
        for (var j = 0; j < h; j++) put(x + i, y + hh + 1 - j, j === h - 1 && R() < 0.55 ? (R() < 0.6 ? K.red : K.pink) : K.leaf);
        if (R() < 0.3) put(x + i, y + hh + 6, K.leaf); // trailing
      }
    }
  }

  function drawNeighbor(x0, x1, eave, col, roofCol, seed) {
    var g = G;
    zone = 1;
    // roof band
    rect(x0, eave - 12, x1 - x0, 12, roofCol);
    for (var y = eave - 12; y < eave; y += 3) rect(x0, y, x1 - x0, 1, dk(roofCol, 0.8));
    rect(x0, eave - 13, x1 - x0, 1, dk(roofCol, 0.7));
    rect(x0, eave, x1 - x0, g.gy - eave, col);
    rect(x0, eave, x1 - x0, 2, K.cream); rect(x0, eave + 2, x1 - x0, 1, K.creamSh);
    for (var yy = eave + 3; yy < g.gy; yy++) for (var xx = x0; xx < x1; xx++) if (R() < 0.05) put(xx, yy, dk(col, 0.92));
    // windows: rows from ground up
    var ww = Math.round(g.floorH * 0.32), wh = Math.round(g.floorH * 0.55);
    var cnt = Math.max(1, Math.floor((x1 - x0 - 10) / (ww * 2.3)));
    for (var f = 0; ; f++) {
      var rowBottom = g.gy - 4 - f * g.floorH;
      var wy = rowBottom - wh - 4;
      if (wy - 6 < eave + 4) break;
      for (var i = 0; i < cnt; i++) {
        var wx = Math.round(x0 + 5 + (i + 0.5) * ((x1 - x0 - 10) / cnt) - ww / 2);
        if (f === 0 && i === (seed % cnt)) { // street door with fanlight
          zone = 1;

      if (kq <= 0) continue;
      OUT[j * 3] = Math.min(255, OUT[j * 3] * (1 - kq * 0.4) + src[s] * kq * 0.85);
      OUT[j * 3 + 1] = Math.min(255, OUT[j * 3 + 1] * (1 - kq * 0.4) + src[s + 1] * kq * 0.85);
      OUT[j * 3 + 2] = Math.min(255, OUT[j * 3 + 2] * (1 - kq * 0.4) + src[s + 2] * kq * 0.85);
    }
    for (var n = 0; n < N; n++) { d[n * 4] = OUT[n * 3]; d[n * 4 + 1] = OUT[n * 3 + 1]; d[n * 4 + 2] = OUT[n * 3 + 2]; d[n * 4 + 3] = 255; }
    sctx.putImageData(img, 0, 0);
  }

  // ---------- dynamic layer ----------
  var drops = [], splashes = [], smoke = [], motes = [];
  function initRain() {
    drops = []; splashes = []; smoke = []; motes = [];
    if (RM) return;
    var n = Math.floor(W * H / 1000);
    for (var i = 0; i < n; i++) drops.push(newDrop(true));
    for (var m = 0; m < 9; m++) motes.push({ x: Math.random(), y: Math.random(), v: 0.4 + Math.random() * 0.6, p: Math.random() * 6.28 });
  }
  function newDrop(any) {
    return { x: Math.random() * (W + 20) - 10, y: any ? Math.random() * H : -Math.random() * 30,
      v: H * (0.75 + Math.random() * 0.4), len: 2 + (Math.random() * 3 | 0),
      stop: G.gy + 2 + Math.random() * (H - G.gy - 2) };
  }
  function warmAt(x, y) { x = x | 0; y = y | 0; if (x < 0 || y < 0 || x >= W || y >= H) return 0; return WARM[y * W + x]; }

  function drawRain(dt) {
    for (var i = 0; i < drops.length; i++) {
      var d = drops[i];
      d.y += d.v * dt; d.x += d.v * dt * 0.12;
      if (d.y > d.stop) {
        if (Math.random() < 0.6) splashes.push({ x: d.x | 0, y: d.stop | 0, t: 0 });
        drops[i] = newDrop(false); continue;
      }
      var w = warmAt(d.x, d.y);
      ctx.fillStyle = w > 0.15 ? "rgba(255,226,175," + Math.min(0.75, 0.3 + w * 0.6) + ")" : "rgba(160,178,220,0.22)";
      for (var k = 0; k < d.len; k++) ctx.fillRect((d.x - k * 0.12) | 0, (d.y - k) | 0, 1, 1);
    }
    for (var s = splashes.length - 1; s >= 0; s--) {
      var p = splashes[s]; p.t += dt;
      if (p.t > (p.big ? 0.9 : 0.35)) { splashes.splice(s, 1); continue; }
      var rad = p.big ? 1 + p.t * 12 : 1 + p.t * 5, a = (p.big ? 0.55 : 0.4) * (1 - p.t / (p.big ? 0.9 : 0.35));
      var w2 = warmAt(p.x, p.y);
      ctx.fillStyle = w2 > 0.15 ? "rgba(255,226,175," + a + ")" : "rgba(170,186,225," + a + ")";
      ctx.fillRect(Math.round(p.x - rad), p.y, 1, 1); ctx.fillRect(Math.round(p.x + rad), p.y, 1, 1);
      if (rad > 2) { ctx.fillRect(Math.round(p.x - rad * 0.6), p.y - 1, 1, 1); ctx.fillRect(Math.round(p.x + rad * 0.6), p.y - 1, 1, 1);
        ctx.fillRect(Math.round(p.x - rad * 0.6), p.y + 1, 1, 1); ctx.fillRect(Math.round(p.x + rad * 0.6), p.y + 1, 1, 1); }
    }
  }

  function drawStars(t) {
    G.stars.forEach(function (s) {
      var a = RM ? 0.7 : 0.35 + 0.65 * Math.max(0, Math.sin(t * 0.7 + s.p));
      ctx.fillStyle = css(K.star, a); ctx.fillRect(s.x, s.y, 1, 1);
      if (s.b && a > 0.85) { ctx.fillStyle = css(K.star, 0.4); ctx.fillRect(s.x - 1, s.y, 3, 1); ctx.fillRect(s.x, s.y - 1, 1, 3); }
    });
  }

  function drawSmoke(dt) {
    if (RM || !G.smoke) return;
    if (Math.random() < dt * 2.2) smoke.push({ x: G.smoke.x + Math.random() * 3, y: G.smoke.y, t: 0, s: 1 + Math.random() });
    for (var i = smoke.length - 1; i >= 0; i--) {
      var p = smoke[i]; p.t += dt;
      if (p.t > 6) { smoke.splice(i, 1); continue; }
      p.y -= dt * 4; p.x += dt * (2 + p.t * 1.2);
      var sz = Math.round(p.s + p.t * 0.6);
      ctx.fillStyle = "rgba(150,150,180," + (0.16 * (1 - p.t / 6)) + ")";
      ctx.fillRect(p.x | 0, p.y | 0, sz, sz);
    }
  }

  function drawTV(t) {
    wins.forEach(function (w) {
      if (w.state !== 2) return;
      var k = 0.7 + 0.3 * Math.sin(t * 9) * Math.sin(t * 2.3 + 1), ph = Math.floor(t * 3) % 3;
      ctx.fillStyle = ["rgba(120,160,255,", "rgba(200,180,255,", "rgba(140,220,255,"][ph] + (0.18 + 0.2 * k) + ")";
      ctx.fillRect(w.x + 1, w.y + 1, w.w - 2, w.h - 2);
    });
  }

  function drawMotes(t) {
    if (RM) return;
    var g = G;
    motes.forEach(function (m) {
      var x = g.vx - g.dw * 0.3 + ((m.x * g.dw * 0.6 + Math.sin(t * 0.4 + m.p) * 3) % (g.dw * 0.6));
      var y = g.lampY + 6 + ((m.y * g.dh * 0.6 + t * m.v * 3) % (g.dh * 0.6));
      ctx.fillStyle = "rgba(255,230,170," + (0.25 + 0.25 * Math.sin(t * 1.3 + m.p)) + ")";
      ctx.fillRect(x | 0, y | 0, 1, 1);
    });
    // lamp flicker
    var fl = 0.05 * Math.sin(t * 2.1) + (Math.random() < 0.006 ? -0.12 : 0);
    if (fl < 0) { ctx.fillStyle = "rgba(10,8,20," + (-fl) + ")"; ctx.fillRect(g.ox, g.doorTop, g.dw, g.dh); }
  }

  // ---------- cat ----------
  var CAT_WALK = [
    ["k.k........", "kkk......k.", "ekk.....k..", "kkkkkkkkk..", ".kkkkkkk...", ".k.k..k.k..", ".k.k..k.k.."],
    ["k.k........", "kkk.......k", "ekk......k.", "kkkkkkkkk..", ".kkkkkkk...", "..kk..kk...", "..k....k..."]
  ];
  var CAT_SIT = [
    [".k..k..", ".kkkk..", ".ekke..", ".kkkk..", "..kk...", ".kkkk..", ".kkkkk.", ".kkkkkk", ".kk.k.k"],
    [".k..k..", ".kkkk..", ".kkkk..", ".kkkk..", "..kk...", ".kkkk..", ".kkkkk.", ".kkkkkk", ".kk.k.k"]
  ];
  var cat = { state: RM ? "sit" : "wait", wait: 3, x: 0, dir: -1, t: 0, sit: 0 };
  function catReset() { cat.x = G.L + Math.round((G.R - G.L) * 0.2); }
  function startCat() {
    cat.dir = Math.random() < 0.5 ? -1 : 1;
    cat.x = cat.dir < 0 ? G.R + 1 : G.L - 12;
    cat.sitAt = G.L + 8 + Math.random() * Math.max(4, G.R - G.L - 24);
    cat.sat = false; cat.state = "walk";
  }
  function updateCat(dt) {
    if (RM) return;
    if (cat.state === "wait") { cat.wait -= dt; if (cat.wait <= 0) startCat(); return; }
    cat.t += dt;
    if (cat.state === "walk") {
      cat.x += cat.dir * 6 * dt;
      if (!cat.sat && ((cat.dir < 0 && cat.x <= cat.sitAt) || (cat.dir > 0 && cat.x >= cat.sitAt))) { cat.state = "sit"; cat.sit = 3 + Math.random() * 4; cat.sat = true; }
      if ((cat.dir < 0 && cat.x < G.L - 12) || (cat.dir > 0 && cat.x > G.R + 1)) { cat.state = "wait"; cat.wait = 10 + Math.random() * 14; }
    } else if (cat.state === "sit") { cat.sit -= dt; if (cat.sit <= 0) cat.state = "walk"; }
  }
  function sprite(rows, x, y, pal, flip) {
    for (var r = 0; r < rows.length; r++) for (var i = 0; i < rows[r].length; i++) {
      var ch = rows[r][i]; if (ch === "." || !pal[ch]) continue;
      ctx.fillStyle = pal[ch]; ctx.fillRect(flip ? x + rows[r].length - 1 - i : x + i, y + r, 1, 1);
    }
  }
  function drawCat(t) {
    if (cat.state === "wait") return;
    if (RM && cat.x === 0) catReset();
    var g = G;
    ctx.save(); ctx.beginPath(); ctx.rect(g.L, g.T, g.R - g.L, g.Bt - g.T + 1); ctx.clip();
    var pal = { k: css(K.cat), e: css(K.eye) };
    if (cat.state === "walk") sprite(CAT_WALK[Math.floor(cat.t * 5) % 2], Math.round(cat.x), g.Bt - 7, pal, cat.dir > 0);
    else sprite(CAT_SIT[(t % 3.3) < 0.15 ? 1 : 0], Math.round(cat.x), g.Bt - 9, pal, false);
    ctx.restore();
  }

  // ---------- the box ----------
  var hover = false, opening = -1;
  function boxPx(x, y, c) { ctx.fillStyle = c; ctx.fillRect(x, y, 1, 1); }
  function drawBox(t, dt) {
    var g = G, fw = g.fw, fh = g.fh, sd = g.sd, su = g.su;
    var lift = hover && opening < 0 ? 1 : 0;
    var x = g.boxX, y = g.boxY - lift; // bottom-left of front face
    var top = y - fh + 1;
    // contact shadow
    ctx.fillStyle = "rgba(20,12,10,0.45)"; ctx.fillRect(x - 1, g.boxY + 1, fw + sd, 1);
    ctx.fillStyle = "rgba(20,12,10,0.25)"; ctx.fillRect(x + 2, g.boxY + 2, fw + sd - 4, 1);
    // side face
    for (var i = 0; i < sd; i++) {
      var o = Math.round((i + 1) * su / sd);
      ctx.fillStyle = css(mix(K.cardSide, [60, 40, 30], i / sd * 0.35));
      ctx.fillRect(x + fw + i, top - o, 1, fh - 1);
      ctx.fillStyle = css(dk(K.cardSide, 0.8)); ctx.fillRect(x + fw + i, top - o + fh - 1, 1, 1);
    }
    // front face
    ctx.fillStyle = css(K.cardFront); ctx.fillRect(x, top, fw, fh);
    ctx.fillStyle = css(mix(K.cardFront, [255, 230, 180], 0.25)); ctx.fillRect(x, top, 1, fh);
    ctx.fillStyle = css(dk(K.cardFront, 0.82)); ctx.fillRect(x, y, fw, 1); ctx.fillRect(x + fw - 1, top, 1, fh);
    // corrugation hint near bottom edge
    for (var cx = x + 2; cx < x + fw - 2; cx += 3) boxPx(cx, y - 1, css(dk(K.cardFront, 0.92)));
    // marker text
    function word(str, wx, wy) {
      for (var k = 0; k < str.length; k++) {
        var gl = GLYPH[str[k]], j = 0;
        for (var r = 0; r < 5; r++) for (var c = 0; c < 3; c++) if (gl[r][c] === "#") boxPx(wx + k * 4 + c, wy + r + j, css(K.marker));
      }
    }
    var open = opening >= 0 ? clamp(opening / 0.55, 0, 1) : 0;
    if (open <= 0) {
      // closed top with seam + tape
      for (var r2 = 1; r2 <= su; r2++) {
        var off = Math.round(r2 * sd / su);
        ctx.fillStyle = css(mix(K.cardTop, K.cardSide, r2 / su * 0.25)); ctx.fillRect(x + off - 1, top - r2, fw, 1);
        var seam = x + Math.round(fw / 2) + off - 1;
        ctx.fillStyle = css(K.tape); ctx.fillRect(seam - 2, top - r2, 4, 1);
      }
      ctx.fillStyle = css(mix(K.cardTop, [255, 240, 200], 0.3)); ctx.fillRect(x, top - 1, fw - 1, 1);
      ctx.fillStyle = css(K.tape); ctx.fillRect(x + Math.round(fw / 2) - 3, top, 4, 5);
      ctx.fillStyle = css(dk(K.tape, 0.85)); ctx.fillRect(x + Math.round(fw / 2) - 3, top + 4, 4, 1);
      // glint travelling along the tape every few seconds
      if (!RM) { var gp = (t % 5) / 0.8; if (gp < 1) boxPx(x + Math.round(fw / 2) - 3 + Math.round(gp * 4 + gp * su), top - Math.round(gp * su), "rgba(255,255,240,0.9)"); }
      if (hover) { ctx.fillStyle = "rgba(255,230,170,0.35)"; ctx.fillRect(x - 1, top - su - 1, fw + sd + 1, 1); }
    } else {
      // open: dark inside, flaps swinging out, light pouring up
      for (var r3 = 1; r3 <= su; r3++) { var o3 = Math.round(r3 * sd / su); ctx.fillStyle = css(K.cardIn); ctx.fillRect(x + o3, top - r3, fw - 2, 1); }
      var fl = Math.round(open * 9);
      ctx.fillStyle = css(K.cardTop);
      for (var k2 = 0; k2 < fl; k2++) { ctx.fillRect(x - Math.round(k2 * 0.6), top - k2 - 1, 3, 1); ctx.fillRect(x + fw + sd - 3 + Math.round(k2 * 0.6), top - su - k2, 3, 1); }
      var beamH = Math.round(open * (fh * 3 + 20));
      for (var b = 0; b < beamH; b++) {
        var a = (1 - b / beamH) * 0.55 * open;
        ctx.fillStyle = "rgba(255,226,160," + a + ")";
        ctx.fillRect(x + 2 + Math.round(sd / 2), top - su - b, fw - 4, 1);
      }
      for (var s = 0; s < 10; s++) {
        var py = top - su - ((t * 30 + s * 9) % (beamH + 1)), px = x + 3 + ((s * 7) % (fw - 4));
        boxPx(px, Math.round(py), "rgba(255,245,210," + (0.8 * open) + ")");
      }
    }
    word("turn", x + Math.round((fw - 15) / 2), top + 5 + (open > 0 ? 0 : 0));
    word("around", x + Math.round((fw - 23) / 2), top + 11);
    if (opening >= 0) {
      opening += dt;
      if (opening > 0.75 && !G.navigated) { G.navigated = true; window.location.href = link.getAttribute("href"); }
    }
  }

  // ---------- loop ----------
  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.1, (now - last) / 1000); last = now;
    var t = now / 1000;
    updateCat(dt);
    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(stat, 0, 0);
    drawStars(t);
    drawSmoke(dt);
    drawTV(t);
    drawCat(t);
    drawMotes(t);
    drawBox(t, dt);
    drawRain(dt);
    requestAnimationFrame(frame);
  }

  // ---------- interaction ----------
  link.addEventListener("mouseenter", function () { hover = true; });
  link.addEventListener("mouseleave", function () { hover = false; });
  link.addEventListener("focus", function () { hover = true; });
  link.addEventListener("blur", function () { hover = false; });
  link.addEventListener("click", function (e) {
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
    if (RM) return;
    e.preventDefault();
    if (opening < 0) { opening = 0; hover = true; }
  });
  window.addEventListener("pageshow", function () { opening = -1; G.navigated = false; hover = false; });

  cv.addEventListener("click", function (e) {
    var rectC = cv.getBoundingClientRect();
    var x = (e.clientX - rectC.left) / rectC.width * W, y = (e.clientY - rectC.top) / rectC.height * H;
    // windows toggle their lights
    for (var i = 0; i < wins.length; i++) {
      var w = wins[i];
      if (x >= w.x - 3 && x < w.x + w.w + 3 && y >= w.y - 3 && y < w.y + w.h + 3) {
        w.state = w.state === 0 ? 1 : 0; relightWindows(); return;
      }
    }
    // the cat stops to look at you
    if (cat.state !== "wait" && Math.abs(x - cat.x - 5) < 9 && y > G.Bt - 14 && y < G.Bt + 3) { cat.state = "sit"; cat.sit = 4; cat.sat = true; return; }
    // street: a ripple
    if (y > G.gy) splashes.push({ x: Math.round(x), y: Math.round(y), t: 0, big: true });
  });

  var rt;
  window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(layout, 100); });
  layout();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
