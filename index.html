<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>garage</title>
<meta name="description" content="Jonathan Tari's garage.">
<meta name="theme-color" content="#c7c2b9">
<style>
  html, body { margin: 0; height: 100%; background: #c7c2b9; overflow: hidden; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
  canvas { position: fixed; bottom: 0; display: block; image-rendering: pixelated; image-rendering: crisp-edges; -webkit-tap-highlight-color: transparent; }
  #crate { position: fixed; display: block; border-radius: 6px; -webkit-tap-highlight-color: transparent; }
  #crate:focus-visible { outline: 2px solid #f2a34b; outline-offset: 3px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<h1 class="sr">Jonathan Tari's garage</h1>
<canvas id="c" aria-hidden="true"></canvas>
<a id="crate" href="/turnaround/" aria-label="Turnaround"></a>
<script>
(function () {
  "use strict";
  var cv = document.getElementById("c"), ctx = cv.getContext("2d");
  var link = document.getElementById("crate");
  var RM = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function mk() { var c = document.createElement("canvas"); return { c: c, x: c.getContext("2d") }; }
  var SKY = mk(), BASE = mk(), GLOW = mk();

  // ---------- utils ----------
  var BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  function bay(x, y) { return (BAY[((y & 3) << 2) | (x & 3)] + 0.5) / 16; }
  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function hx(s) { return [parseInt(s.substr(1, 2), 16), parseInt(s.substr(3, 2), 16), parseInt(s.substr(5, 2), 16)]; }
  function mix(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
  function dk(c, k) { return [c[0] * k, c[1] * k, c[2] * k]; }
  function css(c, a) { return "rgba(" + (c[0] | 0) + "," + (c[1] | 0) + "," + (c[2] | 0) + "," + (a == null ? 1 : a) + ")"; }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

  var K = {
    skyDay: ["#4f8fcc", "#67a2d6", "#86b7e0", "#a8cce9", "#c6def0"].map(hx),
    skyNight: ["#0e1228", "#161b3c", "#202852", "#313868", "#454273"].map(hx),
    star: hx("#fff3d6"), moon: hx("#f4e7c0"),
    // house
    siding: hx("#45484f"), sidingLn: hx("#383b41"), sidingHi: hx("#4f525a"),
    shingle: hx("#4a4d54"), shingleLn: hx("#3b3e44"),
    roofEdge: hx("#26282c"), soffit: hx("#5c5f66"),
    upper: hx("#a29c91"), upperLn: hx("#8f897f"), slabRoof: hx("#34363b"),
    stucco: hx("#8d8c88"), stuccoLo: hx("#7f7e7a"),
    trim: hx("#f1efe9"), trimSh: hx("#c9c6be"), frame: hx("#55585f"),
    glassDay: hx("#9fc0d8"), glassDayLo: hx("#6f93b0"), glassNight: hx("#1a2038"),
    warmHi: hx("#ffcf7a"), warmLo: hx("#f09a3e"), blind: hx("#d27a2c"),
    // ground
    grass: hx("#6a974a"), grassLo: hx("#5c8840"), grassHi: hx("#80ad5a"), grassDk: hx("#4f773a"),
    drive: hx("#bdb7ad"), driveLn: hx("#a29c92"), driveTrk: hx("#b1aba1"),
    wall: hx("#9f9d97"), wallCap: hx("#bab8b2"), wallSh: hx("#85837e"),
    walk: hx("#c7c2b9"), walkLn: hx("#aaa59c"),
    shrub: hx("#46703f"), shrubHi: hx("#5b8a4f"), flower: hx("#d8423e"),
    // garage interior
    ceil: hx("#b5ad9e"), wallIn: hx("#aea38f"), backIn: hx("#a39884"), floorIn: hx("#938e86"), floorSt: hx("#86817a"),
    track: hx("#55565e"), panel: hx("#4a4d54"), panelLn: hx("#3a3d43"), opener: hx("#3e3f45"),
    peg: hx("#9a7c58"), pegHole: hx("#6e5638"), metal: hx("#6a6d76"), steel: hx("#9a9ea8"), wood: hx("#a8784a"), woodDk: hx("#6e4a2c"),
    shelf: hx("#5e6068"), bins: ["#4f6f92", "#a2643f", "#c2a46a", "#5f7f5d", "#8a8d96", "#9c4f4f"].map(hx),
    card: hx("#b88d5a"), cardDk: hx("#99734a"), tape: hx("#d9c08c"),
    skiA: hx("#c8473f"), skiB: hx("#e6e2da"), hose: hx("#4f8a4a"),
    bulbOff: hx("#d9d5c8"), bulbOn: hx("#fff1c4"), cord: hx("#2a2a2e"), bead: hx("#d0b070"),
    // the crate
    crate: hx("#3f6fa3"), crateHi: hx("#5686ba"), crateLo: hx("#2f5582"), crateIn: hx("#223d5e"), hole: hx("#1d2f46"),
    sticker: hx("#f3eee2"), stickerLn: hx("#d6cfbd"), ink: hx("#2a2a30"), amber: hx("#f2a34b"),
    // trees
    trunk: hx("#5a4636"), leaf: hx("#4f7d3e"), leafHi: hx("#679950"), leafLo: hx("#3f6633"),
    // mountains
    mDay: hx("#7e919e"), mDayPine: hx("#6e828f"), fhDay: hx("#647a6d"), fhDayPine: hx("#566b5f"),
    slabDay: hx("#c3b19a"), slabDayHi: hx("#d9c9b3"), slabDayLo: hx("#9d8f80"),
    mNight: hx("#1b2143"), mNightPine: hx("#171d3c"), fhNight: hx("#151a35"), fhNightPine: hx("#121730"),
    slabNight: hx("#272e55"), slabNightHi: hx("#2e3660"), slabNightLo: hx("#20274a"),
    // cat
    cat: hx("#18161b"), catW: hx("#ecebe6"), eye: hx("#e8c84a")
  };

  // zones: 0 sky (transparent), 1 exterior, 2 garage interior, 3 far (unlit), 4 emissive, 5 ground
  var P, W, H, dpr, cssW, cssH, cssLeft, night;
  var A, Z, SPILL;
  var zone = 1, R;
  var G = {}, wins = [];
  var S = { bulb: true, porch: true, flick: 0, pull: -1 };

  function put(x, y, c) {
    x = x | 0; y = y | 0;
    if (x < 0 || y < 0 || x >= W || y >= H) return;
    var i = y * W + x; A[i * 3] = c[0]; A[i * 3 + 1] = c[1]; A[i * 3 + 2] = c[2]; Z[i] = zone;
  }
  function rect(x, y, w, h, c) {
    x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
    for (var j = 0; j < h; j++) for (var i = 0; i < w; i++) put(x + i, y + j, c);
  }
  function poly(pts, fn) {
    var minY = 1e9, maxY = -1e9, n = pts.length;
    for (var k = 0; k < n; k++) { minY = Math.min(minY, pts[k][1]); maxY = Math.max(maxY, pts[k][1]); }
    for (var y = Math.floor(minY); y <= Math.ceil(maxY); y++) {
      var sy = y + 0.5, xs = [];
      for (var e = 0; e < n; e++) {
        var a = pts[e], b = pts[(e + 1) % n];
        if ((a[1] <= sy && b[1] > sy) || (b[1] <= sy && a[1] > sy)) xs.push(a[0] + (sy - a[1]) * (b[0] - a[0]) / (b[1] - a[1]));
      }
      xs.sort(function (p, q) { return p - q; });
      for (var m = 0; m + 1 < xs.length; m += 2)
        for (var x = Math.round(xs[m]); x < Math.round(xs[m + 1]); x++) fn(x, y);
    }
  }
  function blob(cx, cy, rx, ry, fn) {
    for (var y = Math.floor(cy - ry); y <= cy + ry; y++) for (var x = Math.floor(cx - rx); x <= cx + rx; x++) {
      var d = ((x + 0.5 - cx) / rx) * ((x + 0.5 - cx) / rx) + ((y + 0.5 - cy) / ry) * ((y + 0.5 - cy) / ry);
      if (d <= 1) fn(x, y, d);
    }
  }
  function line(x0, y0, x1, y1, c) {
    x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
    var dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1, dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1, err = dx + dy;
    for (;;) { put(x0, y0, c); if (x0 === x1 && y0 === y1) break; var e2 = 2 * err; if (e2 >= dy) { err += dy; x0 += sx; } if (e2 <= dx) { err += dx; y0 += sy; } }
  }
  function ring(cx, cy, r, c) { for (var a = 0; a < 48; a++) { var t = a / 48 * 6.2832; put(Math.round(cx + Math.cos(t) * r), Math.round(cy + Math.sin(t) * r), c); } }

  var GLYPH = {
    t: [".#.", "###", ".#.", ".#.", "..#"],
    u: ["...", "#.#", "#.#", "#.#", ".##"],
    r: ["...", "#.#", "##.", "#..", "#.."],
    n: ["...", "##.", "#.#", "#.#", "#.#"],
    a: ["...", "##.", "..#", ".##", "###"],
    o: ["...", ".#.", "#.#", "#.#", ".#."],
    d: ["..#", "..#", ".##", "#.#", ".##"]
  };

  function isNight() {
    var q = location.search;
    if (/[?&]night/.test(q)) return true;
    if (/[?&]day/.test(q)) return false;
    var d = new Date(), start = new Date(d.getFullYear(), 0, 0);
    var doy = (d - start) / 864e5, hr = d.getHours() + d.getMinutes() / 60;
    var len = 12 + 4 * Math.cos(2 * Math.PI * (doy - 172) / 365);
    return hr < 12.8 - len / 2 || hr > 12.8 + len / 2;
  }

  // ---------- layout ----------
  function layout() {
    dpr = window.devicePixelRatio || 1;
    var vw = window.innerWidth, vh = window.innerHeight, dw = vw * dpr, dh = vh * dpr;
    P = Math.max(2, Math.floor(Math.min(dw / 160, dh / 215)));
    W = Math.ceil(dw / P); H = Math.ceil(dh / P);
    [cv, SKY.c, BASE.c, GLOW.c].forEach(function (c) { c.width = W; c.height = H; });
    cssW = W * P / dpr; cssH = H * P / dpr; cssLeft = (vw - cssW) / 2;
    cv.style.width = cssW + "px"; cv.style.height = cssH + "px"; cv.style.left = cssLeft + "px";

    var g = G, tall = H / W > 1.5;
    g.tall = tall;
    g.swH = 7;
    g.streetH = tall ? Math.round(H * 0.22) : clamp(Math.round(H * 0.2), 34, 70);
    g.gy = H - g.streetH;
    g.gw = tall ? Math.round(W * 0.62) : clamp(Math.round(Math.min(W * 0.4, H * 0.45)), 80, 140);
    g.gh = Math.round(g.gw * 0.62);
    g.gx = tall ? W - 14 - g.gw : Math.round(W * 0.56 - g.gw / 2);
    g.gTop = g.gy - g.gh;
    g.floor = g.gTop - 8;
    g.bodyR = g.gx + g.gw + 12;
    g.bodyL = g.gx - g.gw;
    g.cxB = (g.bodyL + g.bodyR) / 2;
    g.half = (g.bodyR - g.bodyL) / 2 + 5;
    g.slope = 0.47;
    g.eave = g.floor - Math.round(g.gw * 0.2);
    g.peak = Math.round(g.eave - g.half * g.slope);
    g.upTop = g.peak - Math.round(g.gw * 0.27);
    g.mTop = Math.max(Math.round(H * 0.07), Math.round(g.peak - (g.gy - g.peak) * 0.55));
    // interior perspective
    g.vx = g.gx + g.gw / 2; g.vy = g.gTop + Math.round(g.gh * 0.42); g.s = 0.6;
    g.L = Math.round(g.vx - g.gw / 2 * g.s); g.R = Math.round(g.vx + g.gw / 2 * g.s);
    g.T = Math.round(g.vy - (g.vy - g.gTop) * g.s); g.Bt = Math.round(g.vy + (g.gy - g.vy) * g.s);
    g.pH = Math.max(4, Math.round(g.gh * 0.08));
    g.bulbX = Math.round(g.vx - g.gw * 0.08); g.bulbY = g.gTop + g.pH + Math.round(g.gh * 0.1);
    g.sconce = { x: g.gx - 10, y: g.gTop + 8 };
    // milk crate: bottom-left of the front face
    g.fw = 50; g.fh = 22; g.sd = 9; g.su = 5;
    g.cx = Math.round(g.vx - g.fw / 2 - 4); g.cy = g.gy - 3;

    night = isNight();
    S.bulb = !/[?&]dark/.test(location.search); S.porch = true;
    placeLink();
    render();
    initDynamic();
  }

  function placeLink() {
    var g = G, k = P / dpr, bottom = window.innerHeight - cssH;
    var x = g.cx - 3, y = g.cy - g.fh - g.su - 14, w = g.fw + g.sd + 6, h = g.fh + g.su + 18;
    var L = cssLeft + x * k, T = bottom + y * k, Wd = w * k, Ht = h * k, pad = Math.max(0, (48 - Math.min(Wd, Ht)) / 2);
    link.style.left = (L - pad) + "px"; link.style.top = (T - pad) + "px";
    link.style.width = (Wd + pad * 2) + "px"; link.style.height = (Ht + pad * 2) + "px";
  }

  // ---------- static scene ----------
  function render() {
    var N = W * H;
    A = new Float32Array(N * 3); Z = new Uint8Array(N); SPILL = new Uint8Array(N);
    R = rng(17 + W * 7 + H * 3);
    wins = [];
    drawSky();
    drawMountains();
    drawUpperBox();
    drawFacade();
    drawGarage();
    drawGround();
    drawTrees();
    var g = G, sp = Math.round((g.H5 = H - g.swH - g.gy) * 0.35);
    poly([[g.gx, g.gy], [g.gx + g.gw, g.gy], [g.gx + g.gw + sp, H], [g.gx - sp, H]], function (x, y) {
      if (x >= 0 && y >= 0 && x < W && y < H) SPILL[y * W + x] = 1;
    });
    shadeAll();
  }

  function drawSky() {
    var st = night ? K.skyNight : K.skyDay, end = G.eave;
    var img = SKY.x.createImageData(W, H), d = img.data;
    for (var y = 0; y < H; y++) {
      var t = clamp(y / end, 0, 1) * (st.length - 1), i = Math.floor(t), f = t - i;
      for (var x = 0; x < W; x++) {
        var c = (f > bay(x, y) && i + 1 < st.length) ? st[i + 1] : st[i], o = (y * W + x) * 4;
        d[o] = c[0]; d[o + 1] = c[1]; d[o + 2] = c[2]; d[o + 3] = 255;
      }
    }
    SKY.x.putImageData(img, 0, 0);
    if (night) {
      var mx = Math.round(W * (G.tall ? 0.22 : 0.18)), my = Math.round(Math.max(10, G.mTop * 0.45));
      for (var yy = -11; yy <= 11; yy++) for (var xx = -11; xx <= 11; xx++) {
        var dd = Math.sqrt(xx * xx + yy * yy);
        if (dd < 11 && dd > 6 && (11 - dd) / 5 * 0.3 > bay(mx + xx, my + yy)) { SKY.x.fillStyle = css(mix(st[1], st[3], 0.55)); SKY.x.fillRect(mx + xx, my + yy, 1, 1); }
        if (dd <= 5.2 && Math.sqrt((xx + 2.5) * (xx + 2.5) + (yy + 1.5) * (yy + 1.5)) > 4.6) { SKY.x.fillStyle = css(K.moon); SKY.x.fillRect(mx + xx, my + yy, 1, 1); }
      }
    }
  }

  // Flatirons: a forested ridge, with long tilted sandstone slabs leaning up-left
  function ridge(x) {
    var g = G, pts = [[0, 0.55], [0.1, 0.36], [0.2, 0.2], [0.3, 0.1], [0.42, 0.06], [0.55, 0.0], [0.68, 0.04], [0.8, 0.14], [0.9, 0.24], [1, 0.32]];
    var u = x / W;
    for (var i = 0; i < pts.length - 1; i++) if (u <= pts[i + 1][0]) {
      var t = (u - pts[i][0]) / (pts[i + 1][0] - pts[i][0]), s = t * t * (3 - 2 * t);
      return g.mTop + (pts[i][1] + (pts[i + 1][1] - pts[i][1]) * s) * (g.gy - g.mTop) * 0.62 + Math.sin(x * 0.6) * 0.6;
    }
    return g.mTop + 0.3 * (g.gy - g.mTop) * 0.7;
  }
  function drawMountains() {
    zone = 3;
    var g = G, m = night ? K.mNight : K.mDay, mp = night ? K.mNightPine : K.mDayPine;
    for (var x = 0; x < W; x++) {
      var ry = Math.round(ridge(x));
      for (var y = ry; y < g.gy; y++) put(x, y, ((x * 7 + y * 3) % 11 === 0 || (bay(x, y) > 0.82 && (y - ry) % 3 === 0)) ? mp : m);
    }
    // slabs: broad tilted plates, steep shaded left face, long sunlit right face
    var sl = night ? [K.slabNight, K.slabNightHi, K.slabNightLo] : [K.slabDay, K.slabDayHi, K.slabDayLo];
    var range = g.gy - g.mTop;
    [[0.1, 0.1, 0.13], [0.155, 0.12, 0.16], [0.21, 0.13, 0.19], [0.265, 0.14, 0.21], [0.32, 0.12, 0.18], [0.37, 0.1, 0.14]].forEach(function (s) {
      var ax = Math.round(W * s[0]), ay = Math.round(ridge(ax)) + 1, w = Math.round(range * s[1]), h = Math.round(range * s[2]);
      var lx = ax - w * 0.3, rx = ax + w * 0.7, spx = ax + w * 0.12;
      poly([[ax, ay], [rx, ay + h], [lx, ay + h]], function (x, y) {
        var t = (y - ay) / h, spine = ax + (spx - ax) * t;
        var c = x < spine ? sl[2] : sl[0];
        if (x >= spine && x < spine + 1.2) c = sl[1];
        if (y < ridge(x) + 1) return;
        put(x, y, c);
      });
    });
    // forested foothills in front
    var fh = night ? K.fhNight : K.fhDay, fp = night ? K.fhNightPine : K.fhDayPine;
    for (var x2 = 0; x2 < W; x2++) {
      var top = Math.round(g.gy - range * 0.3 + Math.sin(x2 * 0.08) * 3 + Math.sin(x2 * 0.31) * 1.5 - (x2 % 4 === 0 ? 1 : 0));
      for (var y2 = top; y2 < g.gy; y2++) put(x2, y2, (bay(x2, y2) > 0.75 && (y2 + x2) % 3 === 0) ? fp : fh);
    }
  }

  function drawUpperBox() {
    var g = G, x0 = Math.round(g.cxB - g.gw * 0.95), x1 = Math.round(g.cxB - 4), top = g.upTop, bot = g.peak + 20;
    zone = 1;
    for (var y = top; y < bot; y++) for (var x = x0; x < x1; x++) put(x, y, (y - top) % 4 === 3 ? K.upperLn : K.upper);
    rect(x0 - 5, top - 3, x1 - x0 + 8, 3, K.slabRoof); rect(x0 - 5, top, x1 - x0 + 8, 1, dk(K.upper, 0.7));
    var ww = Math.round(g.gw * 0.15), wh = Math.round(g.gw * 0.17);
    var w1 = window2(Math.round(x0 + (x1 - x0) * 0.22), top + 6, ww, wh, false);
    window2(Math.round(x0 + (x1 - x0) * 0.62), top + 6, Math.round(ww * 0.8), wh, night);
    G.boxWin = w1;
  }

  function window2(x, y, w, h, lit, opts) {
    opts = opts || {};
    zone = 1;
    rect(x - 2, y - 2, w + 4, h + 4, K.trim);
    rect(x - 2, y + h + 1, w + 4, 1, K.trimSh);
    var win = { x: x, y: y, w: w, h: h, lit: lit, blinds: opts.blinds, split: opts.split };
    wins.push(win);
    glass(win);
    return win;
  }
  function glass(win) {
    var x = win.x, y = win.y, w = win.w, h = win.h, bl = Math.round(h * 0.52);
    zone = 4;
    for (var j = 0; j < h; j++) for (var i = 0; i < w; i++) {
      var c;
      if (night && win.lit) {
        c = mix(K.warmHi, K.warmLo, j / h);
        if (win.blinds && j < bl) c = (j % 3 === 2) ? K.blind : mix(K.warmHi, K.blind, 0.25);
        if (win.blinds && j === bl) c = dk(K.blind, 0.6);
      } else if (night) {
        c = K.glassNight;
        if (win.blinds && j < bl && j % 3 === 2) c = mix(K.glassNight, [60, 66, 96], 0.6);
      } else {
        c = mix(K.glassDay, K.glassDayLo, j / h);
        if (win.blinds && j < bl && j % 3 === 2) c = mix(c, [235, 235, 230], 0.35);
        var dg = i + j * 0.7;
        if (Math.abs(dg - w * 0.5) < 1.1 || Math.abs(dg - w * 0.75) < 0.6) c = mix(c, [235, 245, 252], 0.55);
      }
      put(x + i, y + j, c);
    }
    zone = 1;
    if (win.split) rect(x + Math.round(w * win.split), y, 1, h, K.trim);
  }

  function drawFacade() {
    var g = G, cx = g.cxB, L = g.bodyL, Rr = g.bodyR;
    zone = 1;
    // gable wall (shingles) + lower wall (lap siding)
    poly([[L, g.eave + 0.5], [cx, g.peak + 2], [Rr, g.eave + 0.5], [Rr, g.floor], [L, g.floor]], function (x, y) {
      var r = (y - g.peak) / 3 | 0, c = K.shingle;
      if ((y - g.peak) % 3 === 2) c = K.shingleLn;
      else if ((x + (r % 2) * 3) % 6 === 0) c = K.shingleLn;
      put(x, y, c);
    });
    for (var y = g.floor; y < g.gy; y++) for (var x = L; x < Rr; x++) {

  function drawCat(t) {
    if (cat.mode === "idle") return;
    var blink = (t % 3.7) < 0.15, dim = night ? 0.45 : 1;
    if (cat.mode === "window") {
      var w = G.catWin;
      ctx.save(); ctx.beginPath(); ctx.rect(w.x, w.y, w.w, w.h); ctx.clip();
      var rise = Math.min(1, cat.t / 1), fall = Math.max(0, (cat.t - cat.sitFor + 1) / 1);
      sprite(SIT[blink ? 1 : 0], w.x + Math.round(w.w * 0.55) - 4, w.y + w.h - 9 + Math.round((1 - rise + fall) * 10), false, night && w.lit ? 0.75 : dim);
      ctx.restore(); return;
    }
    var x = Math.round(cat.x);
    if (!night && cat.mode === "drive") { ctx.fillStyle = "rgba(0,0,0,0.16)"; ctx.fillRect(x + 1, cat.y + 7, 10, 1); }
    if (cat.sitting) sprite(SIT[blink ? 1 : 0], x + 2, cat.y - 2, false, dim);
    else sprite(WALK[Math.floor(cat.t * 5) % 2], x, cat.y, cat.dir > 0, dim);
  }

  // ---------- the milk crate ----------
  var hover = false, pressed = -1;
  function crateLift(t) {
    if (RM) return 0;
    var ph = t % 7;
    if (ph > 6) return Math.round(Math.sin((ph - 6) * Math.PI) * 3);
    return 0;
  }
  function drawCrate(t, glow) {
    var g = G, fw = g.fw, fh = g.fh, sd = g.sd, su = g.su;
    var lift = pressed >= 0 ? -1 : (hover ? 2 : crateLift(t));
    var x = g.cx, y = g.cy - lift, top = y - fh + 1;
    var k = night && !S.bulb && !glow ? 0.35 : (night ? 1 : (S.bulb ? 0.98 : 0.6));
    if (glow) k = Math.max(k, 0.8);
    function c(col) { return css(dk(col, k)); }
    // shadow (shrinks as it lifts)
    ctx.fillStyle = "rgba(15,12,10," + (0.4 - lift * 0.08) + ")"; ctx.fillRect(x - 1 + lift, g.cy + 1, fw + sd - lift * 2, 1);
    // back rim + contents sticking out
    var rimY = top - su;
    // contents (behind front face): rolled plans, a wrench, a plant, a book, a pennant
    function px(xx, yy, col) { ctx.fillStyle = c(col); ctx.fillRect(xx, yy, 1, 1); }
    ctx.fillStyle = c(K.crateIn);
    for (var r = 1; r <= su; r++) ctx.fillRect(x + Math.round(r * sd / su), top - r, fw - 1, 1);
    // rolled blueprints, leaning
    for (var i = 0; i < 16; i++) { px(x + 8 + Math.round(i * 0.35), top - 2 - i, [150, 186, 216]); px(x + 9 + Math.round(i * 0.35), top - 2 - i, [120, 156, 190]); }
    px(x + 13, top - 18, [220, 230, 240]); px(x + 14, top - 18, [220, 230, 240]);
    // a book
    ctx.fillStyle = c([150, 58, 52]); ctx.fillRect(x + 18, top - 9, 4, 9); ctx.fillStyle = c([226, 210, 170]); ctx.fillRect(x + 18, top - 9, 4, 1);
    // a wrench
    for (var j = 0; j < 9; j++) px(x + 27 + Math.round(j * -0.2), top - 2 - j, K.steel);
    px(x + 24, top - 12, K.steel); px(x + 26, top - 12, K.steel); px(x + 25, top - 11, K.steel);
    // a little potted plant
    ctx.fillStyle = c([176, 96, 60]); ctx.fillRect(x + 33, top - 5, 5, 5);
    [[34, -8], [35, -10], [36, -9], [33, -9], [37, -11], [35, -12], [34, -11], [36, -7]].forEach(function (p) { px(x + p[0], top + p[1], [90, 140, 72]); });
    // a pennant on a stick
    for (var s = 0; s < 14; s++) px(x + 42, top - 2 - s, K.woodDk);
    ctx.fillStyle = c(K.amber); ctx.fillRect(x + 43, top - 15, 4, 1); ctx.fillRect(x + 43, top - 14, 3, 1); ctx.fillRect(x + 43, top - 13, 2, 1); ctx.fillRect(x + 43, top - 12, 1, 1);
    // rims (back + right) drawn over the contents' bottoms
    ctx.fillStyle = c(K.crateHi); ctx.fillRect(x + sd, rimY, fw, 1);
    for (var r2 = 0; r2 <= su; r2++) { ctx.fillStyle = c(K.crateHi); ctx.fillRect(x + fw - 1 + Math.round(r2 * sd / su), top - r2, 1, 1); }
    // side face with holes
    for (var i2 = 0; i2 < sd; i2++) {
      var o = Math.round((i2 + 1) * su / sd);
      ctx.fillStyle = c(K.crateLo); ctx.fillRect(x + fw + i2, top - o, 1, fh);
      for (var hy = top - o + 3; hy < top - o + fh - 3; hy += 4) if (i2 > 1 && i2 < sd - 1) { ctx.fillStyle = glow ? css([255, 190, 100], 0.9) : c(K.hole); ctx.fillRect(x + fw + i2, hy, 1, 2); }
    }
    // front face: frame + grid of holes + handle slot
    ctx.fillStyle = c(K.crate); ctx.fillRect(x, top, fw, fh);
    for (var gy = top + 4; gy < top + fh - 3; gy += 4) for (var gx = x + 3; gx < x + fw - 4; gx += 4) {
      ctx.fillStyle = glow ? css([255, 196, 110], 0.55 + 0.4 * ((gx + gy) % 3 === 0 ? 1 : 0.5)) : c(K.hole);
      ctx.fillRect(gx, gy, 2, 2);
    }
    ctx.fillStyle = glow ? css([255, 210, 130]) : c(K.hole); ctx.fillRect(x + fw / 2 - 5, top + 1, 10, 2);
    ctx.fillStyle = c(K.crateHi); ctx.fillRect(x, top, fw, 1); ctx.fillRect(x, top, 1, fh);
    ctx.fillStyle = c(K.crateLo); ctx.fillRect(x, top + fh - 1, fw, 1); ctx.fillRect(x + fw - 1, top, 1, fh);
    // the sticker
    var sw = 45, sh = 9, sx = x + Math.round((fw - sw) / 2), syy = top + Math.round(fh * 0.55) - 4;
    ctx.fillStyle = c(hover ? mix(K.sticker, [255, 255, 255], 0.6) : K.sticker); ctx.fillRect(sx, syy, sw, sh);
    ctx.fillStyle = c(K.stickerLn); ctx.fillRect(sx, syy + sh - 1, sw, 1); ctx.fillRect(sx + sw - 1, syy, 1, sh);
    ctx.fillStyle = c(K.amber); ctx.fillRect(sx, syy, 2, sh);
    var str = "turnaround";
    ctx.fillStyle = c(K.ink);
    for (var kk = 0; kk < str.length; kk++) {
      var gl = GLYPH[str[kk]];
      for (var rr = 0; rr < 5; rr++) for (var cc = 0; cc < 3; cc++) if (gl[rr][cc] === "#") ctx.fillRect(sx + 4 + kk * 4 + cc, syy + 2 + rr, 1, 1);
    }
    // in the dark: light rising out of the crate
    if (glow) {
      var pulse = 0.55 + 0.25 * Math.sin(t * 1.3);
      for (var b = 0; b < 16; b++) { ctx.fillStyle = "rgba(255,200,110," + (pulse * (1 - b / 16) * 0.42) + ")"; ctx.fillRect(x + sd + 2, rimY - b, fw - 4, 1); }
      motes.forEach(function (m) {
        var ph = ((t * 0.18 * m.s + m.p) % 1 + 1) % 1;
        var mx = x + sd + 3 + m.x * (fw - 6) + Math.sin(t + m.p * 6) * 2, my = rimY - ph * 26;
        ctx.fillStyle = "rgba(255,226,160," + (0.8 * (1 - ph)) + ")"; ctx.fillRect(mx | 0, my | 0, 1, 1);
      });
    }
  }

  // ---------- bulb string ----------
  function drawString() {
    var g = G, ext = 0;
    if (S.pull >= 0) ext = Math.round(Math.sin(Math.min(1, S.pull / 0.35) * Math.PI) * 4);
    var len = 7 + ext, x = g.bulbX + 2, y0 = g.bulbY;
    var k = night && !S.bulb ? 0.4 : 1;
    ctx.fillStyle = css(dk(K.cord, 1)); ctx.fillRect(x, y0, 1, len);
    ctx.fillStyle = css(dk(K.bead, k)); ctx.fillRect(x, y0 + len, 1, 2);
  }

  // ---------- loop ----------
  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.1, (now - last) / 1000); last = now;
    var t = now / 1000;
    updateCat(dt);
    // pull-string animation and the switch
    if (S.pull >= 0) {
      S.pull += dt;
      if (S.pull > 0.17 && !S.pulled) { S.pulled = true; toggleBulb(); }
      if (S.pull > 0.35) { S.pull = -1; S.pulled = false; }
    }
    if (S.flick > 0) { S.flick -= dt; }
    ctx.drawImage(SKY.c, 0, 0);
    if (night) drawStars(t); else drawClouds(dt);
    ctx.drawImage(BASE.c, 0, 0);
    var glow = !S.bulb && S.flick <= 0;
    if (glow) { ctx.globalAlpha = 0.65 + 0.25 * Math.sin(t * 1.3); ctx.drawImage(GLOW.c, 0, 0); ctx.globalAlpha = 1; }
    if (S.flick > 0 && Math.floor(S.flick * 25) % 2) { ctx.fillStyle = "rgba(10,10,20,0.35)"; ctx.fillRect(G.gx, G.gTop, G.gw, G.gh); }
    drawString();
    drawCat(t);
    drawCrate(t, glow);
    if (pressed >= 0) {
      pressed += dt;
      if (pressed > 0.14 && !G.navigated) { G.navigated = true; location.href = link.getAttribute("href"); }
    }
    requestAnimationFrame(frame);
  }

  function toggleBulb() {
    S.bulb = !S.bulb;
    if (S.bulb && !RM) S.flick = 0.25;
    shadeAll();
  }

  // ---------- interaction ----------
  link.addEventListener("mouseenter", function () { hover = true; });
  link.addEventListener("mouseleave", function () { hover = false; });
  link.addEventListener("focus", function () { hover = true; });
  link.addEventListener("blur", function () { hover = false; });
  link.addEventListener("click", function (e) {
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.button || RM) return;
    e.preventDefault();
    if (pressed < 0) pressed = 0;
  });
  window.addEventListener("pageshow", function () { pressed = -1; G.navigated = false; hover = false; });

  cv.addEventListener("click", function (e) {
    var rc = cv.getBoundingClientRect(), g = G;
    var x = (e.clientX - rc.left) / rc.width * W, y = (e.clientY - rc.top) / rc.height * H;
    // the bulb's pull string
    if (Math.abs(x - g.bulbX - 1) < 7 && y > g.bulbY - 6 && y < g.bulbY + 14) { if (S.pull < 0) { S.pull = 0; S.pulled = false; } if (RM) toggleBulb(); return; }
    // the wall sconce
    if (Math.abs(x - g.sconce.x - 1) < 7 && Math.abs(y - g.sconce.y) < 9) { S.porch = !S.porch; shadeAll(); return; }
    // the cat stops and looks at you
    if ((cat.mode === "drive" || cat.mode === "roof") && !cat.sitting && Math.abs(x - cat.x - 5) < 9 && Math.abs(y - cat.y - 3) < 9) { cat.sitting = true; cat.sitT = 3; return; }
    // windows switch on and off at night
    if (!night) return;
    for (var i = 0; i < wins.length; i++) {
      var w = wins[i];
      if (x >= w.x - 2 && x < w.x + w.w + 2 && y >= w.y - 2 && y < w.y + w.h + 2) {
        w.lit = !w.lit;
        var prevZone = zone; glass(w); zone = prevZone; shadeAll(); return;
      }
    }
  });

  var rt;
  window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(layout, 100); });
  setInterval(function () { if (isNight() !== night) layout(); }, 60000);
  layout();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
