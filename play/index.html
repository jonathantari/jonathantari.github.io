<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>garage</title>
<meta name="description" content="Jonathan Tari's garage.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#c7c2b9">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<h1 class="sr">Jonathan Tari's garage</h1>
<canvas id="c" aria-hidden="true"></canvas>
<a id="crate" href="https://garage.jonathantari.com/turnaround/" aria-label="Turnaround"></a>
<canvas id="g" hidden aria-label="The game"></canvas>

<div id="hud" hidden>
  <button id="btnPack" aria-label="Backpack (B)" title="Backpack (B)">
    <svg viewBox="0 0 12 12" shape-rendering="crispEdges"><path fill="#d9a441" d="M3 3h6v1h1v7H2V4h1z"/><path fill="#a87a2c" d="M4 1h4v1h1v1H8V2H4v1H3V2h1zM4 6h4v3H4z"/><path fill="#f2d890" d="M5 7h2v1H5z"/></svg>
  </button>
  <button id="btnCam" aria-label="Take a photo (P)" title="Take a photo (P)">
    <svg viewBox="0 0 12 12" shape-rendering="crispEdges"><path fill="#4a4d54" d="M1 3h3V2h4v1h3v7H1z"/><path fill="#9aa0aa" d="M4 4h4v1h1v3H8v1H4V8H3V5h1z"/><path fill="#2a2a30" d="M5 5h2v1h1v1H7v1H5V7H4V6h1z"/><path fill="#f2dc70" d="M9 4h1v1H9z"/></svg>
  </button>
  <button id="btnSnd" aria-label="Sound on or off" title="Sound">
    <svg viewBox="0 0 12 12" shape-rendering="crispEdges"><path fill="#e8e2d4" d="M2 4h2l3-2v8L4 8H2z"/><path id="sndWaves" fill="#e8e2d4" d="M8 4h1v4H8zM10 3h1v6h-1z"/></svg>
  </button>
</div>

<div id="cap" role="status" aria-live="polite"></div>

<div id="box" hidden role="dialog" aria-live="polite">
  <p id="boxText"></p>
  <ul id="boxChoices"></ul>
</div>

<div id="pack" hidden role="dialog" aria-label="Backpack">
  <div class="bag">
    <div class="flap"><span>BACKPACK</span><button id="packClose" aria-label="Close">✕</button></div>
    <div class="tabs"><button id="tabItems" class="on">Items</button><button id="tabAlbum">Album</button></div>
    <p id="packHint"></p>
    <div id="packBody"></div>
  </div>
</div>

<div id="stick" hidden><i></i></div>
<div id="fade"></div>

<script src="js/landing.js"></script>
<script src="js/util.js"></script>
<script src="data/world.js"></script>
<script src="data/items.js"></script>
<script src="data/street.js"></script>
<script src="data/wander.js"></script>
<script src="data/trail.js"></script>
<script src="js/sprites.js"></script>
<script src="js/render3d.js"></script>
<script src="js/env.js"></script>
<script src="js/save.js"></script>
<script src="js/sfx.js"></script>
<script src="js/ui.js"></script>
<script src="js/scenes.js"></script>
<script src="js/actors.js"></script>
<script src="js/closeups.js"></script>
<script src="js/events.js"></script>
<script src="js/game.js"></script>
<script src="js/landingctl.js"></script>
<script>
  document.getElementById("btnSnd").addEventListener("click", function (e) {
    e.stopPropagation();
    var m = GG.sfx.toggle();
    document.getElementById("sndWaves").style.display = m ? "none" : "";
  });
  if (GG.sfx.muted()) document.getElementById("sndWaves").style.display = "none";
  GG.game.init();
</script>
</body>
</html>
